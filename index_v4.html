function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function prepareQuestions(qs) {
  return shuffleArray(qs).map(q => {
    const idx = shuffleArray([0,1,2,3]);
    return { q: q.q, options: idx.map(i => q.options[i]), correct: idx.indexOf(q.correct), image: q.image || '' };
  });
}
const NAME_REGEX = /^[А-Яа-яЁёA-Za-z]+$/;
const isValidName = s => NAME_REGEX.test(String(s).trim());

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeXml(s) {
  return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }
function interpret(s) {
  if (s >= 90) return '🏆 Отличное знание материала';
  if (s >= 75) return '👍 Хорошее знание';
  if (s >= 50) return '📘 Средний уровень, есть пробелы';
  return '⚠️ Материал усвоен плохо';
}
function genSessionCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
function sanitizeSheetName(name, idx) {
  let s = String(name).replace(/[:\\\/\?\*\[\]]/g, '_').trim();
  if (!s) s = 'Ученик_' + (idx + 1);
  return s.length > 31 ? s.slice(0, 28) + '...' : s;
}
function uniqueSheetNames(names) {
  const used = new Set();
  return names.map((raw, i) => {
    const base = sanitizeSheetName(raw, i);
    let name = base, k = 2;
    while (used.has(name)) { name = (base.length > 28 ? base.slice(0, 28) : base) + '_' + k; k++; }
    used.add(name); return name;
  });
}
function formatDate(ts) { return new Date(ts).toLocaleString('ru-RU'); }
function getStudentLocalId() {
  let id = localStorage.getItem('quiz_student_id');
  if (!id) { id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('quiz_student_id', id); }

}

function getCachedProfile(uid) {
  try {

    const p = JSON.parse(raw);
    return (p && p.uid === uid) ? p : null;
  } catch (e) { return null; }
}

}

function enableAntiCheat(studentRef) {
  antiCheatActive = true;
  antiCheatTabSwitches = 0;
  antiCheatCopyAttempts = 0;
  antiCheatRef = studentRef;
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.addEventListener('copy', onCopyAttempt);
  document.addEventListener('cut', onCopyAttempt);
  document.addEventListener('contextmenu', onContextMenuGlobal);
  document.addEventListener('dragstart', onDragStartGlobal);
  document.addEventListener('selectstart', onSelectStartGlobal);
}
function disableAntiCheat() {
  antiCheatActive = false;
  antiCheatRef = null;
  document.removeEventListener('visibilitychange', onVisibilityChange);
  document.removeEventListener('copy', onCopyAttempt);
  document.removeEventListener('cut', onCopyAttempt);
  document.removeEventListener('contextmenu', onContextMenuGlobal);
  document.removeEventListener('dragstart', onDragStartGlobal);
  document.removeEventListener('selectstart', onSelectStartGlobal);
}
function onVisibilityChange() {
  if (!antiCheatActive || !antiCheatRef) return;
  if (document.hidden) {
    antiCheatTabSwitches++;
    window.FB.update(antiCheatRef, { tabSwitches: antiCheatTabSwitches, lastTabSwitchAt: Date.now() }).catch(() => {});
    if (INSTANT_TERMINATE_ON_TAB_SWITCH) terminateTest('tab_switch');
  }
}
function onCopyAttempt(e) {
  if (!antiCheatActive) return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim().length > 0) {
    e.preventDefault();
    antiCheatCopyAttempts++;
    if (antiCheatRef) window.FB.update(antiCheatRef, { copyAttempts: antiCheatCopyAttempts }).catch(() => {});
  }
}
function onContextMenuGlobal(e) {
  if (!antiCheatActive) return;
  const area = document.getElementById('testArea');
  if (area && area.contains(e.target)) e.preventDefault();
}
function onDragStartGlobal(e) {
  if (!antiCheatActive) return;
  const area = document.getElementById('testArea');
  if (area && area.contains(e.target)) e.preventDefault();
}
function onSelectStartGlobal(e) {
  if (!antiCheatActive) return;
  const area = document.getElementById('testArea');
  if (area && area.contains(e.target)) e.preventDefault();
}

function terminateTest(reason) {
  if (state.terminated || state.finished) return;
  state.terminated = true;
  clearInterval(state.timer);
  disableAntiCheat();

  const correct  = state.answers.filter(a => a.correct).length;
  const wrong    = state.answers.length - correct;
  const answered = state.answers.length;
  const total    = state.questions.length;
  const score    = Math.round(correct * TOTAL_POINTS / total);

  const result = {
    studentName: state.studentName,
    testId: String(state.testId),
    testTitle: state.test.title,
    date: formatDate(Date.now()),
    timestamp: Date.now(),
    score, correct, wrong, total,
    answeredQuestions: answered,
    teacherId: state.teacherId,
    teacherEmail: state.teacherEmail,
    sessionCode: state.code,
    decision: '',
    tabSwitches: antiCheatTabSwitches,
    copyAttempts: antiCheatCopyAttempts,
    terminated: true,
    terminateReason: reason || 'tab_switch',
    answers: state.answers.map(a => ({
      questionText: a.questionText, correctText: a.correctText,
      selectedText: a.selectedText, correct: a.correct, image: a.image || ''
    }))
  };

  window.FB.update(state.studentRef, {
    status: 'terminated', terminatedAt: Date.now(), terminateReason: reason || 'tab_switch',
    score, correct, wrong, result,
    tabSwitches: antiCheatTabSwitches, copyAttempts: antiCheatCopyAttempts, online: true
  }).catch(() => {});
  const newRef = window.FB.push(window.FB.ref(window.FB.db, 'results'));
  window.FB.set(newRef, result).catch(() => {});

  const area = document.getElementById('testArea');
  if (area) {
    area.innerHTML = `
      <div class="student-hero" style="text-align:center;">
        <div style="font-size: 64px; margin-bottom: 8px;">🚫</div>
        <h2 style="color:#f87171;">Тест прерван</h2>
        <p style="font-size: 18px;">Вы покинули вкладку во время теста.</p>
        <p style="color:#94a3b8; max-width:520px; margin: 12px auto;">
          По правилам прохождения тест автоматически завершён. Учитель увидит ваш результат с отметкой о нарушении.
        </p>
        <div style="margin-top: 24px; padding: 16px 24px; background: rgba(15,23,42,0.7); border:1px solid #334155; border-radius: 12px; display: inline-block; text-align:left;">
          <div>Отвечено вопросов: <b>${answered} из ${total}</b></div>
          <div style="margin-top: 8px;">Правильных: <b class="ok">${correct}</b></div>
          <div style="margin-top: 8px;">Баллов: <b>${score} / 100</b></div>
        </div>
        <p style="margin-top: 24px; color:#94a3b8;">Можете закрыть вкладку.</p>
      </div>`;
  }
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportStudentsWorkbook(results, testTitle, testId) {
  if (!results || results.length === 0) { alert('Нет результатов для экспорта.'); return; }
  const names = uniqueSheetNames(results.map(r => r.studentName));

  const tables = results.map(r => studentSheetHTML(r)).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheetsXML}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head>
<body>${tables}</body></html>`.trim();
  downloadBlob(html, `Тест_${testTitle.slice(0, 30).replace(/[^\wа-яА-ЯёЁ]/g, '_')}_${Date.now()}.xls`, 'application/vnd.ms-excel;charset=utf-8;');
}
function exportFlatSummary(results, title, filename) {

function openModal(innerHTML, maxWidth) {
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.innerHTML = `<div class="modal" ${maxWidth ? `style="max-width:${maxWidth}px"` : ''}>${innerHTML}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
  return { el, close: () => el.remove(), $: s => el.querySelector(s), $$: s => el.querySelectorAll(s) };
}

/* ==================================================================
   АВТОРИЗАЦИЯ — ТОЛЬКО ВХОД (без регистрации)
   ==================================================================
   Учётные записи разработчика и учителей уже созданы.
   Новых учителей разработчик добавляет через свою панель.
   ================================================================== */
function renderAuth(expectedRole) {
  clearAllUnsubs();
  fbReady(() => {
    const isDev = expectedRole === 'developer';

    app.innerHTML = `
      <h1>${isDev ? '🛠 Вход разработчика' : '👨‍🏫 Вход учителя'}</h1>
      <div class="auth-form">
        <label class="label">Email</label>
        <input type="email" id="loginEmail" placeholder="you@school.ru" autocomplete="email">
        <label class="label">Пароль</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <p class="auth-error" id="loginError"></p>
        <button id="doLogin" class="green" style="width:100%; padding:14px;">Войти</button>
      </div>
      <p class="hint" style="text-align:center; margin-top:24px;">
        ${!isDev ? 'Нет аккаунта? Обратитесь к разработчику.<br>' : ''}
        <a href="?mode=student" style="color:#93c5fd;">Войти как ученик →</a>
      </p>`;

    document.getElementById('doLogin').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      const err   = document.getElementById('loginError');
      err.textContent = '';
      if (!email || !pass) { err.textContent = 'Заполните email и пароль'; return; }

      try {
        const cred = await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
        let profile = getCachedProfile(cred.user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${cred.user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(cred.user.uid, profile);
        }
        if (!profile) { err.textContent = 'Профиль не найден'; await window.FB.signOut(window.FB.auth); return; }
        if (isDev && profile.role !== 'developer') {
          err.textContent = 'Это не аккаунт разработчика';
          await window.FB.signOut(window.FB.auth);
          return;
        }
        if (!isDev && profile.role !== 'teacher') {
          err.textContent = 'Это не аккаунт учителя';
          await window.FB.signOut(window.FB.auth);
          return;
        }
        currentUser = { uid: cred.user.uid, email: profile.email || email, role: profile.role };
        if (profile.role === 'developer') renderDeveloperHome();
        else renderTeacherHome();
      } catch (e) {
        err.textContent = interpretAuthError(e);
      }
    }

    function interpretAuthError(e) {
      const c = e && e.code;
      if (c === 'auth/invalid-email') return 'Некорректный email';
      if (c === 'auth/user-not-found') return 'Пользователь не найден';
      if (c === 'auth/wrong-password') return 'Неверный пароль';
      if (c === 'auth/invalid-credential') return 'Неверный email или пароль';
      if (c === 'auth/too-many-requests') return 'Слишком много попыток. Подождите.';
      if (c === 'auth/network-request-failed') return 'Нет соединения с интернетом';
      return 'Ошибка: ' + (e.message || 'неизвестная');
    }
  });
}

    <p class="auth-error" id="editorError"></p>
    <div class="summary-actions" style="margin-top:20px;">
      <button id="saveTestBtn" class="green">💾 Сохранить</button>
      ${!isNew ? `<button id="deleteTestBtn" class="danger">🗑 Удалить тест</button>` : ''}
    </div>`, 900);

  let questions = JSON.parse(JSON.stringify(initial.questions));
  if (!questions.every(q => 'image' in q)) questions = questions.map(q => ({ ...q, image: q.image || '' }));

  function renderQuestions() {
    const cont = m.$('#questionsContainer');
    cont.innerHTML = questions.map((q, qi) => `
      <div class="question-editor" data-q="${qi}">
        <div class="q-number">Вопрос ${qi + 1}</div>
        <button class="small danger remove-q" data-remove="${qi}">Удалить</button>
        <label class="label">Формулировка</label>
        <textarea class="q-text" data-qi="${qi}" placeholder="Текст вопроса">${escapeHtml(q.q)}</textarea>
        <label class="label" style="margin-top:8px;">Варианты ответов (отметьте правильный)</label>
        ${q.options.map((opt, oi) => `
          <div class="opt-row">
            <input type="radio" name="correct-${qi}" data-correct="${qi}-${oi}" ${q.correct === oi ? 'checked' : ''}>
            <input type="text" class="opt-text" data-qi="${qi}" data-oi="${oi}" placeholder="Вариант ${String.fromCharCode(65 + oi)}" value="${escapeHtml(opt)}">
          </div>`).join('')}
        <label class="label" style="margin-top:10px;">🖼 Изображение к вопросу (URL, необязательно)</label>
        <input type="text" class="q-image" data-qi="${qi}" placeholder="https://example.com/image.jpg" value="${escapeHtml(q.image || '')}">
        <div class="q-image-preview" data-preview="${qi}">${q.image ? `<img src="${escapeAttr(q.image)}" class="preview-img">` : ''}</div>
      </div>`).join('');
    cont.querySelectorAll('.q-text').forEach(el => el.addEventListener('input', () => { questions[+el.dataset.qi].q = el.value; }));
    cont.querySelectorAll('.opt-text').forEach(el => el.addEventListener('input', () => { questions[+el.dataset.qi].options[+el.dataset.oi] = el.value; }));
    cont.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
      const [qi, oi] = el.dataset.correct.split('-').map(Number);
      questions[qi].correct = oi;
    }));
    cont.querySelectorAll('.q-image').forEach(el => el.addEventListener('input', () => {
      const qi = +el.dataset.qi;
      questions[qi].image = el.value.trim();
      const prev = cont.querySelector(`[data-preview="${qi}"]`);
      prev.innerHTML = el.value.trim() ? `<img src="${escapeAttr(el.value.trim())}" class="preview-img">` : '';
    }));
    cont.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
      if (questions.length === 1) { alert('Должен остаться хотя бы один вопрос.'); return; }
      questions.splice(+b.dataset.remove, 1);
      renderQuestions();
    });
  }
  renderQuestions();

  m.$('#addQuestionBtn').onclick = () => { questions.push({ q: '', options: ['','','',''], correct: 0, image: '' }); renderQuestions(); };
  m.$('#closeEditor').onclick = () => m.close();
  m.$('#saveTestBtn').onclick = async () => {
    const err = m.$('#editorError');
    err.textContent = '';
    const title = m.$('#testTitle').value.trim();
    if (!title) { err.textContent = 'Укажите название теста'; return; }
    if (questions.length === 0) { err.textContent = 'Добавьте хотя бы один вопрос'; return; }
    for (let i = 0; i < questions.length; i++) {
      if (!questions[i].q.trim()) { err.textContent = `Вопрос ${i+1}: пустая формулировка`; return; }
      if (questions[i].options.some(o => !o.trim())) { err.textContent = `Вопрос ${i+1}: все 4 варианта должны быть заполнены`; return; }
    }
    const now = Date.now();
    const id = testId || ('t_' + now + '_' + Math.random().toString(36).slice(2, 6));
    const payload = {
      title,
      intro: m.$('#testIntro').value.trim(),
      introImage: m.$('#testIntroImage').value.trim(),
      timePerQuestion: parseInt(m.$('#testTime').value, 10) || 20,
      questions: questions.map(q => ({ q: q.q, options: q.options, correct: q.correct, image: q.image || '' })),
      createdBy: currentUser.uid, updatedAt: now
    };
    if (isNew) payload.createdAt = now;
    try {
      if (isNew) await window.FB.set(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      else       await window.FB.update(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      testsCache[id] = payload;
      renderDeveloperTestsList();
      m.close();
    } catch (e) { err.textContent = 'Ошибка сохранения: ' + e.message; }
  };
  if (!isNew) {
    m.$('#deleteTestBtn').onclick = async () => {
      if (!confirm(`Удалить тест «${initial.title}»?`)) return;
      await window.FB.remove(window.FB.ref(window.FB.db, `tests/${testId}`));
      delete testsCache[testId];
      renderDeveloperTestsList();
      m.close();
    };
  }
}

async function clearOldResults() {
  if (!confirm('Удалить результаты старше 30 дней? Это действие необратимо.')) return;
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'results'));
  const data = snap.val() || {};
  const now = Date.now();
  const toDelete = Object.entries(data).filter(([_, r]) => now - (r.timestamp || 0) > OLD_RESULTS_TTL_MS);
  if (toDelete.length === 0) { alert('Нет результатов старше 30 дней.'); return; }
  for (const [id] of toDelete) await window.FB.remove(window.FB.ref(window.FB.db, `results/${id}`));
  alert(`Удалено ${toDelete.length} записей.`);
}

async function cleanupOldSessions() {
  if (!currentUser) return;
  try {
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'sessions'));
    const all = snap.val() || {};
    const now = Date.now();
    const del = [];
    for (const [code, s] of Object.entries(all)) {
      if (!s || !s.createdAt) continue;
      if (s.teacherId !== currentUser.uid && currentUser.role !== 'developer') continue;
      if (now - s.createdAt > SESSION_TTL_MS) del.push(code);
    }
    for (const code of del) await window.FB.remove(window.FB.ref(window.FB.db, `sessions/${code}`));
    if (del.length) console.log(`Автоочистка: удалено сессий — ${del.length}`);
  } catch (e) { console.error('cleanupOldSessions:', e); }
}

    <h2 class="no-print">👥 Ученики</h2>
    <div id="studentsArea" class="students-grid">Ожидание…</div>
    <h2 class="no-print" style="margin-top:32px;">📊 Результаты</h2>
    <div id="resultsArea" class="no-print"></div>`;
  document.getElementById('copyLink').onclick = () => {
    navigator.clipboard.writeText(location.origin + location.pathname + '?mode=student&session=' + code);
    alert('Ссылка скопирована');
  };
  document.getElementById('exportSessionBtn').onclick = async () => {
    const sSnap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
    const session = sSnap.val();
    const results = Object.values(session.students || {}).filter(x => x.result).map(x => x.result);
    exportStudentsWorkbook(results, session.testTitle, session.testId);
  };
  document.getElementById('closeBtn').onclick = async () => {
    if (!confirm(`Закрыть сессию ${code}?`)) return;
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { status: 'closed', closedAt: Date.now() });
  };
  subscribeSessionLive(code, test);
}

function subscribeSessionLive(code, test) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snapshot) => {
    const s = snapshot.val();
    if (!s) return;
    const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    const total = studentsArr.length;
    const done = studentsArr.filter(x => x.status === 'finished' || x.status === 'terminated').length;
    const active = studentsArr.filter(x => x.status === 'in_progress').length;
    const distracted = studentsArr.filter(x => x.tabSwitches && x.tabSwitches > 0).length;

    const elTotal = document.getElementById('cntTotal');
    if (elTotal) {
      elTotal.textContent = total;
      document.getElementById('cntDone').textContent = done;
      document.getElementById('cntActive').textContent = active;
      const elD = document.getElementById('cntDistracted');
      if (elD) elD.textContent = distracted;
    }

    const area = document.getElementById('studentsArea');
    if (area) {
      if (studentsArr.length === 0) {
        area.innerHTML = `<p class="hint">Ожидание учеников… Сообщите код <b>${code}</b>.</p>`;
      } else {
        area.innerHTML = studentsArr.map(st => {
          let statusText = '', cls = '', dot = '';
          if (st.status === 'in_progress') { cls = 'active'; statusText = `Отвечает: вопрос ${(st.currentQuestion || 0) + 1} из ${test.questions.length}`; dot = '<span class="dot"></span>'; }
          else if (st.status === 'finished') { cls = 'done'; statusText = `Завершил — ${st.score || 0} баллов`; dot = '<span class="dot"></span>'; }
          else if (st.status === 'terminated') { cls = 'terminated'; statusText = `🚫 Прерван — ${st.score || 0} баллов`; dot = '<span class="dot offline"></span>'; }
          else if (st.status === 'disconnected') { statusText = 'Отключился'; dot = '<span class="dot offline"></span>'; }
          else { statusText = 'Подключился'; dot = '<span class="dot"></span>'; }

          const hasSwitch = st.tabSwitches && st.tabSwitches > 0;
          const hasCopy = st.copyAttempts && st.copyAttempts > 0;
          const hasTerm = st.status === 'terminated';
          if (hasSwitch) cls += ' distracted';

          const warnings = [];
          if (hasTerm) warnings.push(`<div class="warn-badge critical">🚫 Прерван — покинул вкладку</div>`);
          if (hasSwitch && !hasTerm) warnings.push(`<div class="warn-badge ${st.tabSwitches >= 3 ? 'critical' : ''}">⚠ Отвлекался: ${st.tabSwitches} раз</div>`);
          if (hasCopy) warnings.push(`<div class="warn-badge">📋 Копировал: ${st.copyAttempts} раз</div>`);

          return `<div class="student-card ${cls}">
            <div class="name">${dot}${escapeHtml(st.studentName || '—')}</div>
            <div class="status">${escapeHtml(statusText)}</div>
            ${st.status === 'in_progress' ? `<div class="progress">Верно: ${st.correctSoFar || 0}</div>` : ''}
            ${warnings.join('')}
          </div>`;
        }).join('');
      }
    }

    const rArea = document.getElementById('resultsArea');
    if (rArea) {
      const finished = studentsArr.filter(x => x.result);
      if (finished.length === 0) { rArea.innerHTML = `<p class="hint">Ещё никто не завершил.</p>`; }
      else {
        const rows = finished.map((st, i) => {
          const r = st.result;
          const warn = (r.tabSwitches || r.copyAttempts || r.terminated)
            ? `<span class="warn-badge">${r.terminated ? '🚫 ' : ''}${r.tabSwitches ? '⚠ ' + r.tabSwitches + ' ' : ''}${r.copyAttempts ? '📋 ' + r.copyAttempts : ''}</span>`
            : '—';
          return `<tr>
            <td style="text-align:center;">${i + 1}</td>
            <td>${escapeHtml(r.studentName)}</td>
            <td style="text-align:center;">${r.correct}</td>
            <td style="text-align:center;">${r.wrong}</td>
            <td style="text-align:center;font-weight:bold;">${r.score}</td>
            <td style="text-align:center;">${warn}</td>
            <td class="action-cell">
              <button class="small" data-view="${st.id}">Открыть</button>
              <button class="small download" data-excel="${st.id}">📥</button>
            </td>
          </tr>`;
        }).join('');
        rArea.innerHTML = `<table>
          <thead><tr><th style="width:50px;">№</th><th>Ученик</th><th style="width:70px;">Верно</th><th style="width:70px;">Неверно</th><th style="width:60px;">Балл</th><th style="width:120px;">Тревоги</th><th style="width:160px;">Действия</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
        rArea.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
          const st = studentsArr.find(x => x.id === b.dataset.view);
          if (st && st.result) showStudentResult(st.result);
        });
        rArea.querySelectorAll('[data-excel]').forEach(b => b.onclick = () => {
          const st = studentsArr.find(x => x.id === b.dataset.excel);
          if (st && st.result) exportStudentsWorkbook([st.result], test.title, s.testId);
        });
      }
    }
  }));
}

function showStudentResult(rec) {
  const rows = rec.answers.map((a, i) => {
    const img = a.image ? `<img src="${escapeAttr(a.image)}" style="max-width:120px; max-height:80px; border-radius:4px; display:block; margin-bottom:4px;">` : '';
    return `<tr>
      <td>${i + 1}</td>
      <td>${img}</td>
      <td>${escapeHtml(a.questionText)}</td>
      <td>${escapeHtml(a.correctText)}</td>
      <td>${a.selectedText ? escapeHtml(a.selectedText) : '<i>нет ответа</i>'}</td>
      <td class="${a.correct ? 'ok' : 'bad'}">${a.correct ? '✔' : '✘'}</td>
    </tr>`;
  }).join('');
  const warnings = [];
  if (rec.terminated) warnings.push(`<span class="warn-badge critical">🚫 Тест прерван</span>`);
  if (rec.tabSwitches) warnings.push(`<span class="warn-badge critical">⚠ Отвлекался: ${rec.tabSwitches} раз</span>`);
  if (rec.copyAttempts) warnings.push(`<span class="warn-badge">📋 Копировал: ${rec.copyAttempts} раз</span>`);
  const m = openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
      <h2 style="margin:0;">${escapeHtml(rec.studentName)} — ${rec.score} / 100</h2>
      <button class="small back" id="mClose">Закрыть</button>
    </div>
    ${warnings.length ? `<div style="margin-bottom:12px;">${warnings.join(' ')}</div>` : ''}
    <table><tr><th>#</th><th>Рис.</th><th>Вопрос</th><th>Правильный ответ</th><th>Ответ ученика</th><th>Итог</th></tr>${rows}</table>
    <p style="margin-top:16px;">Правильных: <b class="ok">${rec.correct}</b> | Неправильных: <b class="bad">${rec.wrong}</b></p>`);
  m.$('#mClose').onclick = m.close;
}

function validateNames(showError) {
  const firstEl = document.getElementById('firstName');
  const lastEl  = document.getElementById('lastName');
  const err     = document.getElementById('nameError');
  const first = firstEl.value.trim(), last = lastEl.value.trim();
  let message = '';
  if (!first || !last) message = 'Заполните имя и фамилию';
  else if (!isValidName(first) || !isValidName(last)) message = 'Только русские и английские буквы (без цифр и знаков)';
  if (message) {
    if (showError) {
      err.textContent = message; err.style.display = 'block';
      if (first && !isValidName(first)) firstEl.classList.add('invalid');
      if (last && !isValidName(last)) lastEl.classList.add('invalid');
    }
    return null;
  }
  err.style.display = 'none';
  return { first, last };
}

async function tryStartStudent(code, test, sessionData) {
  const names = validateNames(true);
  if (!names) return;
  const studentName = `${names.last} ${names.first}`;
  const studentId = getStudentLocalId();
  const existing = Object.values(sessionData.students || {});
  if (existing.some(x => x.studentName === studentName)) { alert(`«${studentName}» уже участвует в этой сессии.`); return; }
  if (existing.length >= MAX_STUDENTS) { alert(`В сессии уже ${MAX_STUDENTS} учеников.`); return; }

  const studentRef = window.FB.ref(window.FB.db, `sessions/${code}/students/${studentId}`);
  try {
    await window.FB.set(studentRef, {
      studentName, joinedAt: Date.now(),
      status: 'in_progress', currentQuestion: 0, correctSoFar: 0, online: true,
      tabSwitches: 0, copyAttempts: 0
    });
    state = {
      code, test, testId: sessionData.testId,
      teacherId: sessionData.teacherId, teacherEmail: sessionData.teacherEmail,
      studentRef, studentId, studentName,
      timePerQuestion: test.timePerQuestion || TIME_PER_QUESTION,
      questions: prepareQuestions(test.questions),
      answers: [], qIndex: 0, answered: false, highlightIndex: -1, finished: false, terminated: false
    };
    enableAntiCheat(studentRef);
    document.getElementById('regArea').style.display = 'none';
    askQuestion();
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function askQuestion() {
  if (state.terminated || state.finished) return;
  const i = state.qIndex;
  if (i >= state.questions.length) return finishStudent();
  const q = state.questions[i];
  state.highlightIndex = -1;
  const timePerQ = state.timePerQuestion || TIME_PER_QUESTION;
  const imageHTML = q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}" alt=""></div>` : '';

  document.getElementById('testArea').innerHTML = `
    <div class="student-hero" style="margin-top:20px;">
      <div class="test-locked" id="testLocked">
        <h2 style="position:relative;z-index:1;">Вопрос ${i + 1} / ${state.questions.length}</h2>
        ${imageHTML}
        <p style="font-size:17px;position:relative;z-index:1;">${escapeHtml(q.q)}</p>
        <div id="options" style="position:relative;z-index:1;"></div>
        <div class="timer" style="position:relative;z-index:1;" id="timer">${timePerQ}</div>
      </div>
    </div>`;

  q.options.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.index = idx;
    b.innerHTML = `<b>${idx + 1}.</b> ${escapeHtml(opt)}`;
    b.onclick = () => selectAnswer(idx);
    document.getElementById('options').appendChild(b);
  });
  window.FB.update(state.studentRef, { currentQuestion: i, correctSoFar: state.answers.filter(a => a.correct).length, online: true, lastUpdate: Date.now() }).catch(() => {});
  let timeLeft = timePerQ;
  const tEl = document.getElementById('timer');
  state.timer = setInterval(() => {
    timeLeft--;
    if (tEl) tEl.textContent = timeLeft;
    if (timeLeft <= 0) { clearInterval(state.timer); selectAnswer(null); }
  }, 1000);
}

function updateHighlight() {
  document.querySelectorAll('.opt').forEach((b, i) => b.classList.toggle('highlighted', i === state.highlightIndex));
}

function selectAnswer(idx) {
  if (state.answered || state.terminated || state.finished) return;
  state.answered = true;
  clearInterval(state.timer);
  const q = state.questions[state.qIndex];
  const correct = idx !== null && idx === q.correct;
  const selectedText = idx !== null ? q.options[idx] : null;
  state.answers.push({ selected: idx, selectedText, correct, questionText: q.q, correctText: q.options[q.correct], image: q.image || '' });
  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true; b.classList.remove('highlighted');
    if (i === idx) b.classList.add('selected');
  });
  state.qIndex++;
  state.answered = false;
  setTimeout(askQuestion, 800);
}

async function finishStudent() {
  if (state.finished) return;
  state.finished = true;
  disableAntiCheat();
  const correct = state.answers.filter(a => a.correct).length;
  const wrong = state.answers.length - correct;
  const score = Math.round(correct * TOTAL_POINTS / state.questions.length);
  const result = {
    studentName: state.studentName, testId: String(state.testId), testTitle: state.test.title,
    date: formatDate(Date.now()), timestamp: Date.now(),
    score, correct, wrong, total: state.questions.length,
    teacherId: state.teacherId, teacherEmail: state.teacherEmail, sessionCode: state.code,
    decision: '', tabSwitches: antiCheatTabSwitches, copyAttempts: antiCheatCopyAttempts,
    answers: state.answers.map(a => ({ questionText: a.questionText, correctText: a.correctText, selectedText: a.selectedText, correct: a.correct, image: a.image || '' }))
  };
  try {
    await window.FB.update(state.studentRef, { status: 'finished', finishedAt: Date.now(), score, correct, wrong, result, online: true, tabSwitches: antiCheatTabSwitches, copyAttempts: antiCheatCopyAttempts });
    const newRef = window.FB.push(window.FB.ref(window.FB.db, 'results'));
    await window.FB.set(newRef, result);
  } catch (e) { console.error(e); }

  document.getElementById('testArea').innerHTML = `
    <div class="student-hero" style="margin-top:20px;text-align:center;">
      <h2 style="position:relative;z-index:1;">✅ Тест завершён</h2>
      <p style="position:relative;z-index:1;">Ученик: <b>${escapeHtml(state.studentName)}</b></p>
      <p style="position:relative;z-index:1;">Правильных: <b class="ok">${correct}</b> из ${state.questions.length}</p>
      <p style="position:relative;z-index:1;">Неправильных: <b class="bad">${wrong}</b></p>
      <div class="score" style="position:relative;z-index:1;">${score} / 100</div>
      <p style="text-align:center;font-size:18px;position:relative;z-index:1;">${interpret(score)}</p>
      <p style="text-align:center;margin-top:16px;color:#94a3b8;position:relative;z-index:1;">Можете закрыть вкладку. Учитель уже видит результат.</p>
    </div>`;
}

document.addEventListener('keydown', (e) => {
  if (!state || !state.questions || state.answered || state.terminated || state.finished) return;
  const opts = document.querySelectorAll('.opt');
  if (opts.length === 0) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); state.highlightIndex = Math.min(state.highlightIndex + 1, opts.length - 1); updateHighlight(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); state.highlightIndex = Math.max(0, state.highlightIndex - 1); updateHighlight(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (state.highlightIndex >= 0) selectAnswer(state.highlightIndex); }
  else if (e.key >= '1' && e.key <= '4') { e.preventDefault(); const idx = parseInt(e.key, 10) - 1; if (idx < opts.length) selectAnswer(idx); }
});

function boot() {
  loadTests();

  if (mode === 'developer') {
    document.body.classList.add('theme-developer');
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'developer') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'developer' };
          if (sessionCode) renderDeveloperSession();
          else renderDeveloperHome();
          return;
        }
      }
      if (sessionCode) renderDeveloperSession();
      else renderAuth('developer');
    });
  }
  else if (mode === 'teacher') {
    document.body.classList.add('theme-teacher');
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'teacher') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'teacher' };
          if (sessionCode) renderTeacherSession();
          else renderTeacherHome();
          return;
        }
      }
      if (sessionCode) renderTeacherSession();
      else renderAuth('teacher');
    });
  }
  else if (mode === 'student') {
    document.body.classList.add('theme-student');
    if (sessionCode) renderStudentSession();
    else renderStudentEnterCode();
  }
  else {
    document.body.classList.add('theme-home');
    renderMenu();
  }
}

fbReady(boot);
</script>
</body>
</html>
