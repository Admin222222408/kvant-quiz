<body>
<div class="container" id="app">

</div>

<script>
/* ==================================================================
   KVANT-QUIZ — FULL VERSION
   Бонусы: считаются по ОСТАТКУ времени на таймере.
   Пример: «остаток ≥ 15 сек → +3» означает «ответил в первые 5 секунд».
   ================================================================== */
const DEFAULT_BASE_POINTS = 5;
const DEFAULT_SPEED_TIERS = [
  { timeSec: 15, bonus: 3 },
  { timeSec: 10, bonus: 2 },
  { timeSec: 5,  bonus: 1 }
];
const MAX_STUDENTS = 30;
const SESSION_TTL_MS = 10 * 24 * 60 * 60 * 1000;
const OLD_RESULTS_TTL_MS = 30 * 24 * 60 * 60 * 1000;
const MAX_NAME_LEN = 25;
const MAX_IMG_SIZE_KB = 400;
const FIGURES = ['⬤', '⬛', '▲', '★'];
const SCHOOL_NAME = 'Кванториум';
const TIME_PER_QUESTION = 20;

const DEFAULT_TESTS = {
  seed_1: {
    title: 'Входной тест по БПЛА',
    shortName: 'ТВ_тест_БПЛА',
    status: 'published',
    antiCheatMode: 'soft',
    basePoints: 5,
    speedBonusTiers: [
      { timeSec: 15, bonus: 3 },
      { timeSec: 10, bonus: 2 },
      { timeSec: 5,  bonus: 1 }
    ],
    questions: [
      { q: "Как называется коптер с 8 моторами?", options: ["Пентакоптер","Октокоптер","Трикоптер","Гексакоптер"], correct: 1, image: '', time: null },
      { q: "Как обозначается сопротивление в законе Ома?", options: ["R","I","U","S"], correct: 0, image: '', time: null },
      { q: "В каких единицах измеряется напряжение?", options: ["Вольт","Кулон","Ампер","Ом"], correct: 0, image: '', time: null }
    ]
  },
  seed_2: {
    title: 'Компоненты квадрокоптера',
    shortName: 'Компл_квадро',
    status: 'published',
    antiCheatMode: 'soft',
    basePoints: 5,
    speedBonusTiers: [
      { timeSec: 15, bonus: 3 },
      { timeSec: 10, bonus: 2 },
      { timeSec: 5,  bonus: 1 }
    ],
    questions: [
      { q: "На какую основу крепятся все элементы дрона?", options: ["Полётный контроллер","Рама","Клей","ESC"], correct: 1, image: '', time: null },
      { q: "Какой компонент обрабатывает сигналы датчиков?", options: ["Приёмник","Аккумулятор","Полётный контроллер","Хомяк"], correct: 2, image: '', time: null }
    ]
  }

const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'menu';
const sessionCode = params.get('session') || null;

const app = document.getElementById('app');
let currentUser = null;
let testsCache = {};
let classesCache = {};
let activeUnsubs = [];
function trackUnsub(fn) { if (typeof fn === 'function') activeUnsubs.push(fn); }
function clearAllUnsubs() { activeUnsubs.forEach(fn => { try { fn(); } catch (e) {} }); activeUnsubs = []; }
let antiCheatActive = false, antiCheatRef = null;

/* ============ ХЕЛПЕРЫ БАЛЛОВ ============ */
function round1(n) { return Math.round(Number(n) * 10) / 10; }
function round2(n) { return Math.round(Number(n) * 100) / 100; }
function formatScore(n) {
  const v = Number(n) || 0;
  if (Math.abs(v - Math.round(v)) < 0.05) return String(Math.round(v));
  return String(v).replace('.', ',');
}
function getBasePoints(test) {
  if (!test) return DEFAULT_BASE_POINTS;
  if (test.basePoints != null) return round1(test.basePoints);
  return DEFAULT_BASE_POINTS;
}
// tiers теперь хранят МИНИМАЛЬНЫЙ ОСТАТОК времени (сек), при котором срабатывает бонус
function getSpeedTiers(test) {
  if (!test) return [];
  if (Array.isArray(test.speedBonusTiers)) {
    return test.speedBonusTiers
      .map(t => ({
        timeSec: Math.max(0, Math.round(Number(t.timeSec) || 0)),
        bonus: round1(t.bonus)
      }))
      .filter(t => t.timeSec > 0 && t.bonus > 0)
      .sort((a, b) => a.timeSec - b.timeSec);
  }
  // Миграция со старого формата speedBonusPct
  if (test.speedBonusPct != null && test.speedBonusPct > 0) {
    const base = getBasePoints(test);
    const maxBonus = round1(base * test.speedBonusPct / 100);
    const total = Number(test.timePerQuestion) || 20;
    return [
      { timeSec: Math.round(total * 0.75), bonus: round1(maxBonus * 0.8) },
      { timeSec: Math.round(total * 0.50), bonus: round1(maxBonus * 0.5) },
      { timeSec: Math.round(total * 0.25), bonus: round1(maxBonus * 0.2) }
    ].sort((a, b) => a.timeSec - b.timeSec);
  }
  return JSON.parse(JSON.stringify(DEFAULT_SPEED_TIERS));
}
function getMaxBonus(test) {
  const tiers = getSpeedTiers(test);
  if (!tiers.length) return 0;
  return tiers.reduce((m, t) => Math.max(m, t.bonus), 0);
}
function getMaxPerQuestion(test) {
  return round1(getBasePoints(test) + getMaxBonus(test));
}
function getMaxScore(test) {
  if (!test) return 0;
  const q = (test.questions || []).length;
  return round1(q * getMaxPerQuestion(test));
}
// Бонус по ОСТАТКУ: если на таймере осталось >= tier.timeSec → начислить tier.bonus
function calcSpeedBonus(test, timeSpentSec, timeTotalSec) {
  const tiers = getSpeedTiers(test);
  if (!tiers.length) return 0;
  const remaining = Math.max(0, (Number(timeTotalSec) || 0) - (Number(timeSpentSec) || 0));
  let best = 0;
  for (const tier of tiers) {
    if (remaining >= tier.timeSec) best = Math.max(best, tier.bonus);
  }
  return best;
}
function interpretPct(pct) {
  if (pct >= 90) return '🏆 Отличное знание материала';
  if (pct >= 75) return '👍 Хорошее знание';
  if (pct >= 50) return '📘 Средний уровень, есть пробелы';
  return '⚠️ Материал усвоен плохо';
}
function interpretScore(score, maxScore) {
  const pct = maxScore > 0 ? Math.round((score || 0) / maxScore * 100) : 0;
  return interpretPct(pct);
}

/* ============ БЕЗОПАСНЫЙ ОБРАБОТЧИК ============ */
function onClick(id, handler) {
  const el = document.getElementById(id);

/* ============ УТИЛИТЫ ============ */
const NAME_REGEX = /^[А-Яа-яЁёA-Za-z\-\s]+$/;
function isValidName(s) {
  const t = String(s).trim();
  if (t.length === 0 || t.length > MAX_NAME_LEN) return false;
  return NAME_REGEX.test(t);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeXml(s) {
  return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }
function genSessionCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
function genId(prefix) { return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
function sanitizeSheetName(name, idx) {
  let s = String(name).replace(/[:\\\/\?\*\[\]]/g, '_').trim();
  if (!s) s = 'Ученик_' + (idx + 1);
  return s.length > 31 ? s.slice(0, 28) + '...' : s;
}
function uniqueSheetNames(names) {
  const used = new Set();
  return names.map((raw, i) => {
    const base = sanitizeSheetName(raw, i);
    let name = base, k = 2;
    while (used.has(name)) { name = (base.length > 28 ? base.slice(0, 28) : base) + '_' + k; k++; }
    used.add(name); return name;
  });
}
function formatDate(ts) { return new Date(ts).toLocaleString('ru-RU'); }
function formatDateShort(ts) {
  const d = new Date(ts);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function formatTimeShort(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function getStudentLocalId() {
  let id = localStorage.getItem('quiz_student_id');
  if (!id) { id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('quiz_student_id', id); }

}

    const raw = localStorage.getItem('quiz_profile_' + uid);

function getInitial(email) { return (String(email || '?')[0] || '?').toUpperCase(); }
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    if (file.size / 1024 > MAX_IMG_SIZE_KB) { reject(new Error(`Файл больше ${MAX_IMG_SIZE_KB} КБ`)); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Ошибка чтения файла'));
    reader.readAsDataURL(file);
  });
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Ошибка чтения файла'));
    reader.readAsText(file, 'UTF-8');
  });
}

/* ============ ИМЯ ФАЙЛА EXCEL ============ */
function shortDateStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}${p(d.getMonth() + 1)}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function sanitizeFilename(s, maxLen = 40) {
  let t = String(s || '').trim()
    .replace(/[<>:"/\\|?*\x00-\x1f]/g, '')
    .replace(/[^\wа-яА-ЯёЁ _\-]+/g, '_')
    .replace(/\s+/g, ' ')
    .replace(/_+/g, '_')
    .replace(/^[_\s]+|[_\s]+$/g, '');
  if (!t) t = 'тест';
  return t.slice(0, maxLen);
}
function buildExcelFilename(testTitle, shortName, prefix) {
  const base = shortName && shortName.trim() ? shortName.trim() : (testTitle || 'тест');
  const clean = sanitizeFilename(base, 40);
  const stamp = shortDateStamp();
  return prefix ? `${prefix}_${clean}_${stamp}.xls` : `${clean}_${stamp}.xls`;
}

/* ============ АНТИЧИТ ============ */
function enableAntiCheat(studentRef, antiCheatMode) {
  antiCheatActive = true;
  antiCheatTabSwitches = 0;
  antiCheatCopyAttempts = 0;
  antiCheatRef = studentRef;
  syncState.antiCheatMode = antiCheatMode || 'soft';
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.addEventListener('copy', onCopyAttempt);
  document.addEventListener('cut', onCopyAttempt);
}
function disableAntiCheat() {
  antiCheatActive = false; antiCheatRef = null;
  document.removeEventListener('visibilitychange', onVisibilityChange);
  document.removeEventListener('copy', onCopyAttempt);
  document.removeEventListener('cut', onCopyAttempt);
}
function onVisibilityChange() {
  if (!antiCheatActive || !antiCheatRef) return;
  if (document.hidden) {
    antiCheatTabSwitches++;
    window.FB.update(antiCheatRef, { tabSwitches: antiCheatTabSwitches, lastTabSwitchAt: Date.now() }).catch(() => {});
  }
}
function onCopyAttempt(e) {
  if (!antiCheatActive) return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim().length > 0) {
    e.preventDefault();
    antiCheatCopyAttempts++;
    if (antiCheatRef) window.FB.update(antiCheatRef, { copyAttempts: antiCheatCopyAttempts }).catch(() => {});
  }
}

function studentSheetHTML(rec) {

    const verdict = a.correct ? '<span class="ok">✔ верно</span>' : '<span class="bad">✘ неверно</span>';

  </table>`;
}
function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportStudentsWorkbook(results, testTitle, testId, shortName) {
  if (!results || results.length === 0) { alert('Нет результатов'); return; }
  if (!shortName && testId && testsCache[testId]) shortName = testsCache[testId].shortName || '';
  const names = uniqueSheetNames(results.map(r => r.studentName));
  const sheetsXML = names.map(n => `<x:ExcelWorksheet><x:Name>${escapeXml(n)}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>`).join('');
  const tables = results.map(r => studentSheetHTML(r)).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheetsXML}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head><body>${tables}</body></html>`.trim();
  downloadBlob(html, buildExcelFilename(testTitle, shortName), 'application/vnd.ms-excel;charset=utf-8;');
}
function exportFlatSummary(results, title, filename) {
  if (!results || results.length === 0) { alert('Нет данных'); return; }
  const rows = results.sort((a,b) => b.timestamp - a.timestamp).map((r, i) => {

  }).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Сводка</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head><body><table>
  <tr><td colspan="10" class="title">${escapeHtml(title)}</td></tr>
  <tr><td colspan="10" style="height:8px;border:none;"></td></tr>

  <th class="c">Верно</th><th class="c">Неверно</th><th class="c">Балл</th><th class="c">Макс</th><th>Оценка</th></tr>

  downloadBlob(html, filename, 'application/vnd.ms-excel;charset=utf-8;');
}

function renderAuth(expectedRole) {
  clearAllUnsubs();
  fbReady(() => {
    const isDev = expectedRole === 'developer';
    document.body.className = isDev ? 'theme-developer' : 'theme-teacher';
    app.innerHTML = `<div class="auth-form" style="max-width:440px;margin:40px auto;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:0 20px 60px rgba(124,58,237,0.12);">
      <h1 style="text-align:center;">${isDev ? '🛠 Вход разработчика' : '👨‍🏫 Вход учителя'}</h1>
      <p class="hint" style="text-align:center;margin-bottom:24px;">${isDev ? 'Панель управления системой' : 'Кабинет для проведения тестов'}</p>
      <label class="label">Email</label>
      <input type="email" id="loginEmail" placeholder="you@school.ru" autocomplete="email">
      <label class="label">Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
      <p id="loginError" style="color:#ef4444;font-size:13px;font-weight:600;min-height:20px;margin:6px 0 10px;text-align:center;"></p>
      <button id="doLogin" class="green" style="width:100%;padding:14px;">Войти →</button>
      <p class="hint" style="text-align:center;margin-top:14px;"><a href="?mode=student" style="color:var(--violet);text-decoration:none;font-weight:600;">← Ко входу ученика</a></p>
    </div>`;
    document.getElementById('doLogin').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const err = document.getElementById('loginError');
      err.textContent = '';
      if (!email || !pass) { err.textContent = 'Заполните email и пароль'; return; }
      try {
        const cred = await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
        let profile = getCachedProfile(cred.user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${cred.user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(cred.user.uid, profile);
        }
        if (!profile) { err.textContent = 'Профиль не найден'; await window.FB.signOut(window.FB.auth); return; }
        if (isDev && profile.role !== 'developer') { err.textContent = 'Это не аккаунт разработчика'; await window.FB.signOut(window.FB.auth); return; }
        if (!isDev && profile.role !== 'teacher') { err.textContent = 'Это не аккаунт учителя'; await window.FB.signOut(window.FB.auth); return; }
        currentUser = { uid: cred.user.uid, email: profile.email || email, role: profile.role };
        if (profile.role === 'developer') renderDeveloperHome();
        else renderTeacherHome();
      } catch (e) { err.textContent = interpretAuthError(e); }
    }
    function interpretAuthError(e) {
      const c = e && e.code;
      if (c === 'auth/invalid-email') return 'Некорректный email';
      if (c === 'auth/user-not-found') return 'Пользователь не найден';
      if (c === 'auth/wrong-password') return 'Неверный пароль';
      if (c === 'auth/invalid-credential') return 'Неверный email или пароль';
      if (c === 'auth/too-many-requests') return 'Слишком много попыток';
      if (c === 'auth/network-request-failed') return 'Нет соединения';
      return 'Ошибка: ' + (e.message || 'неизвестная');
    }
  });
}

async function loadHelpMessages(m, isDev) {
  const list = m.$('#helpList');
  if (!list) return;
  const ref = window.FB.ref(window.FB.db, 'help_messages');
  trackUnsub(window.FB.onValue(ref, (snap) => {
    const data = snap.val() || {};
    let list0 = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    if (!isDev) list0 = list0.filter(x => x.fromEmail === currentUser.email);
    list0.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    if (list0.length === 0) { list.innerHTML = `<p class="hint">${isDev ? 'Обращений пока нет.' : 'Вы ещё не писали разработчику.'}</p>`; return; }
    list.innerHTML = list0.map(msg => {
      const replies = msg.replies ? Object.values(msg.replies) : [];
      return `<div class="help-msg">
        <div class="hm-head"><span>${escapeHtml(msg.fromEmail || '?')} · ${formatDate(msg.timestamp || 0)}</span>
        ${isDev ? `<button class="small danger" data-del-help="${msg.id}" style="padding:2px 8px;font-size:11px;">🗑</button>` : ''}</div>
        <div class="hm-text">${escapeHtml(msg.text || '')}</div>
        ${replies.length ? `<div class="hm-replies">${replies.map(r => `<div class="help-reply ${r.from === 'developer' ? 'dev' : ''}">
          <div class="hr-head">${r.from === 'developer' ? '🛠 Разработчик' : '👨‍🏫 Учитель'} · ${formatDate(r.timestamp || 0)}</div>
          <div class="hr-text">${escapeHtml(r.text || '')}</div>
        </div>`).join('')}</div>` : ''}
        ${isDev ? `<textarea data-reply-input="${msg.id}" placeholder="Ответить..." style="min-height:50px;margin-top:8px;"></textarea>
          <button class="small green" data-reply-btn="${msg.id}">Ответить</button>` : ''}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-del-help]').forEach(b => b.onclick = async () => {
      if (!confirm('Удалить обращение?')) return;
      await window.FB.remove(window.FB.ref(window.FB.db, `help_messages/${b.dataset.delHelp}`));
    });
    list.querySelectorAll('[data-reply-btn]').forEach(b => b.onclick = async () => {
      const id = b.dataset.replyBtn;
      const ta = list.querySelector(`[data-reply-input="${id}"]`);
      const text = ta.value.trim();
      if (!text) { alert('Введите текст'); return; }
      const rid = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      await window.FB.update(window.FB.ref(window.FB.db, `help_messages/${id}/replies/${rid}`), { from: 'developer', text, timestamp: Date.now() });
      ta.value = '';
    });
  }));
}
async function sendHelpMsg(m) {
  const ta = m.$('#helpNewText');
  const text = ta.value.trim();
  if (!text) { alert('Введите текст'); return; }
  const id = genId('h');
  try {
    await window.FB.set(window.FB.ref(window.FB.db, `help_messages/${id}`), { from: 'teacher', fromEmail: currentUser.email, text, timestamp: Date.now() });
    ta.value = '';
    alert('✅ Сообщение отправлено');
  } catch (e) { alert('Ошибка: ' + e.message); }
}

async function renderDeveloperMetrics() {
  const el = document.getElementById('metricsLine');
  if (!el) return;
  try {
    const [testsSnap, sessionsSnap, resultsSnap, usersSnap, classesSnap] = await Promise.all([
      window.FB.get(window.FB.ref(window.FB.db, 'tests')),
      window.FB.get(window.FB.ref(window.FB.db, 'sessions')),
      window.FB.get(window.FB.ref(window.FB.db, 'results')),
      window.FB.get(window.FB.ref(window.FB.db, 'users')),
      window.FB.get(window.FB.ref(window.FB.db, 'classes'))
    ]);

    const sessions = sessionsSnap.val() || {};
    const results = resultsSnap.val() || {};
    const users = usersSnap.val() || {};
    const classes = classesSnap.val() || {};

function renderDeveloperTestsList() {
  const el = document.getElementById('testsManageArea');
  if (!el) return;
  const tests = Object.entries(testsCache);
  if (tests.length === 0) { el.innerHTML = `<p class="hint">Тестов пока нет.</p>`; return; }
  const rows = tests.map(([id, t]) => {
    const statusBadge = t.status === 'draft'
      ? '<span class="badge draft">ЧЕРНОВИК</span>'
      : '<span class="badge published">ОПУБЛИКОВАН</span>';
    const shortInfo = t.shortName ? `<div style="font-size:11px;color:#94a3b8;font-weight:700;margin-top:3px;">🏷 ${escapeHtml(t.shortName)}</div>` : '';
    const baseP = getBasePoints(t);
    const maxBonus = getMaxBonus(t);
    const tiers = getSpeedTiers(t);
    const tiersInfo = tiers.length
      ? `⚡ ${baseP} б + до +${formatScore(maxBonus)} за скорость (${tiers.length} ступ.)`
      : `⚡ ${baseP} б/вопрос (без бонуса)`;
    const bonusInfo = `<div style="font-size:11px;color:#b45309;font-weight:700;margin-top:3px;">${tiersInfo}</div>`;
    return `<tr>
      <td style="font-family:monospace;font-size:12px;color:#94a3b8;">${escapeHtml(id)}</td>
      <td>${escapeHtml(t.title)}${shortInfo}${bonusInfo}</td>
      <td style="text-align:center;">${statusBadge}</td>
      <td style="text-align:center;">${(t.questions || []).length}</td>
      <td style="text-align:center;font-weight:800;color:var(--violet);">${formatScore(getMaxScore(t))}</td>
      <td class="action-cell">
        <button class="small" data-edit="${id}">✏</button>
        <button class="small danger" data-del="${id}">✕</button>
      </td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th style="width:160px;">ID</th><th>Название</th><th style="width:120px;">Статус</th><th style="width:80px;">Вопросов</th><th style="width:90px;">Макс. балл</th><th style="width:120px;">Действия</th></tr></thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openTestEditor(b.dataset.edit, testsCache[b.dataset.edit]));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    const t = testsCache[id];
    if (!confirm(`Удалить тест «${t.title}»?`)) return;
    await window.FB.remove(window.FB.ref(window.FB.db, `tests/${id}`));
    delete testsCache[id];
    renderDeveloperTestsList();
  });
}

function openClassEditor(classId, classData) {
  const isNew = !classId;

  const m = openModal(`<div class="modal-body">
    <h2 style="margin:0 0 8px;">${isNew ? '➕ Новый класс' : '✏ Редактирование'}</h2>

    <input type="text" id="className" value="${escapeHtml(initial.name)}" placeholder="Например: 10А">

    <textarea id="classStudents" style="min-height:200px;" placeholder="Иванов Иван&#10;Петров Петр">${escapeHtml((initial.students || []).join('\n'))}</textarea>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="saveClass" class="green" style="flex:1;">💾 Сохранить</button>
      <button class="back" id="closeClass">Отмена</button>
    </div>
  </div>`, 600);
  m.$('#closeClass').onclick = () => m.close();
  m.$('#saveClass').onclick = async () => {
    const name = m.$('#className').value.trim();
    if (!name) { alert('Введите название класса'); return; }
    const students = m.$('#classStudents').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    const id = classId || genId('cls');
    const payload = { name, students, updatedAt: Date.now() };
    if (isNew) { payload.createdAt = Date.now(); payload.createdBy = currentUser.uid; }
    try {
      if (isNew) await window.FB.set(window.FB.ref(window.FB.db, `classes/${id}`), payload);
      else await window.FB.update(window.FB.ref(window.FB.db, `classes/${id}`), payload);
      classesCache[id] = payload;
      renderClassesList();
      m.close();
    } catch (e) { alert('Ошибка: ' + e.message); }
  };
}

async function loadTeachersData() {
  try {
    const [usersSnap, sessionsSnap, resultsSnap] = await Promise.all([
      window.FB.get(window.FB.ref(window.FB.db, 'users')),
      window.FB.get(window.FB.ref(window.FB.db, 'sessions')),
      window.FB.get(window.FB.ref(window.FB.db, 'results'))
    ]);
    teachersUsersCache = usersSnap.val() || {};
    teachersStatsCache.sessions = sessionsSnap.val() || {};
    teachersStatsCache.results = resultsSnap.val() || {};
  } catch (e) {
    teachersUsersCache = {};
    teachersStatsCache = { sessions: {}, results: {} };
  }
}

async function renderTeachersList() {
  const el = document.getElementById('teachersArea');
  if (!el) return;
  el.innerHTML = `<p class="hint"><span class="loading-spinner"></span>Загрузка статистики…</p>`;
  await loadTeachersData();

  const users = teachersUsersCache;
  const teachers = Object.entries(users).filter(([_, u]) => u && u.role === 'teacher').map(([uid, u]) => ({ uid, ...u }));
  if (teachers.length === 0) { el.innerHTML = `<p class="hint">Учителей пока нет.</p>`; return; }

  const sessions = teachersStatsCache.sessions || {};
  const results = teachersStatsCache.results || {};

  const stats = {};
  teachers.forEach(t => { stats[t.uid] = { sessionsTotal: 0, sessionsActive: 0, studentsTotal: 0, resultsTotal: 0, avgScore: 0, lastActivityAt: 0 }; });

  Object.values(sessions).forEach(s => {
    if (!s || !s.teacherId || !stats[s.teacherId]) return;
    stats[s.teacherId].sessionsTotal++;
    if (s.status === 'active') stats[s.teacherId].sessionsActive++;
    stats[s.teacherId].studentsTotal += Object.keys(s.students || {}).length;
    if (s.createdAt > stats[s.teacherId].lastActivityAt) stats[s.teacherId].lastActivityAt = s.createdAt;
  });

  Object.values(results).forEach(r => {
    if (!r || !r.teacherId || !stats[r.teacherId]) return;
    stats[r.teacherId].resultsTotal++;
    stats[r.teacherId]._sumScore = (stats[r.teacherId]._sumScore || 0) + (r.score || 0);
    if (r.timestamp > stats[r.teacherId].lastActivityAt) stats[r.teacherId].lastActivityAt = r.timestamp;
  });

  Object.keys(stats).forEach(uid => {
    const st = stats[uid];
    st.avgScore = st.resultsTotal > 0 ? round1((st._sumScore || 0) / st.resultsTotal) : 0;
    delete st._sumScore;
  });

  teachers.sort((a, b) => (stats[b.uid].lastActivityAt || 0) - (stats[a.uid].lastActivityAt || 0));

  el.innerHTML = `
    <div class="students-grid" style="grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));">
      ${teachers.map(t => {
        const st = stats[t.uid];
        const initials = (String(t.email || '?')[0] || '?').toUpperCase();
        const lastAct = st.lastActivityAt ? formatDate(st.lastActivityAt) : '—';
        return `
          <div class="student-card" style="padding:16px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
              <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0;">${initials}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:800;color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(t.email || '')}">${escapeHtml(t.email || '—')}</div>
                <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;">${t.role === 'teacher' ? '👨‍🏫 Учитель' : escapeHtml(t.role || '')} ${t.createdAt ? ' · с ' + formatDateShort(t.createdAt) : ''}</div>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--violet);line-height:1;">${st.sessionsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px;">Сессий</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--green);line-height:1;">${st.resultsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px;">Прохождений</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--blue);line-height:1;">${st.studentsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px;">Учеников</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--yellow);line-height:1;">${formatScore(st.avgScore)}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px;">Ср. балл</div>
              </div>
            </div>
            ${st.sessionsActive > 0 ? `<div style="font-size:11px;font-weight:800;color:#10b981;margin-bottom:6px;">● ${st.sessionsActive} активных</div>` : ''}
            <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:10px;">Последняя активность: ${lastAct}</div>
            <div style="display:flex;gap:6px;">
              <button class="small back" data-teacher-view="${t.uid}" style="flex:1;">📊 Детали</button>
              <button class="small danger" data-teacher-del="${t.uid}">🗑</button>
            </div>
          </div>`;
      }).join('')}
    </div>`;

  el.querySelectorAll('[data-teacher-view]').forEach(b => b.onclick = () => showTeacherDetails(b.dataset.teacherView));
  el.querySelectorAll('[data-teacher-del]').forEach(b => b.onclick = async () => {
    const uid = b.dataset.teacherDel;
    const t = teachers.find(x => x.uid === uid);
    if (!confirm(`Удалить профиль учителя «${t.email}»?`)) return;
    await window.FB.remove(window.FB.ref(window.FB.db, `users/${uid}`));
    renderTeachersList();
    renderDeveloperMetrics();
  });
}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
      <h2 style="margin:0;">👨‍🏫 ${escapeHtml(t.email || '')}</h2>
      <button class="small back" id="tClose">Закрыть</button>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(4, 1fr);">
      <div class="kpi"><div class="icon">🎫</div><div class="n">${sessions.length}</div><div class="t">Сессий</div></div>
      <div class="kpi"><div class="icon">📈</div><div class="n">${results.length}</div><div class="t">Прохождений</div></div>
      <div class="kpi"><div class="icon">👥</div><div class="n">${sessions.reduce((sum, s) => sum + Object.keys(s.students || {}).length, 0)}</div><div class="t">Учеников</div></div>
      <div class="kpi"><div class="icon">⭐</div><div class="n">${results.length ? formatScore(results.reduce((s, r) => s + (r.score || 0), 0) / results.length) : 0}</div><div class="t">Ср. балл</div></div>

    <tbody>${resultsRows}</tbody></table>

function openCreateTeacherModal() {
  const m = openModal(`<div class="modal-body">
    <h2 style="margin:0 0 8px;">➕ Новый учитель</h2>
    <p class="hint" style="margin-bottom:18px;">Аккаунт создастся в Firebase Auth. Пароль можно передать учителю лично.</p>
    <label class="label">Email</label>
    <input type="email" id="newTeacherEmail" placeholder="teacher@school.ru" autocomplete="off">
    <label class="label">Пароль (минимум 6 символов)</label>
    <input type="text" id="newTeacherPass" placeholder="Временный пароль" autocomplete="off">
    <label class="label">Имя (необязательно)</label>
    <input type="text" id="newTeacherName" placeholder="Иван Петрович" autocomplete="off">
    <p id="newTeacherError" style="color:#ef4444;font-size:13px;font-weight:700;min-height:18px;margin:6px 0;"></p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="saveTeacher" class="green" style="flex:1;">💾 Создать аккаунт</button>
      <button class="back" id="closeTeacher">Отмена</button>
    </div>
    <div style="background:#fffbeb;border-left:4px solid #f59e0b;padding:10px 14px;border-radius:10px;font-size:12px;color:#92400e;margin-top:14px;font-weight:600;">
      ⚠️ После создания учитель сможет войти на странице <code>?mode=teacher</code> со своим email и паролем.
    </div>
  </div>`, 560);

  m.$('#closeTeacher').onclick = () => m.close();
  m.$('#saveTeacher').onclick = async () => {
    const email = m.$('#newTeacherEmail').value.trim();
    const pass = m.$('#newTeacherPass').value;
    const name = m.$('#newTeacherName').value.trim();
    const err = m.$('#newTeacherError');
    err.textContent = '';

    if (!email) { err.textContent = 'Укажите email'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Некорректный email'; return; }
    if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }

    const btn = m.$('#saveTeacher');
    btn.disabled = true;
    btn.textContent = 'Создаём…';

    try {
      const cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pass);
      const uid = cred.user.uid;
      await window.FB.set(window.FB.ref(window.FB.db, `users/${uid}`), {
        email, role: 'teacher', name: name || '',
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.uid : null
      });
      m.close();
      alert(`✅ Учитель создан!\n\nEmail: ${email}\nПароль: ${pass}\n\nПередайте их учителю.`);
      renderTeachersList();
      renderDeveloperMetrics();
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/email-already-in-use') err.textContent = 'Этот email уже используется';
      else if (c === 'auth/invalid-email') err.textContent = 'Некорректный email';
      else if (c === 'auth/weak-password') err.textContent = 'Слишком слабый пароль';
      else err.textContent = 'Ошибка: ' + (e.message || 'неизвестная');
      btn.disabled = false;
      btn.textContent = '💾 Создать аккаунт';
    }
  };
}

/* ==================================================================
   РЕДАКТОР ТЕСТА
   ================================================================== */
function openTestEditor(testId, testData) {
  const isNew = !testId;

  // Начальные ступени (формат — минимальный ОСТАТОК времени)
  const initialTiers = (() => {
    if (testData && Array.isArray(testData.speedBonusTiers)) {
      return testData.speedBonusTiers.map(t => ({
        timeSec: Math.max(0, Math.round(Number(t.timeSec) || 0)),
        bonus: round1(t.bonus)
      })).filter(t => t.timeSec > 0 && t.bonus > 0)
        .sort((a, b) => b.timeSec - a.timeSec);  // показываем от большого к меньшему
    }
    if (testData && testData.speedBonusPct != null && testData.speedBonusPct > 0) {
      const base = (testData.basePoints != null) ? testData.basePoints : DEFAULT_BASE_POINTS;
      const maxBonus = round1(base * testData.speedBonusPct / 100);
      const total = Number(testData.timePerQuestion) || 20;
      return [
        { timeSec: Math.round(total * 0.75), bonus: round1(maxBonus * 0.8) },
        { timeSec: Math.round(total * 0.50), bonus: round1(maxBonus * 0.5) },
        { timeSec: Math.round(total * 0.25), bonus: round1(maxBonus * 0.2) }
      ].sort((a, b) => b.timeSec - a.timeSec);
    }
    return JSON.parse(JSON.stringify(DEFAULT_SPEED_TIERS));
  })();

  function renderMain() { if (activeTab === 'settings') renderSettings(); else renderQuestionEditor(); }

  function renderTierRows() {
    if (settings.speedTiers.length === 0) {
      return `<div style="padding:12px;background:#fef3c7;border-radius:10px;font-size:13px;color:#b45309;font-weight:700;">

    return settings.speedTiers.map((tier, i) => {

      const rowStyle = invalid ? 'background:#fef2f2;border-color:#fecaca;' : '';
      const hint = invalid
        ? `<span style="color:#b91c1c;font-weight:800;">⚠ больше времени вопроса (${total} сек)</span>`

    editorHead.innerHTML = `<h3>⚙️ Настройки теста</h3>`;
    editorBody.innerHTML = `

        <div style="font-size:14px;font-weight:800;color:var(--violet);margin-bottom:10px;">📊 Итог по текущему тесту</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">

    function renderTierValidation() {

      const total = Number(settings.timePerQuestion) || 20;

      if (bad.length === 0) { box.innerHTML = ''; return; }
      box.innerHTML = `
        <div style="padding:10px 14px;background:#fef2f2;border:2px solid #fecaca;border-radius:10px;font-size:12px;color:#b91c1c;font-weight:700;">

          Уменьши остаток или увеличь время на вопрос выше.
        </div>`;
    }

    function refreshSummary() {
      const box = editorBody.querySelector('.editor-settings-section[style*="f5f3ff"]');
      if (!box) return;
      const mb = Math.max(0, ...settings.speedTiers.map(t => Number(t.bonus) || 0));
      const mpq = round1(Number(settings.basePoints) + mb);
      const tm = round1(questions.length * mpq);
      const cells = box.querySelectorAll('div[style*="background:#fff"]');
      if (cells.length >= 5) {
        cells[0].querySelector('div').textContent = questions.length;
        cells[1].querySelector('div').textContent = formatScore(settings.basePoints);
        cells[2].querySelector('div').textContent = '+' + formatScore(mb);
        cells[3].querySelector('div').textContent = formatScore(mpq);
        cells[4].querySelector('div').textContent = formatScore(tm);
      }
    }

      refreshSummary();

    m.$('#setIntroImage').oninput = (e) => {
      settings.introImage = e.target.value.trim();
      m.$('#coverPreview').innerHTML = settings.introImage ? `<img src="${escapeAttr(settings.introImage)}" alt="">` : '🖼 Превью';

      try {

    m.$('#setTime').oninput = (e) => {
      settings.timePerQuestion = parseInt(e.target.value, 10) || 20;
      renderSettings();
    };

    function bindTierInputs() {
      editorBody.querySelectorAll('.tier-time').forEach(inp => {
        inp.oninput = (e) => {
          const i = +e.target.dataset.idx;
          const v = parseInt(e.target.value, 10);
          if (!isNaN(v)) settings.speedTiers[i].timeSec = Math.max(1, Math.min(300, v));
          refreshSummary();
          renderTierValidation();
          editorBody.querySelectorAll('.tier-row').forEach((row, ri) => {
            const tier = settings.speedTiers[ri];
            if (!tier) return;
            const total = Number(settings.timePerQuestion) || 20;
            const fld = row.children[1];
            if (fld) {
              fld.innerHTML = (tier.timeSec >= total)
                ? `<span style="color:#b91c1c;font-weight:800;">⚠ больше времени вопроса (${total} сек)</span>`
                : `<span>≈ ответ за ${Math.max(0, total - tier.timeSec)} сек</span>`;
            }
            row.style.background = (tier.timeSec >= total) ? '#fef2f2' : '';
          });
        };
      });
      editorBody.querySelectorAll('.tier-bonus').forEach(inp => {
        inp.oninput = (e) => {
          const i = +e.target.dataset.idx;
          const v = parseFloat(e.target.value);
          if (!isNaN(v)) settings.speedTiers[i].bonus = Math.max(0, round1(v));
          refreshSummary();
        };
      });
      editorBody.querySelectorAll('[data-del-tier]').forEach(btn => {
        btn.onclick = () => {
          const i = +btn.dataset.delTier;
          settings.speedTiers.splice(i, 1);
          renderSettings();
        };
      });
    }
    bindTierInputs();
    renderTierValidation();

    m.$('#addTierBtn').onclick = () => {
      const minTime = settings.speedTiers.length
        ? Math.min(...settings.speedTiers.map(t => t.timeSec))
        : 15;
      const newTime = Math.max(1, minTime - 5);
      settings.speedTiers.push({ timeSec: newTime, bonus: 1 });
      settings.speedTiers.sort((a, b) => b.timeSec - a.timeSec);
      renderSettings();
    };

    editorBody.querySelectorAll('.tier-preset-btn').forEach(btn => {
      btn.onclick = () => {
        const preset = btn.dataset.preset;
        const total = Number(settings.timePerQuestion) || 20;
        const base = Number(settings.basePoints) || 5;
        if (preset === 'standard') {
          settings.speedTiers = [
            { timeSec: Math.round(total * 0.75), bonus: round1(base * 0.6) },
            { timeSec: Math.round(total * 0.50), bonus: round1(base * 0.4) },
            { timeSec: Math.round(total * 0.25), bonus: round1(base * 0.2) }
          ].filter(t => t.timeSec < total);
        } else if (preset === 'soft') {
          settings.speedTiers = [
            { timeSec: Math.round(total * 0.50), bonus: round1(base * 0.2) },
            { timeSec: Math.round(total * 0.25), bonus: round1(base * 0.1) }
          ].filter(t => t.timeSec < total);
        } else if (preset === 'hardcore') {
          settings.speedTiers = [
            { timeSec: Math.round(total * 0.85), bonus: round1(base * 1.0) },
            { timeSec: Math.round(total * 0.60), bonus: round1(base * 0.6) },
            { timeSec: Math.round(total * 0.35), bonus: round1(base * 0.3) }
          ].filter(t => t.timeSec < total);
        } else if (preset === 'none') {
          settings.speedTiers = [];
        }
        settings.speedTiers.sort((a, b) => b.timeSec - a.timeSec);
        renderSettings();
      };
    });

    m.$('#qImage').oninput = (e) => {
      const v = e.target.value.trim();

    };
    m.$('#qImageFile').onchange = async (e) => {

  }

  m.$('#csvUpload').onchange = async (e) => {

      activeQ = questions.length - parsed.length;
      activeTab = 'questions';
      m.$$('.editor-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'questions'));
      renderSidebar(); renderMain();
    } catch (err) { alert('Ошибка: ' + err.message); }
  };

  m.$$('.editor-tab').forEach(t => t.onclick = () => {
    m.$$('.editor-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    renderSidebar(); renderMain();
  });
  addBtn.onclick = () => {
    questions.push({ q: '', options: ['','','',''], correct: 0, image: '', time: null });
    activeQ = questions.length - 1;
    renderSidebar(); renderMain();
  };
  m.$('#closeEditor').onclick = () => { if (confirm('Закрыть редактор?')) m.close(); };

  async function saveTest(publish) {
    if (!settings.title.trim()) { alert('Укажите название'); return false; }
    if (questions.length === 0) { alert('Добавьте вопрос'); return false; }
    for (let i = 0; i < questions.length; i++) {
      if (!questions[i].q.trim()) { alert(`Вопрос ${i+1}: пустая формулировка`); return false; }
      if (questions[i].options.some(o => !o.trim())) { alert(`Вопрос ${i+1}: заполните все 4 варианта`); return false; }
    }
    const now = Date.now();
    const id = testId || genId('t');
    const payload = {
      title: settings.title.trim(),
      shortName: (settings.shortName || '').trim().slice(0, 30),
      intro: settings.intro.trim(),
      introImage: settings.introImage.trim(),
      timePerQuestion: settings.timePerQuestion,
      basePoints: round1(settings.basePoints),
      speedBonusTiers: settings.speedTiers
        .map(t => ({ timeSec: Math.max(1, parseInt(t.timeSec, 10) || 5), bonus: round1(t.bonus) }))
        .sort((a, b) => a.timeSec - b.timeSec),
      status: publish ? 'published' : 'draft',
      antiCheatMode: settings.antiCheatMode,
      questions: questions.map(q => ({ q: q.q, options: q.options, correct: q.correct, image: q.image || '', time: q.time || null })),
      createdBy: currentUser.uid, updatedAt: now
    };
    if (isNew) payload.createdAt = now;
    try {
      if (isNew) await window.FB.set(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      else await window.FB.update(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      testsCache[id] = payload;

      return true;
    } catch (e) { alert('Ошибка сохранения: ' + e.message); return false; }
  }

      await window.FB.remove(window.FB.ref(window.FB.db, `tests/${testId}`));
      delete testsCache[testId];
      renderDeveloperTestsList();
      m.close();
    };
  }
  renderSidebar(); renderMain();
}

function parseCSVQuestions(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const result = [];
  for (const line of lines) {
    let parts = line.split(';');
    if (parts.length < 5) parts = line.split(',');
    if (parts.length < 5) parts = line.split('\t');
    if (parts.length < 5) continue;
    const q = parts[0].trim().replace(/^"|"$/g, '');
    if (!q) continue;
    const options = [parts[1], parts[2], parts[3], parts[4]].map(x => (x || '').trim().replace(/^"|"$/g, ''));
    if (options.some(o => !o)) continue;
    let correct = parseInt((parts[5] || '1').trim(), 10);
    if (isNaN(correct) || correct < 1 || correct > 4) correct = 1;
    correct = correct - 1;
    const image = (parts[6] || '').trim().replace(/^"|"$/g, '');
    const timeRaw = (parts[7] || '').trim();
    const time = timeRaw ? Math.max(5, Math.min(300, parseInt(timeRaw, 10) || 20)) : null;
    result.push({ q, options, correct, image, time });
  }
  return result;
}

function buildSessionResults(session, test) {
  const students = session.students || {};
  const totalQ = (test && test.questions && test.questions.length) || session.testQuestionCount || 0;
  const maxScore = test ? getMaxScore(test) : 0;
  const results = [];

  Object.values(students).forEach(st => {
    if (st.result && Array.isArray(st.result.answers)) {
      results.push({ ...st.result, maxScore: st.result.maxScore || maxScore });
      return;
    }

    const answersMap = st.answers || {};
    const answersArr = [];
    const count = totalQ || Object.keys(answersMap).length;

    for (let i = 0; i < count; i++) {
      const a = answersMap[i] || answersMap[String(i)];
      if (a) {
        answersArr.push({
          questionText: a.questionText || (test && test.questions[i] ? test.questions[i].q : ('Вопрос ' + (i + 1))),
          correctText:  a.correctText  || (test && test.questions[i] ? test.questions[i].options[test.questions[i].correct] : ''),
          selectedText: a.selectedText || null,
          correct:      !!a.correct,
          image:        a.image || (test && test.questions[i] ? (test.questions[i].image || '') : ''),
          points:       a.points || 0,
          speedBonus:   a.speedBonus || 0
        });
      } else {
        const tq = test && test.questions[i];
        answersArr.push({
          questionText: tq ? tq.q : ('Вопрос ' + (i + 1)),
          correctText:  tq ? tq.options[tq.correct] : '',
          selectedText: null,
          correct: false,
          image: tq ? (tq.image || '') : '',
          points: 0, speedBonus: 0
        });
      }
    }

    const correct = st.correctCount != null ? st.correctCount : answersArr.filter(a => a.correct).length;
    const total = answersArr.length || totalQ;
    const wrong = Math.max(0, total - correct);

    results.push({
      studentName:   st.studentName || '—',
      testId:        session.testId,
      testTitle:     session.testTitle,
      date:          formatDate(st.finishedAt || st.joinedAt || Date.now()),
      timestamp:     st.finishedAt || st.joinedAt || Date.now(),
      score:         round1(st.score || 0),
      maxScore,
      correct, wrong, total,
      teacherId:     session.teacherId,
      teacherEmail:  session.teacherEmail,
      sessionCode:   sessionCode || '',
      decision:      '',
      tabSwitches:   st.tabSwitches || 0,
      copyAttempts:  st.copyAttempts || 0,
      maxStreak:     st.maxStreak || 0,
      terminated:    false,
      answers:       answersArr
    });
  });

  return results;
}

function subscribeTeacherSessionLive(code, test) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snapshot) => {
    const s = snapshot.val();
    if (!s) return;
    renderTeacherSyncPanel(s, test, code);
    renderTeacherStudentsList(s, test);
  }));
  startAutoAdvance(code, test);
}

function startAutoAdvance(code, test) {
  if (autoAdvanceInterval) { clearInterval(autoAdvanceInterval); autoAdvanceInterval = null; }
  autoAdvanceInterval = setInterval(async () => {
    try {
      const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
      const s = snap.val();
      if (!s) return;
      if (!s.autoAdvance || s.status !== 'active') return;
      if (s.phase === 'finished' || s.phase === 'lobby') return;
      const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;

      if (s.phase === 'question' && idx >= 0) {
        const q = test.questions[idx];
        if (!q) return;
        const timeTotal = (q.time || test.timePerQuestion || TIME_PER_QUESTION) * 1000;
        const elapsed = Date.now() - (s.questionStartedAt || 0);
        const studentsArr = Object.values(s.students || {});
        const allAnswered = studentsArr.length > 0 && studentsArr.every(st => st.answers && st.answers[idx]);
        if (elapsed >= timeTotal || allAnswered) {
          if (elapsed >= timeTotal - 200) await revealQuestion(code, idx, test);
        }
      }
      if (s.phase === 'results') {
        const delaySec = s.autoAdvanceDelaySec || 5;
        const elapsed = Date.now() - (s.revealedAt || 0);
        const cdEl = document.getElementById('autoCountdown');
        if (cdEl) cdEl.textContent = Math.max(0, Math.ceil(delaySec - elapsed / 1000));
        if (elapsed >= delaySec * 1000) {
          const nextIdx = idx + 1;
          if (nextIdx < test.questions.length) await startQuestion(code, nextIdx, test);
          else await showLeaderboard(code);
        }
      }
      if (s.phase === 'leaderboard') {
        const delaySec = s.autoAdvanceDelaySec || 5;
        const elapsed = Date.now() - (s.leaderboardAt || 0);
        if (elapsed >= delaySec * 1000) {
          const nextIdx = idx + 1;
          if (nextIdx < test.questions.length) await startQuestion(code, nextIdx, test);
          else await finishSession(code);
        }
      }
    } catch (e) { console.warn('autoAdvance tick:', e); }
  }, 500);
}

    phaseText.className = 'stp-phase ' + phase;

      lobby: '🏠 Лобби',
      question: `❓ Вопрос ${idx + 1} / ${test.questions.length}`,
      results: '📊 Результаты',
      leaderboard: '🏆 Лидерборд',
      finished: '🏁 Завершено'
    }[phase] || phase;
  }

  const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v }));

    content.innerHTML = html;
    onClick('startBtn', () => startQuestion(code, 0, test));
    return;

    const q = test.questions[idx];
    const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;
    const elapsed = s.questionStartedAt ? Math.floor((Date.now() - s.questionStartedAt) / 1000) : 0;
    const remaining = Math.max(0, timeTotal - elapsed);

            ${escapeHtml(opt)}

        </div>
        <p style="font-size:12px;color:#94a3b8;font-weight:700;margin-top:12px;">
          За верный ответ: ${formatScore(baseP)}${maxBonus > 0 ? ` – ${formatScore(maxPerQ)} б. (с бонусом)` : ' б.'}

          ${q.options.map((opt, oi) => {
            const isCorrect = oi === q.correct;
            const pct = total > 0 ? Math.round(stats[oi] / total * 100) : 0;
            return `<div class="sad-item ${isCorrect ? 'correct' : ''}">
              <div class="sad-fig">${FIGURES[oi]}</div>

  if (phase === 'finished') {

  const elTotal = document.getElementById('cntTotal');
  if (elTotal) elTotal.textContent = studentsArr.length;
  const area = document.getElementById('studentsArea');
  if (!area) return;
  if (studentsArr.length === 0) {
    area.innerHTML = `<p class="hint">Ожидание учеников… Код <b>${sessionCode}</b>.</p>`;
    return;
  }
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  area.innerHTML = studentsArr.map(st => {
    const hasAnswered = st.answers && st.answers[idx];
    const cls = hasAnswered ? 'answered' : '';
    let status = 'В игре';
    if (hasAnswered) status = '✅ Ответил';
    if (st.status === 'finished') status = `Завершил — ${formatScore(st.score || 0)} б.`;
    return `<div class="student-card ${cls}">
      <div class="name">${escapeHtml(st.studentName || '—')}</div>
      <div class="status">${escapeHtml(status)}</div>
      <div class="progress">Всего: ${st.correctCount || 0} верно · ${formatScore(st.score || 0)} б.</div>
    </div>`;
  }).join('');
}

async function startQuestion(code, idx, test) {
  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), {
      phase: 'question', currentQuestion: idx, questionStartedAt: Date.now(), status: 'active'
    });
  } catch (e) { alert('Ошибка: ' + e.message); }
}
async function revealQuestion(code, idx, test) {
  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'results', revealedAt: Date.now() });
  } catch (e) { alert('Ошибка: ' + e.message); }
}
async function showLeaderboard(code) {
  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'leaderboard', leaderboardAt: Date.now() });
  } catch (e) { alert('Ошибка: ' + e.message); }
}
async function finishSession(code) {
  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'finished', finishedAt: Date.now(), status: 'closed' });
    try {
      const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
      const session = snap.val();
      if (session && session.students) {
        const results = buildSessionResults(session, null);
        const updates = {};
        results.forEach(r => {
          const rid = 'sync_' + code + '_' + (r.studentName || 'x').replace(/\s+/g, '_') + '_' + r.timestamp;
          updates[rid] = r;
        });
        if (Object.keys(updates).length > 0) await window.FB.update(window.FB.ref(window.FB.db, 'results'), updates);
      }
    } catch (e) { console.warn('Не сохранилось в общий список:', e); }
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function validateNames(showError) {
  const firstEl = document.getElementById('firstName');
  const lastEl = document.getElementById('lastName');
  const err = document.getElementById('nameError');
  const first = firstEl.value.trim(), last = lastEl.value.trim();
  let message = '';
  if (!first || !last) message = 'Заполните имя и фамилию';
  else if (first.length > MAX_NAME_LEN || last.length > MAX_NAME_LEN) message = `Не более ${MAX_NAME_LEN} символов`;
  else if (!isValidName(first) || !isValidName(last)) message = 'Только буквы, дефис и пробел';
  if (message) {
    if (showError) { err.textContent = message; err.style.display = 'block'; }
    return null;
  }
  err.style.display = 'none';
  return { first, last };
}

async function joinSyncSession(code, test, sessionData) {
  const names = validateNames(true);
  if (!names) return;
  const studentName = `${names.last} ${names.first}`;
  if (sessionData.classId) {
    const clsSnap = await window.FB.get(window.FB.ref(window.FB.db, `classes/${sessionData.classId}`));
    const cls = clsSnap.val();
    if (cls && Array.isArray(cls.students) && cls.students.length > 0) {
      const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
      const inClass = cls.students.some(s => norm(s) === norm(studentName));
      if (!inClass) { alert(`«${studentName}» не найден в классе «${cls.name}».`); return; }
    }
  }
  const studentId = getStudentLocalId();
  const existing = Object.values(sessionData.students || {});
  if (existing.some(x => x.studentName === studentName)) { alert(`«${studentName}» уже участвует.`); return; }
  if (existing.length >= MAX_STUDENTS) { alert(`Уже ${MAX_STUDENTS} учеников.`); return; }

  const studentRef = window.FB.ref(window.FB.db, `sessions/${code}/students/${studentId}`);
  try {
    await window.FB.set(studentRef, {
      studentName, joinedAt: Date.now(), online: true,
      score: 0, correctCount: 0, maxStreak: 0,
      tabSwitches: 0, copyAttempts: 0, answers: {}
    });
    syncState = {
      code, studentId, studentName, test, testId: sessionData.testId,
      teacherEmail: sessionData.teacherEmail,
      answersByQ: {}, score: 0, correctCount: 0, maxStreak: 0, currentStreak: 0,
      localQuestionStartTimes: {}
    };
    enableAntiCheat(studentRef, 'soft');
    subscribeStudentSession(code);
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function subscribeStudentSession(code) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snap) => {
    const s = snap.val();
    if (!s) return;
    const myRec = (s.students || {})[syncState.studentId];
    if (!myRec) { location.href = '?mode=student'; return; }
    syncState.answersByQ = myRec.answers || {};
    syncState.score = myRec.score || 0;
    syncState.correctCount = myRec.correctCount || 0;
    renderStudentSyncView(s, code);
  }));
}

function renderStudentSyncView(s, code) {
  const test = syncState.test;
  if (!test) return;
  const phase = s.phase || 'lobby';
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  const myAnswer = syncState.answersByQ[idx];

  const root = document.getElementById('app');
  if (!document.querySelector('.sync-student-screen')) {
    root.innerHTML = `<div class="sync-student-screen" id="sss"></div>`;
  }
  const sss = document.getElementById('sss');

  const showScore = phase === 'finished' || phase === 'leaderboard' || (phase === 'question' && !!myAnswer);
  const topbar = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;
      background:rgba(255,255,255,0.15);padding:12px 18px;border-radius:14px;margin-bottom:14px;color:#fff;font-weight:700;">
      <span>👤 ${escapeHtml(syncState.studentName)}</span>
      <span>${showScore ? '⭐ ' + formatScore(syncState.score) + ' б.' : '🎮 Играем'}</span>
    </div>`;

  if (phase === 'lobby') {
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:64px;margin-bottom:12px;animation:pulse 2s infinite;">⏳</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Ожидаем учителя</h2>
        <p style="color:var(--muted);font-weight:600;">Тест начнётся, как только учитель запустит первый вопрос</p>
        <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'question') {
    const q = test.questions[idx];
    if (!q) { sss.innerHTML = topbar + `<div class="sss-hero"><p>Загрузка вопроса…</p></div>`; return; }
    const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;

    // ЛОКАЛЬНАЯ метка — когда ученик впервые увидел этот вопрос
    if (!syncState.localQuestionStartTimes) syncState.localQuestionStartTimes = {};
    if (!syncState.localQuestionStartTimes[idx]) {
      syncState.localQuestionStartTimes[idx] = Date.now();
    }
    const myStart = syncState.localQuestionStartTimes[idx];
    const elapsed = (Date.now() - myStart) / 1000;
    const remaining = Math.max(0, Math.floor(timeTotal - elapsed));
    const circumference = 2 * Math.PI * 32;
    const offset = circumference * (1 - remaining / timeTotal);
    const warning = remaining <= 5;

    if (myAnswer) {
      const earned = round1(myAnswer.points || 0);
      const bonus = round1(myAnswer.speedBonus || 0);
      const earnedHTML = earned > 0
        ? `<div style="display:inline-block;padding:12px 26px;background:#f0fdf4;border:2px solid #86efac;border-radius:14px;margin:10px 0;">
             <div style="font-size:32px;font-weight:900;color:#10b981;line-height:1;">+${formatScore(earned)}</div>
             <div style="font-size:13px;color:#64748b;font-weight:700;margin-top:4px;">баллов</div>
             ${bonus > 0 ? `<div style="font-size:12px;color:#b45309;font-weight:800;margin-top:6px;">⚡ из них +${formatScore(bonus)} за скорость</div>` : ''}
           </div>`
        : `<div style="display:inline-block;padding:10px 24px;background:#fef2f2;border:2px solid #fecaca;border-radius:14px;margin:10px 0;">
             <span style="font-size:16px;font-weight:800;color:#b91c1c;">Без баллов</span>
           </div>`;
      sss.innerHTML = topbar + `
        <div class="sss-hero">
          <div style="font-size:64px;margin-bottom:4px;">✅</div>
          <h2 style="color:var(--violet);margin:0 0 8px;">Ответ принят!</h2>
          ${earnedHTML}
          <p style="color:var(--muted);font-weight:600;margin-top:12px;">Ожидайте остальных участников…</p>
          <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
        </div>`;
      return;
    }

    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div class="timer-circle ${warning ? 'warning' : ''}">
          <svg viewBox="0 0 76 76">
            <circle class="t-bg" cx="38" cy="38" r="32"></circle>
            <circle class="t-fg" cx="38" cy="38" r="32" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="t-num" id="syncTimer">${remaining}</div>
        </div>
        <div style="font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;">
          Вопрос ${idx + 1} из ${test.questions.length}
        </div>
        ${q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}" alt=""></div>` : ''}
        <p class="question-text">${escapeHtml(q.q)}</p>
        <div id="syncOptions">
          ${q.options.map((opt, oi) => `
            <button class="opt" data-oi="${oi}">
              <span class="fig">${FIGURES[oi]}</span>
              <span>${escapeHtml(opt)}</span>
            </button>`).join('')}
        </div>
      </div>`;

    sss.querySelectorAll('[data-oi]').forEach(b => {
      b.onclick = () => submitSyncAnswer(code, idx, +b.dataset.oi, timeTotal);
    });

    if (syncTimerInterval) clearInterval(syncTimerInterval);
    syncTimerInterval = setInterval(() => {
      const el = document.getElementById('syncTimer');
      if (!el) { clearInterval(syncTimerInterval); return; }
      const myStart2 = syncState.localQuestionStartTimes[idx] || Date.now();
      const rem = Math.max(0, Math.floor(timeTotal - (Date.now() - myStart2) / 1000));
      el.textContent = rem;
      if (rem <= 5) el.parentElement.classList.add('warning');
      if (rem <= 0) { clearInterval(syncTimerInterval); }
    }, 500);
    return;
  }

  if (phase === 'results') {
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:72px;margin-bottom:8px;">⏳</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Готовим следующий вопрос…</h2>
        <p style="color:var(--muted);font-weight:600;">Правильные ответы и баллы вы увидите в финале</p>
        <div class="waiting-dots" style="margin-top:20px;"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'leaderboard') {
    const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.score || 0) - (a.score || 0));
    const medal = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    sss.innerHTML = topbar + `
      <div class="leaderboard-screen">
        <h2>🏆 Лидерборд</h2>
        <p class="lb-sub">Топ-10 по баллам</p>
        <div class="lb-list">
          ${studentsArr.slice(0, 10).map((st, i) => `<div class="lb-item ${st.id === syncState.studentId ? 'me' : ''}">
            <div class="lb-rank ${medal(i)}">${i + 1}</div>
            <div class="lb-name">${escapeHtml(st.studentName || '—')}</div>
            <div class="lb-score">${formatScore(st.score || 0)}</div>
          </div>`).join('')}
        </div>
        <div class="waiting-dots"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'finished') {
    const myRec = (s.students || {})[syncState.studentId] || {};
    const maxScore = getMaxScore(test);
    const score = myRec.score || 0;
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:72px;margin-bottom:8px;">🏁</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Тест завершён!</h2>
        <div class="score">${formatScore(score)}</div>
        <p style="color:#94a3b8;font-weight:700;font-size:14px;">из ${formatScore(maxScore)} возможных</p>
        <p style="color:#475569;font-weight:700;margin-top:8px;">${interpretScore(score, maxScore)}</p>
        <div style="display:flex;justify-content:center;gap:24px;margin-top:18px;padding-top:18px;border-top:2px solid #f1f5f9;">
          <div style="text-align:center;">
            <div class="ok" style="font-size:26px;font-weight:900;">${myRec.correctCount || 0}</div>
            <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Верных</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:26px;font-weight:900;color:var(--red);">${test.questions.length - (myRec.correctCount || 0)}</div>
            <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Неверных</div>
          </div>
        </div>
        <button id="goHomeBtn" class="btn-start" style="margin-top:22px;">🏠 На главную</button>
        <p style="text-align:center;margin-top:14px;color:#94a3b8;font-weight:600;font-size:13px;">Можете закрыть вкладку или вернуться и ввести другой код</p>
      </div>`;
    onClick('goHomeBtn', () => {
      if (syncTimerInterval) { clearInterval(syncTimerInterval); syncTimerInterval = null; }
      disableAntiCheat();
      location.href = '?mode=student';
    });
    return;
  }
}

async function submitSyncAnswer(code, idx, oi, timeTotal) {
  if (syncState.answersByQ[idx]) return;
  const test = syncState.test;
  const q = test.questions[idx];
  const isCorrect = oi === q.correct;

  // ЛОКАЛЬНОЕ время — от момента, когда ученик увидел вопрос
  const myStart = (syncState.localQuestionStartTimes && syncState.localQuestionStartTimes[idx]) || Date.now();
  const timeSpentMs = Math.max(0, Date.now() - myStart);
  const timeSpentSec = timeSpentMs / 1000;

  const base = getBasePoints(test);
  // Ступенчатый бонус по ОСТАТКУ времени
  const speedBonus = isCorrect ? calcSpeedBonus(test, timeSpentSec, timeTotal) : 0;
  const points = isCorrect ? round1(base + speedBonus) : 0;

  if (isCorrect) syncState.currentStreak = (syncState.currentStreak || 0) + 1;
  else syncState.currentStreak = 0;
  const newMaxStreak = Math.max(syncState.maxStreak || 0, syncState.currentStreak || 0);

  const newCorrectCount = (syncState.correctCount || 0) + (isCorrect ? 1 : 0);
  const newScore = round1((syncState.score || 0) + points);

  const answerRecord = {
    selected: oi,
    selectedText: q.options[oi],
    correct: isCorrect,
    questionText: q.q,
    correctText: q.options[q.correct],
    image: q.image || '',
    points,
    basePoints: base,
    speedBonus: round1(speedBonus),
    timeSpentMs,
    timeSpentSec: round2(timeSpentSec),
    answeredAt: Date.now()
  };

  const remaining = Math.max(0, timeTotal - timeSpentSec);
  console.log(
    `[BONUS] Q${idx+1}: correct=${isCorrect}, base=${base}, ` +
    `timeSpent=${timeSpentSec.toFixed(2)}s, remaining=${remaining.toFixed(2)}s, ` +
    `tiers=${JSON.stringify(getSpeedTiers(test))}, bonus=${speedBonus}, total=${points}`
  );

  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}/students/${syncState.studentId}`), {
      [`answers/${idx}`]: answerRecord,
      correctCount: newCorrectCount,
      score: newScore,
      maxStreak: newMaxStreak,
      lastAnswerAt: Date.now()
    });
    syncState.answersByQ[idx] = answerRecord;
    syncState.correctCount = newCorrectCount;
    syncState.score = newScore;
    syncState.maxStreak = newMaxStreak;
  } catch (e) { console.error('submitSyncAnswer:', e); }
}

/* ==================================================================
   MODAL
   ================================================================== */
function openModal(innerHTML, maxWidth, wide) {
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  const cls = wide ? 'modal wide' : 'modal';
  el.innerHTML = `<div class="${cls}" ${maxWidth ? `style="max-width:${maxWidth}px"` : ''}>${innerHTML}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
  return { el, close: () => el.remove(), $: s => el.querySelector(s), $$: s => el.querySelectorAll(s) };
}

/* ==================================================================
   ЗАПУСК
   ================================================================== */
function boot() {
  loadTests();
  if (mode === 'developer') {
    document.body.className = 'theme-developer';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'developer') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'developer' };
          renderDeveloperHome();
          return;
        }
      }
      renderAuth('developer');
    });
  } else if (mode === 'teacher') {
    document.body.className = 'theme-teacher';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'teacher') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'teacher' };
          if (sessionCode) renderTeacherSession(); else renderTeacherHome();
          return;
        }
      }
      if (sessionCode) renderTeacherSession(); else renderAuth('teacher');
    });
  } else if (mode === 'student') {
    if (sessionCode) { document.body.className = 'theme-student'; renderStudentSession(); }
    else renderStudentEnterCode();
  } else {
    renderStudentEnterCode();
  }
}
fbReady(boot);
</script>
