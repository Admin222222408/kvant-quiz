        <div class="join-links">
          <a href="?mode=teacher">Учитель</a>
          <a href="?mode=developer">Разработчик</a>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('sessionInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('go').click(); } });
  document.getElementById('go').onclick = async () => {
    const code = input.value.trim();
    const errBox = document.getElementById('joinErrorBox');
    errBox.innerHTML = '';
    if (!/^\d{6}$/.test(code)) { errBox.innerHTML = `<div class="join-error">Код из 6 цифр</div>`; return; }
    try {
      const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
      const s = snap.val();
      if (!s) { errBox.innerHTML = `<div class="join-error">Сессия «${code}» не найдена</div>`; return; }
      if (s.status === 'closed') { errBox.innerHTML = `<div class="join-error">Сессия закрыта</div>`; return; }
      if (Object.keys(s.students || {}).length >= MAX_STUDENTS) { errBox.innerHTML = `<div class="join-error">Уже ${MAX_STUDENTS} учеников</div>`; return; }
      location.search = `?mode=student&session=${code}`;
    } catch (e) { errBox.innerHTML = `<div class="join-error">Ошибка: ${escapeHtml(e.message)}</div>`; }
  };
}

/* ==================================================================
   УЧЕНИК: СЕССИЯ
   ================================================================== */
async function renderStudentSession() {
  clearAllUnsubs();
  document.body.className = 'theme-student';
  document.body.style.padding = '';
  fbReady(async () => {
    const code = sessionCode;
    const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
    const s = snap.val();
    if (!s) { app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero"><h1 class="student-title">⚠️ Сессия не найдена</h1><a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a></div></div>`; return; }
    if (s.status === 'closed') { app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero"><h1 class="student-title">⚠️ Сессия закрыта</h1><a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a></div></div>`; return; }

    const testSnap = await window.FB.get(window.FB.ref(window.FB.db, `tests/${s.testId}`));
    const test = testSnap.val();
    if (!test) { app.innerHTML = `<h1>⚠️ Тест не найден</h1>`; return; }

    const myId = getStudentLocalId();
    const myRec = (s.students || {})[myId];

    syncState = {
      code,
      studentId: myId,
      studentName: myRec ? myRec.studentName : null,
      test,
      testId: s.testId,
      teacherEmail: s.teacherEmail,
      teacherName: s.teacherName || s.teacherEmail,
      sessionMode: s.mode || 'lobby',
      answersByQ: (myRec && myRec.answers) || {},
      score: (myRec && myRec.score) || 0,
      correctCount: (myRec && myRec.correctCount) || 0,
      currentStreak: 0,
      maxStreak: (myRec && myRec.maxStreak) || 0,
      status: myRec ? myRec.status : null,
      currentQuestion: (myRec && myRec.currentQuestion) || 0,
      localQuestionStartTimes: {}
    };

    if (myRec && myRec.status === 'terminated') {
      app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero" style="text-align:center;">
        <div style="font-size:64px;">🚫</div>
        <h1 class="student-title">Тест был прерван</h1>
        <p class="student-sub">Античит зафиксировал нарушение. Повторное прохождение невозможно.</p>
        <a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a>
      </div></div>`;
      return;
    }
    if (myRec && myRec.status === 'finished') {
      const maxScore = getMaxScore(test);
      app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero" style="text-align:center;">
        <div style="font-size:64px;">✅</div>
        <h1 class="student-title">Тест уже пройден</h1>
        <p class="student-sub">Ваш результат: <b>${formatScore(myRec.score || 0)} / ${formatScore(maxScore)}</b></p>
        <a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a>
      </div></div>`;
      return;
    }

    if (myRec) {
      enableAntiCheat(
        window.FB.ref(window.FB.db, `sessions/${code}/students/${myId}`),
        test.antiCheatMode || 'soft',
        (reason, msg) => terminateStudent(reason, msg)
      );
      subscribeStudentSession(code);
      return;
    }

    const maxScore = getMaxScore(test);
    const isIndividual = s.mode === 'individual';
    const classInfo = s.classId ? `<p class="student-sub" style="color:#7c3aed;">Класс: <b>${escapeHtml(s.className || '')}</b></p>` : '';
    const modeNote = isIndividual
      ? `<div style="text-align:center;margin-bottom:14px;"><span class="badge" style="background:#fce7f3;color:#be185d;">👤 Индивидуальный режим</span></div>`
      : `<div style="text-align:center;margin-bottom:14px;"><span class="badge" style="background:#dbeafe;color:#1d4ed8;">🏠 Режим Лобби</span></div>`;

    app.innerHTML = `
      <div class="student-wrap" style="margin-top:20px;">
        <div class="student-card-hero">
          <h1 class="student-title">${escapeHtml(test.title)}</h1>
          <p class="student-sub">Код сессии: <b style="color:#10b981;">${code}</b></p>
          ${classInfo}
          ${modeNote}
          <label>Имя</label>
          <input type="text" id="firstName" placeholder="Иван" autocomplete="off" maxlength="${MAX_NAME_LEN}">
          <label>Фамилия</label>
          <input type="text" id="lastName" placeholder="Иванов" autocomplete="off" maxlength="${MAX_NAME_LEN}">
          <p id="nameError" style="color:#ef4444;font-weight:700;display:none;margin:6px 0;"></p>
          <button id="start" class="btn-start">${isIndividual ? 'Продолжить →' : 'Войти в игру 🎮'}</button>
          <div class="student-facts">
            <div class="student-fact">📚 ${test.questions.length} вопросов</div>
            <div class="student-fact">⏱ ${test.timePerQuestion || TIME_PER_QUESTION} сек</div>
            <div class="student-fact">🎯 макс ${formatScore(maxScore)} баллов</div>
          </div>
        </div>
      </div>`;
    ['firstName', 'lastName'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        const cleaned = el.value.replace(/[^А-Яа-яЁёA-Za-z\-\s]/g, '').slice(0, MAX_NAME_LEN);
        if (cleaned !== el.value) el.value = cleaned;
        el.classList.remove('invalid');
        validateNames(false);
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('start').click(); } });
    });
    document.getElementById('start').onclick = () => joinSession(code, test, s);
  });
}

function validateNames(showError) {
  const firstEl = document.getElementById('firstName');
  const lastEl = document.getElementById('lastName');
  const err = document.getElementById('nameError');
  const first = firstEl.value.trim(), last = lastEl.value.trim();
  let message = '';
  if (!first || !last) message = 'Заполните имя и фамилию';
  else if (first.length > MAX_NAME_LEN || last.length > MAX_NAME_LEN) message = `Макс. ${MAX_NAME_LEN} символов`;
  else if (!isValidName(first) || !isValidName(last)) message = 'Только буквы, дефис и пробел';
  if (message) {
    if (showError) { err.textContent = message; err.style.display = 'block'; }
    return null;
  }
  err.style.display = 'none';
  return { first, last };
}

async function joinSession(code, test, sessionData) {
  const names = validateNames(true);
  if (!names) return;
  const studentName = `${names.last} ${names.first}`;

  if (sessionData.classId) {
    const clsSnap = await window.FB.get(window.FB.ref(window.FB.db, `classes/${sessionData.classId}`));
    const cls = clsSnap.val();
    if (cls && Array.isArray(cls.students) && cls.students.length > 0) {
      const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
      if (!cls.students.some(s => norm(s) === norm(studentName))) {
        alert(`«${studentName}» не найден в классе «${cls.name}».`);
        return;
      }
    }
  }

  const studentId = getStudentLocalId();
  const existing = Object.values(sessionData.students || {});
  if (existing.some(x => x.studentName === studentName)) { alert(`«${studentName}» уже участвует.`); return; }
  if (existing.length >= MAX_STUDENTS) { alert(`Уже ${MAX_STUDENTS} учеников.`); return; }

  const isIndividual = sessionData.mode === 'individual';
  const studentRef = window.FB.ref(window.FB.db, `sessions/${code}/students/${studentId}`);
  try {
    await window.FB.set(studentRef, {
      studentName,
      joinedAt: Date.now(),
      status: isIndividual ? 'intro' : 'waiting',
      currentQuestion: 0,
      correctCount: 0,
      score: 0,
      maxStreak: 0,
      tabSwitches: 0,
      copyAttempts: 0,
      answers: {}
    });
    syncState.studentName = studentName;
    syncState.sessionMode = sessionData.mode || 'lobby';
    syncState.status = isIndividual ? 'intro' : 'waiting';
    syncState.teacherName = sessionData.teacherName || sessionData.teacherEmail;

    enableAntiCheat(
      studentRef,
      test.antiCheatMode || 'soft',
      (reason, msg) => terminateStudent(reason, msg)
    );
    subscribeStudentSession(code);
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function subscribeStudentSession(code) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snap) => {
    const s = snap.val();
    if (!s) return;
    const myRec = (s.students || {})[syncState.studentId];
    if (!myRec) { location.href = '?mode=student'; return; }
    syncState.answersByQ = myRec.answers || {};
    syncState.score = myRec.score || 0;
    syncState.correctCount = myRec.correctCount || 0;
    syncState.maxStreak = myRec.maxStreak || 0;
    syncState.status = myRec.status;
    syncState.currentQuestion = myRec.currentQuestion || 0;
    renderStudentScreen(s, code);
  }));
}

function renderStudentScreen(s, code) {
  const test = syncState.test;
  if (!test) return;
  const isIndividual = s.mode === 'individual';

  const root = document.getElementById('app');
  if (!document.querySelector('.sync-student-screen')) {
    root.innerHTML = `<div class="sync-student-screen" id="sss"></div>`;
  }
  const sss = document.getElementById('sss');

  const myRec = (s.students || {})[syncState.studentId] || {};
  const showScore = myRec.status === 'finished' || s.phase === 'leaderboard' ||
    (myRec.status === 'in_progress' && syncState.answersByQ[myRec.currentQuestion]);
  const topbar = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;
      background:rgba(255,255,255,0.15);padding:12px 18px;border-radius:14px;margin-bottom:14px;color:#fff;font-weight:700;">
      <span>👤 ${escapeHtml(syncState.studentName)}</span>
      <span>${showScore ? '⭐ ' + formatScore(syncState.score) + ' б.' : '🎮 Играем'}</span>
    </div>`;

  if (isIndividual) {
    if (myRec.status === 'intro') {
      sss.innerHTML = topbar + `
        <div class="sss-hero">
          <h1 style="color:var(--violet);margin:0 0 14px;font-size:24px;">📖 Информация перед тестом</h1>
          ${test.introImage ? `<div class="question-image"><img src="${escapeAttr(test.introImage)}"></div>` : ''}
          <div style="white-space:pre-wrap;color:#475569;font-size:15px;font-weight:500;line-height:1.6;text-align:left;background:#f8fafc;padding:16px;border-radius:12px;">
            ${escapeHtml(test.intro || 'Ознакомьтесь с материалом и нажмите «Начать тест».')}
          </div>
          <button id="introReadBtn" class="btn-start" style="margin-top:18px;">✔ Я прочитал, начать тест</button>
        </div>`;
      onClick('introReadBtn', async () => {
        try {
          await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}/students/${syncState.studentId}`), {
            status: 'in_progress',
            startedAt: Date.now(),
            currentQuestion: 0
          });
        } catch (e) { alert('Ошибка: ' + e.message); }
      });
      return;
    }

    if (myRec.status === 'in_progress') {
      const idx = myRec.currentQuestion || 0;
      if (idx >= test.questions.length) {
        finishStudentIndividual(code);
        return;
      }
      renderIndividualQuestion(sss, topbar, test, idx, code);
      return;
    }

    if (myRec.status === 'finished') {
      renderFinishedScreen(sss, topbar, test, myRec, code);
      return;
    }

    if (myRec.status === 'terminated') {
      return;
    }

    sss.innerHTML = topbar + `<div class="sss-hero"><div style="font-size:64px;">⏳</div><h2>Загрузка…</h2></div>`;
    return;
  }

  const phase = s.phase || 'lobby';
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  const myAnswer = syncState.answersByQ[idx];

  if (phase === 'lobby' || myRec.status === 'waiting') {
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:64px;margin-bottom:12px;animation:pulse 2s infinite;">⏳</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Ожидаем учителя</h2>
        <p style="color:var(--muted);font-weight:600;">Тест начнётся, как только учитель запустит первый вопрос</p>
        <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'question') {
    if (myAnswer) { renderAnsweredHero(sss, topbar, myAnswer); return; }
    renderLobbyQuestion(sss, topbar, test, idx, code);
    return;
  }

  if (phase === 'results') {
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:72px;">⏳</div>
        <h2 style="color:var(--violet);margin:8px 0;">Готовим следующий вопрос…</h2>
        <p style="color:var(--muted);font-weight:600;">Правильные ответы и баллы — в финале</p>
        <div class="waiting-dots" style="margin-top:20px;"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'leaderboard') {
    const arr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.score || 0) - (a.score || 0));
    const medal = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    sss.innerHTML = topbar + `
      <div class="leaderboard-screen">
        <h2>🏆 Лидерборд</h2>
        <p class="lb-sub">Топ-10</p>
        <div class="lb-list">
          ${arr.slice(0, 10).map((st, i) => `<div class="lb-item ${st.id === syncState.studentId ? 'me' : ''}">
            <div class="lb-rank ${medal(i)}">${i + 1}</div>
            <div class="lb-name">${escapeHtml(st.studentName || '—')}</div>
            <div class="lb-score">${formatScore(st.score || 0)}</div>
          </div>`).join('')}
        </div>
        <div class="waiting-dots"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'finished') {
    renderFinishedScreen(sss, topbar, test, myRec, code);
    return;
  }
}

function renderAnsweredHero(sss, topbar, myAnswer) {
  const earned = round1(myAnswer.points || 0);
  const bonus = round1(myAnswer.speedBonus || 0);
  const earnedHTML = earned > 0
    ? `<div style="display:inline-block;padding:12px 26px;background:#f0fdf4;border:2px solid #86efac;border-radius:14px;margin:10px 0;">
        <div style="font-size:32px;font-weight:900;color:#10b981;">+${formatScore(earned)}</div>
        <div style="font-size:13px;color:#64748b;font-weight:700;">баллов</div>
        ${bonus > 0 ? `<div style="font-size:12px;color:#b45309;font-weight:800;margin-top:6px;">⚡ из них +${formatScore(bonus)} за скорость</div>` : ''}
      </div>`
    : `<div style="display:inline-block;padding:10px 24px;background:#fef2f2;border:2px solid #fecaca;border-radius:14px;margin:10px 0;"><span style="font-size:16px;font-weight:800;color:#b91c1c;">Без баллов</span></div>`;
  sss.innerHTML = topbar + `
    <div class="sss-hero">
      <div style="font-size:64px;">✅</div>
      <h2 style="color:var(--violet);margin:0 0 8px;">Ответ принят!</h2>
      ${earnedHTML}
      <p style="color:var(--muted);font-weight:600;margin-top:12px;">Ожидайте остальных…</p>
      <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
    </div>`;
}

function renderLobbyQuestion(sss, topbar, test, idx, code) {
  const q = test.questions[idx];
  if (!q) return;
  const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;
  if (!syncState.localQuestionStartTimes) syncState.localQuestionStartTimes = {};
  if (!syncState.localQuestionStartTimes[idx]) syncState.localQuestionStartTimes[idx] = Date.now();
  const myStart = syncState.localQuestionStartTimes[idx];
  const elapsed = (Date.now() - myStart) / 1000;
  const remaining = Math.max(0, Math.floor(timeTotal - elapsed));
  const circumference = 2 * Math.PI * 32;
  const offset = circumference * (1 - remaining / timeTotal);
  const warning = remaining <= 5;

  sss.innerHTML = topbar + `
    <div class="sss-hero">
      <div class="timer-circle ${warning ? 'warning' : ''}">
        <svg viewBox="0 0 76 76">
          <circle class="t-bg" cx="38" cy="38" r="32"></circle>
          <circle class="t-fg" cx="38" cy="38" r="32" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="t-num" id="syncTimer">${remaining}</div>
      </div>
      <div style="font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:12px;">
        Вопрос ${idx + 1} из ${test.questions.length}
      </div>
      ${q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}"></div>` : ''}
      <p class="question-text">${escapeHtml(q.q)}</p>
      <div>
        ${q.options.map((opt, oi) => `
          <button class="opt" data-oi="${oi}">
            <span class="fig">${FIGURES[oi]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>`).join('')}
      </div>
    </div>`;

  sss.querySelectorAll('[data-oi]').forEach(b => b.onclick = () => submitAnswer(code, idx, +b.dataset.oi, timeTotal, 'lobby'));

  if (syncTimerInterval) clearInterval(syncTimerInterval);
  syncTimerInterval = setInterval(() => {
    const el = document.getElementById('syncTimer');
    if (!el) { clearInterval(syncTimerInterval); return; }
    const rem = Math.max(0, Math.floor(timeTotal - (Date.now() - myStart) / 1000));
    el.textContent = rem;
    if (rem <= 5) el.parentElement.classList.add('warning');
    if (rem <= 0) clearInterval(syncTimerInterval);
  }, 500);
}

function renderIndividualQuestion(sss, topbar, test, idx, code) {
  const q = test.questions[idx];
  if (!q) return;
  const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;
  if (!syncState.localQuestionStartTimes) syncState.localQuestionStartTimes = {};
  if (!syncState.localQuestionStartTimes[idx]) syncState.localQuestionStartTimes[idx] = Date.now();
  const myStart = syncState.localQuestionStartTimes[idx];
  const elapsed = (Date.now() - myStart) / 1000;
  const remaining = Math.max(0, Math.floor(timeTotal - elapsed));
  const circumference = 2 * Math.PI * 32;
  const offset = circumference * (1 - remaining / timeTotal);
  const warning = remaining <= 5;

  sss.innerHTML = topbar + `
    <div class="sss-hero">
      <div class="timer-circle ${warning ? 'warning' : ''}">
        <svg viewBox="0 0 76 76">
          <circle class="t-bg" cx="38" cy="38" r="32"></circle>
          <circle class="t-fg" cx="38" cy="38" r="32" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="t-num" id="syncTimer">${remaining}</div>
      </div>
      <div style="font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:12px;">
        Вопрос ${idx + 1} из ${test.questions.length}
      </div>
      ${q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}"></div>` : ''}
      <p class="question-text">${escapeHtml(q.q)}</p>
      <div>
        ${q.options.map((opt, oi) => `
          <button class="opt" data-oi="${oi}">
            <span class="fig">${FIGURES[oi]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>`).join('')}
      </div>
    </div>`;

  sss.querySelectorAll('[data-oi]').forEach(b => b.onclick = () => submitAnswer(code, idx, +b.dataset.oi, timeTotal, 'individual'));

  if (syncTimerInterval) clearInterval(syncTimerInterval);
  syncTimerInterval = setInterval(() => {
    const el = document.getElementById('syncTimer');
    if (!el) { clearInterval(syncTimerInterval); return; }
    const rem = Math.max(0, Math.floor(timeTotal - (Date.now() - myStart) / 1000));
    el.textContent = rem;
    if (rem <= 5) el.parentElement.classList.add('warning');
    if (rem <= 0) {
      clearInterval(syncTimerInterval);
      submitAnswer(code, idx, null, timeTotal, 'individual');
    }
  }, 500);
}

function renderFinishedScreen(sss, topbar, test, myRec, code) {
  const maxScore = getMaxScore(test);
  const score = myRec.score || 0;
  sss.innerHTML = topbar + `
    <div class="sss-hero">
      <div style="font-size:72px;margin-bottom:8px;">🏁</div>
      <h2 style="color:var(--violet);margin:0 0 8px;">Тест завершён!</h2>
      <div class="score">${formatScore(score)}</div>
      <p style="color:#94a3b8;font-weight:700;font-size:14px;">из ${formatScore(maxScore)} возможных</p>
      <p style="color:#475569;font-weight:700;margin-top:8px;">${interpretScore(score, maxScore)}</p>
      <div style="display:flex;justify-content:center;gap:24px;margin-top:18px;padding-top:18px;border-top:2px solid #f1f5f9;">
        <div style="text-align:center;">
          <div class="ok" style="font-size:26px;font-weight:900;">${myRec.correctCount || 0}</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:700;">ВЕРНЫХ</div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:26px;font-weight:900;color:var(--red);">${test.questions.length - (myRec.correctCount || 0)}</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:700;">НЕВЕРНЫХ</div>
        </div>
      </div>
      <button id="goHomeBtn" class="btn-start" style="margin-top:22px;">🏠 На главную</button>
    </div>`;
  onClick('goHomeBtn', () => {
    if (syncTimerInterval) { clearInterval(syncTimerInterval); syncTimerInterval = null; }
    disableAntiCheat();
    location.href = '?mode=student';
  });
}

async function submitAnswer(code, idx, oi, timeTotal, sessionMode) {
  if (syncState.answersByQ[idx]) return;
  const test = syncState.test;
  const q = test.questions[idx];
  const isCorrect = oi !== null && oi === q.correct;

  const myStart = (syncState.localQuestionStartTimes && syncState.localQuestionStartTimes[idx]) || Date.now();
  const timeSpentMs = Math.max(0, Date.now() - myStart);
  const timeSpentSec = timeSpentMs / 1000;

  const base = getBasePoints(test);
  const speedBonus = (isCorrect && sessionMode === 'lobby')
    ? calcSpeedBonus(test, timeSpentSec, timeTotal)
    : 0;
  const points = isCorrect ? round1(base + speedBonus) : 0;

  if (isCorrect) syncState.currentStreak = (syncState.currentStreak || 0) + 1;
  else syncState.currentStreak = 0;
  const newMaxStreak = Math.max(syncState.maxStreak || 0, syncState.currentStreak || 0);

  const newCorrectCount = (syncState.correctCount || 0) + (isCorrect ? 1 : 0);
  const newScore = round1((syncState.score || 0) + points);

  const answerRecord = {
    selected: oi !== null ? oi : -1,
    selectedText: oi !== null ? q.options[oi] : null,
    correct: isCorrect,
    questionText: q.q,
    correctText: q.options[q.correct],
    image: q.image || '',
    points,
    basePoints: base,
    speedBonus: round1(speedBonus),
    timeSpentMs,
    timeSpentSec: round2(timeSpentSec),
    answeredAt: Date.now()
  };

  try {
    const updates = {
      [`answers/${idx}`]: answerRecord,
      correctCount: newCorrectCount,
      score: newScore,
      maxStreak: newMaxStreak,
      lastAnswerAt: Date.now()
    };
    if (sessionMode === 'individual') updates.currentQuestion = idx + 1;
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}/students/${syncState.studentId}`), updates);
    syncState.answersByQ[idx] = answerRecord;
    syncState.correctCount = newCorrectCount;
    syncState.score = newScore;
    syncState.maxStreak = newMaxStreak;

    if (sessionMode === 'individual') {
      setTimeout(() => {
        if (idx + 1 >= test.questions.length) {
          finishStudentIndividual(code);
        } else {
          const root = document.getElementById('sss');
          const topbar = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;
              background:rgba(255,255,255,0.15);padding:12px 18px;border-radius:14px;margin-bottom:14px;color:#fff;font-weight:700;">
              <span>👤 ${escapeHtml(syncState.studentName)}</span>
              <span>⭐ ${formatScore(syncState.score)} б.</span>
            </div>`;
          renderIndividualQuestion(root, topbar, test, idx + 1, code);
        }
      }, 600);
    }
  } catch (e) { console.error('submitAnswer:', e); }
}

async function finishStudentIndividual(code) {
  const test = syncState.test;
  const total = test.questions.length;
  const correct = syncState.correctCount || 0;
  const wrong = Math.max(0, total - correct);
  const score = round1(syncState.score || 0);
  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}/students/${syncState.studentId}`), {
      status: 'finished',
      finishedAt: Date.now(),
      score, correctCount: correct, wrongCount: wrong
    });
    const answers = Object.values(syncState.answersByQ || {});
    const resultRecord = {
      studentName: syncState.studentName,
      testId: syncState.testId,
      testTitle: test.title,
      date: formatDate(Date.now()),
      timestamp: Date.now(),
      score,
      maxScore: getMaxScore(test),
      correct, wrong, total,
      teacherEmail: syncState.teacherEmail,
      teacherName: syncState.teacherName || syncState.teacherEmail,
      sessionCode: code,
      mode: 'individual',
      answers: answers.map(a => ({
        questionText: a.questionText, correctText: a.correctText,
        selectedText: a.selectedText, correct: a.correct,
        image: a.image, points: a.points, speedBonus: a.speedBonus
      }))
    };
    const newRef = window.FB.push(window.FB.ref(window.FB.db, 'results'));
    await window.FB.set(newRef, resultRecord);
  } catch (e) { console.error('finishStudentIndividual:', e); }
}

async function terminateStudent(reason, message) {
  if (!syncState || !syncState.studentId) return;
  const test = syncState.test;
  if (!test) return;
  if (syncTimerInterval) { clearInterval(syncTimerInterval); syncTimerInterval = null; }

  const total = test.questions.length;
  const answers = Object.values(syncState.answersByQ || {});
  const correct = answers.filter(a => a.correct).length;
  const wrong = Math.max(0, total - correct);
  const score = round1(syncState.score || 0);
  const answered = answers.length;

  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${syncState.code}/students/${syncState.studentId}`), {
      status: 'terminated',
      terminatedAt: Date.now(),
      terminateReason: reason || 'tab_switch',
      score, correctCount: correct, wrongCount: wrong,
      tabSwitches: antiCheatTabSwitches,
      copyAttempts: antiCheatCopyAttempts
    });
    const resultRecord = {
      studentName: syncState.studentName,
      testId: syncState.testId,
      testTitle: test.title,
      date: formatDate(Date.now()),
      timestamp: Date.now(),
      score,
      maxScore: getMaxScore(test),
      correct, wrong, total, answeredQuestions: answered,
      teacherEmail: syncState.teacherEmail,
      teacherName: syncState.teacherName || syncState.teacherEmail,
      sessionCode: syncState.code,
      tabSwitches: antiCheatTabSwitches,
      copyAttempts: antiCheatCopyAttempts,
      terminated: true,
      terminateReason: reason || 'tab_switch',
      answers: answers.map(a => ({
        questionText: a.questionText, correctText: a.correctText,
        selectedText: a.selectedText, correct: a.correct, image: a.image
      }))
    };
    const newRef = window.FB.push(window.FB.ref(window.FB.db, 'results'));
    await window.FB.set(newRef, resultRecord);
  } catch (e) { console.error('terminateStudent:', e); }

  const root = document.getElementById('sss') || document.getElementById('app');
  if (root) {
    root.innerHTML = `
      <div class="sync-student-screen">
        <div class="sss-hero" style="text-align:center;">
          <div style="font-size:64px;margin-bottom:10px;">🚫</div>
          <h2 style="color:#ef4444;font-size:26px;margin-bottom:8px;">Тест прерван</h2>
          <p style="font-size:15px;color:#475569;font-weight:600;">${escapeHtml(message || 'Античит зафиксировал нарушение.')}</p>
          <div style="margin-top:20px;padding:16px 22px;background:#f8fafc;border-radius:14px;display:inline-block;text-align:left;">
            <div style="font-size:14px;margin-bottom:4px;">Отвечено: <b>${answered} из ${total}</b></div>
            <div style="font-size:14px;margin-bottom:4px;">Правильных: <b class="ok">${correct}</b></div>
            <div style="font-size:14px;">Баллов: <b>${formatScore(score)}</b></div>
          </div>
          <br>
          <a href="?mode=student" style="display:inline-block;margin-top:18px;text-decoration:none;">
            <button class="btn-start" style="width:auto;padding:14px 32px;">← На главную</button>
          </a>
        </div>
      </div>`;
  }
}

/* ============ MODAL ============ */
function openModal(innerHTML, maxWidth, wide) {
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  const cls = wide ? 'modal wide' : 'modal';
  el.innerHTML = `<div class="${cls}" ${maxWidth ? `style="max-width:${maxWidth}px"` : ''}>${innerHTML}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
  return { el, close: () => el.remove(), $: s => el.querySelector(s), $$: s => el.querySelectorAll(s) };
}

/* ============ ЗАПУСК ============ */
function boot() {
  loadTests();
  if (mode === 'developer') {
    document.body.className = 'theme-developer';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'developer') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'developer', name: profile.name || '' };
          if (sessionCode) renderTeacherSession(); else renderDeveloperHome();
          return;
        }
      }
      renderAuth('developer');
    });
  } else if (mode === 'teacher') {
    document.body.className = 'theme-teacher';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'teacher') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'teacher', name: profile.name || '' };
          if (sessionCode) renderTeacherSession(); else renderTeacherHome();
          return;
        }
      }
      if (sessionCode) renderTeacherSession(); else renderAuth('teacher');
    });
  } else if (mode === 'student') {
    if (sessionCode) { document.body.className = 'theme-student'; renderStudentSession(); }
    else renderStudentEnterCode();
  } else {
    renderStudentEnterCode();
  }
}
fbReady(boot);
</script>
