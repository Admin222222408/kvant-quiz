const DEFAULT_BASE_POINTS = 5;

/* ============ ХЕЛПЕРЫ БАЛЛОВ ============ */
function round1(n) { return Math.round(Number(n) * 10) / 10; }
function round2(n) { return Math.round(Number(n) * 100) / 100; }
function formatScore(n) {
  const v = Number(n) || 0;
  if (Math.abs(v - Math.round(v)) < 0.05) return String(Math.round(v));
  return String(v).replace('.', ',');
}
function getBasePoints(test) {
  if (!test) return DEFAULT_BASE_POINTS;
  if (test.basePoints != null) return round1(test.basePoints);
  return DEFAULT_BASE_POINTS;
}
function getSpeedTiers(test) {
  if (!test) return [];
  if (Array.isArray(test.speedBonusTiers)) {
    return test.speedBonusTiers.map(t => ({
      timeSec: Math.max(0, Math.round(Number(t.timeSec) || 0)),
      bonus: round1(t.bonus)
    })).filter(t => t.timeSec > 0 && t.bonus > 0).sort((a, b) => a.timeSec - b.timeSec);
  }
  if (test.speedBonusPct != null && test.speedBonusPct > 0) {
    const base = getBasePoints(test);
    const maxBonus = round1(base * test.speedBonusPct / 100);
    const total = Number(test.timePerQuestion) || 20;
    return [
      { timeSec: Math.round(total * 0.75), bonus: round1(maxBonus * 0.8) },
      { timeSec: Math.round(total * 0.50), bonus: round1(maxBonus * 0.5) },
      { timeSec: Math.round(total * 0.25), bonus: round1(maxBonus * 0.2) }
    ].sort((a, b) => a.timeSec - b.timeSec);
  }
  return JSON.parse(JSON.stringify(DEFAULT_SPEED_TIERS));
}
function getMaxBonus(test) {
  const tiers = getSpeedTiers(test);
  if (!tiers.length) return 0;
  return tiers.reduce((m, t) => Math.max(m, t.bonus), 0);
}
function getMaxPerQuestion(test) { return round1(getBasePoints(test) + getMaxBonus(test)); }
function getMaxScore(test) {
  if (!test) return 0;
  return round1((test.questions || []).length * getMaxPerQuestion(test));
}
function calcSpeedBonus(test, timeSpentSec, timeTotalSec) {
  const tiers = getSpeedTiers(test);
  if (!tiers.length) return 0;
  const remaining = Math.max(0, (Number(timeTotalSec) || 0) - (Number(timeSpentSec) || 0));
  let best = 0;
  for (const tier of tiers) if (remaining >= tier.timeSec) best = Math.max(best, tier.bonus);
  return best;
}
function interpretPct(pct) {
  if (pct >= 90) return '🏆 Отличное знание материала';
  if (pct >= 75) return '👍 Хорошее знание';
  if (pct >= 50) return '📘 Средний уровень, есть пробелы';
  return '⚠️ Материал усвоен плохо';
}
function interpretScore(score, maxScore) {
  const pct = maxScore > 0 ? Math.round((score || 0) / maxScore * 100) : 0;
  return interpretPct(pct);
}

const NAME_REGEX = /^[А-Яа-яЁёA-Za-z\-\s]+$/;

function readFileAsDataURL(file) {

function buildExcelFilename(testTitle, shortName, prefix) {
  const base = shortName && shortName.trim() ? shortName.trim() : (testTitle || 'тест');
  const clean = sanitizeFilename(base, 40);
  const stamp = shortDateStamp();
  return prefix ? `${prefix}_${clean}_${stamp}.xls` : `${clean}_${stamp}.xls`;
}

/* ==================================================================
   АНТИЧИТ
   ================================================================== */
function enableAntiCheat(studentRef, antiCheatMode, onTerminate) {
  antiCheatActive = true;
  antiCheatTabSwitches = 0;
  antiCheatCopyAttempts = 0;
  antiCheatRef = studentRef;
  syncState.antiCheatMode = antiCheatMode || 'soft';
  acTerminated = false;
  acOnTerminate = onTerminate || null;
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('blur', onWindowBlur);
  document.addEventListener('copy', onCopyAttempt);
  document.addEventListener('cut', onCopyAttempt);
  document.addEventListener('contextmenu', onContextMenuGlobal, true);
  document.addEventListener('dragstart', onDragStartGlobal, true);
}
function disableAntiCheat() {
  antiCheatActive = false;
  antiCheatRef = null;
  acOnTerminate = null;
  if (acBlurTimeout) { clearTimeout(acBlurTimeout); acBlurTimeout = null; }
  document.removeEventListener('visibilitychange', onVisibilityChange);
  window.removeEventListener('blur', onWindowBlur);
  document.removeEventListener('copy', onCopyAttempt);
  document.removeEventListener('cut', onCopyAttempt);
  document.removeEventListener('contextmenu', onContextMenuGlobal, true);
  document.removeEventListener('dragstart', onDragStartGlobal, true);
}
function onVisibilityChange() {
  if (!antiCheatActive || !antiCheatRef || acTerminated) return;
  if (document.hidden) handleTabSwitch();
}
function onWindowBlur() {
  if (!antiCheatActive || !antiCheatRef || acTerminated) return;
  if (document.hidden) return;
  if (acBlurTimeout) clearTimeout(acBlurTimeout);
  acBlurTimeout = setTimeout(() => {
    if (document.hidden) return;
    handleTabSwitch();
  }, 600);
}
function handleTabSwitch() {
  if (acTerminated) return;
  antiCheatTabSwitches++;
  window.FB.update(antiCheatRef, {
    tabSwitches: antiCheatTabSwitches,
    lastTabSwitchAt: Date.now()
  }).catch(() => {});

  const acMode = syncState.antiCheatMode || 'soft';
  if (acMode === 'hard') {
    terminateStudentTest('tab_switch', 'Жёсткий режим античита: тест прерван при уходе с вкладки.');
  } else {
    if (antiCheatTabSwitches >= 2) {
      terminateStudentTest('tab_switch', 'Мягкий режим: второе предупреждение — тест прерван.');
    } else {
      showSoftWarning('⚠️ Предупреждение!\n\nВы покинули вкладку. При следующем уходе тест будет прерван.');
    }
  }
}
function onCopyAttempt(e) {
  if (!antiCheatActive) return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim().length > 0) {
    e.preventDefault();
    antiCheatCopyAttempts++;
    if (antiCheatRef) window.FB.update(antiCheatRef, { copyAttempts: antiCheatCopyAttempts }).catch(() => {});
  }
}
function onContextMenuGlobal(e) {
  if (!antiCheatActive) return;
  const area = document.querySelector('.sync-student-screen');
  if (area && area.contains(e.target)) e.preventDefault();
}
function onDragStartGlobal(e) {
  if (!antiCheatActive) return;
  const area = document.querySelector('.sync-student-screen');
  if (area && area.contains(e.target)) e.preventDefault();
}
function showSoftWarning(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(30,27,75,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  el.innerHTML = `<div style="background:#fff;border-radius:20px;padding:28px 32px;max-width:480px;text-align:center;">
    <div style="font-size:52px;margin-bottom:10px;">⚠️</div>
    <h3 style="margin:0 0 10px;color:#ef4444;font-size:20px;">Внимание!</h3>
    <p style="color:#475569;font-weight:600;margin:0 0 20px;line-height:1.5;white-space:pre-wrap;">${escapeHtml(msg)}</p>
    <button id="acOk" style="padding:12px 32px;">Понятно</button>
  </div>`;
  document.body.appendChild(el);
  el.querySelector('#acOk').onclick = () => el.remove();
}
function terminateStudentTest(reason, message) {
  if (acTerminated) return;
  acTerminated = true;
  const cb = acOnTerminate;
  disableAntiCheat();
  if (typeof cb === 'function') cb(reason, message);
}

function excelStyles() {
  return `table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt;}
  td,th{border:1px solid #999;padding:6px 8px;vertical-align:top;}
  .title{font-size:14pt;font-weight:bold;background:#dbeafe;text-align:left;}
  .summary-label{font-weight:bold;background:#f3f4f6;width:180px;text-align:left;}
  .summary-value{text-align:left!important;mso-number-format:"\\@";}
  th{background:#e5e7eb;font-weight:bold;text-align:left;}
  .ok{color:#16a34a;font-weight:bold;}.bad{color:#dc2626;font-weight:bold;}
  .warn{color:#b45309;font-weight:bold;}.c{text-align:center;}
  .img-cell{text-align:center;}.img-cell img{max-height:120px;max-width:200px;}
  .header-meta{background:#f8fafc;padding:8px;font-size:10pt;}`;
}
function studentSheetHTML(rec) {
  let rows = '';
  (rec.answers || []).forEach((a, i) => {
    const ans = a.selectedText ? escapeHtml(a.selectedText) : '<i>нет ответа</i>';
    const verdict = a.correct ? '<span class="ok">✔ верно</span>' : '<span class="bad">✘ неверно</span>';
    const bonusCell = a.speedBonus ? `<span class="ok">⚡ +${formatScore(a.speedBonus)}</span>` : '—';
    const pointsCell = a.correct ? `<b>${formatScore(a.points || 0)}</b>` : '0';
    rows += `<tr><td class="c">${i+1}</td><td>${escapeHtml(a.questionText)}</td><td>${escapeHtml(a.correctText)}</td><td>${ans}</td><td class="c">${verdict}</td><td class="c">${pointsCell}</td><td class="c">${bonusCell}</td></tr>`;
  });
  const tRow = (rec.teacherName || rec.teacherEmail)
    ? `<tr><td colspan="2" class="summary-label">Учитель</td><td colspan="5" class="summary-value">${escapeHtml(rec.teacherName || rec.teacherEmail)}</td></tr>`
    : '';
  const maxScore = rec.maxScore || 100;
  const scoreStr = `${formatScore(rec.score)} / ${formatScore(maxScore)}`;
  return `<table>
    <tr><td colspan="7" class="title">${escapeHtml(rec.testTitle)}</td></tr>
    <tr><td colspan="7" style="height:8px;border:none;"></td></tr>
    <tr><td colspan="2" class="summary-label">Ученик</td><td colspan="5" class="summary-value">${escapeHtml(rec.studentName)}</td></tr>
    ${tRow}
    <tr><td colspan="2" class="summary-label">Дата</td><td colspan="5" class="summary-value">${escapeHtml(rec.date)}</td></tr>
    <tr><td colspan="2" class="summary-label">Правильных</td><td colspan="5" class="summary-value"><span class="ok">${rec.correct}</span></td></tr>
    <tr><td colspan="2" class="summary-label">Неправильных</td><td colspan="5" class="summary-value"><span class="bad">${rec.wrong}</span></td></tr>
    <tr><td colspan="2" class="summary-label">Баллов</td><td colspan="5" class="summary-value"><b>${scoreStr}</b></td></tr>
    <tr><td colspan="2" class="summary-label">Оценка</td><td colspan="5" class="summary-value">${escapeHtml(interpretScore(rec.score, maxScore))}</td></tr>
    <tr><td colspan="7" style="height:12px;border:none;"></td></tr>
    <tr><th class="c">#</th><th>Вопрос</th><th>Правильный ответ</th><th>Ответ ученика</th><th class="c">Итог</th><th class="c">Балл</th><th class="c">Бонус</th></tr>
    ${rows}
    <tr><td colspan="7" style="height:16px;border:none;"></td></tr>
    <tr><td colspan="7" style="border:none;padding:6px 8px;text-align:left;">Подпись учителя: _______________________ &nbsp;&nbsp; Дата: _______________________</td></tr>
  </table>`;
}
function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportStudentsWorkbook(results, testTitle, testId, shortName) {
  if (!results || results.length === 0) { alert('Нет результатов'); return; }
  if (!shortName && testId && testsCache[testId]) shortName = testsCache[testId].shortName || '';
  const names = uniqueSheetNames(results.map(r => r.studentName));
  const sheetsXML = names.map(n => `<x:ExcelWorksheet><x:Name>${escapeXml(n)}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>`).join('');
  const tables = results.map(r => studentSheetHTML(r)).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheetsXML}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head><body>${tables}</body></html>`.trim();
  downloadBlob(html, buildExcelFilename(testTitle, shortName), 'application/vnd.ms-excel;charset=utf-8;');
}
function exportFlatSummary(results, title, filename) {
  if (!results || results.length === 0) { alert('Нет данных'); return; }
  const rows = results.sort((a,b) => b.timestamp - a.timestamp).map((r, i) => {
    const ms = r.maxScore || 100;
    return `<tr>
      <td class="c">${results.length - i}</td>
      <td>${escapeHtml(r.date)}</td><td>${escapeHtml(r.teacherName || r.teacherEmail || '')}</td>
      <td>${escapeHtml(r.testTitle || '')}</td><td>${escapeHtml(r.studentName || '')}</td>
      <td class="c ok">${r.correct}</td><td class="c bad">${r.wrong}</td>
      <td class="c"><b>${formatScore(r.score)}</b></td>
      <td class="c" style="font-size:9pt;color:#666;">${formatScore(ms)}</td>
      <td>${escapeHtml(interpretScore(r.score, ms))}</td></tr>`;
  }).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Сводка</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head><body><table>
  <tr><td colspan="10" class="title">${escapeHtml(title)}</td></tr>
  <tr><td colspan="10" style="height:8px;border:none;"></td></tr>
  <tr><th class="c">№</th><th>Дата</th><th>Учитель</th><th>Тест</th><th>Ученик</th>
  <th class="c">Верно</th><th class="c">Неверно</th><th class="c">Балл</th><th class="c">Макс</th><th>Оценка</th></tr>
  ${rows}</table></body></html>`.trim();
  downloadBlob(html, filename, 'application/vnd.ms-excel;charset=utf-8;');
}

function renderAuth(expectedRole) {
  clearAllUnsubs();
  fbReady(() => {
    const isDev = expectedRole === 'developer';
    document.body.className = isDev ? 'theme-developer' : 'theme-teacher';
    app.innerHTML = `<div class="auth-form" style="max-width:440px;margin:40px auto;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:0 20px 60px rgba(124,58,237,0.12);">
      <h1 style="text-align:center;">${isDev ? '🛠 Вход разработчика' : '👨‍🏫 Вход учителя'}</h1>
      <p class="hint" style="text-align:center;margin-bottom:24px;">${isDev ? 'Панель управления системой' : 'Кабинет для проведения тестов'}</p>
      ${isDev ? `
        <label class="label">Email</label>
        <input type="email" id="loginEmail" placeholder="you@school.ru" autocomplete="email">
      ` : `
        <label class="label">Имя Отчество</label>
        <input type="text" id="loginName" placeholder="Иванов Иван" autocomplete="username">
        <p class="hint" style="font-size:11px;margin-top:-4px;">Введите ИО, указанное разработчиком при создании</p>
      `}
      <label class="label">Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
      <p id="loginError" style="color:#ef4444;font-size:13px;font-weight:600;min-height:20px;margin:6px 0 10px;text-align:center;"></p>
      <button id="doLogin" class="green" style="width:100%;padding:14px;">Войти →</button>
      <p class="hint" style="text-align:center;margin-top:14px;"><a href="?mode=student" style="color:var(--violet);text-decoration:none;font-weight:600;">← Ко входу ученика</a></p>
    </div>`;
    document.getElementById('doLogin').onclick = doLogin;
    const passInput = document.getElementById('loginPass');
    if (passInput) passInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    const nameInput = document.getElementById('loginName');
    if (nameInput) nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const pass = document.getElementById('loginPass').value;
      const err = document.getElementById('loginError');
      err.textContent = '';

      let email = '';

      if (isDev) {
        email = document.getElementById('loginEmail').value.trim();
        if (!email || !pass) { err.textContent = 'Заполните email и пароль'; return; }
      } else {
        const nameRaw = document.getElementById('loginName').value.trim();
        if (!nameRaw || !pass) { err.textContent = 'Заполните ИО и пароль'; return; }

        if (nameRaw.includes('@')) {
          email = nameRaw;
        } else {
          try {
            const key = nameLookupKey(nameRaw);
            const snap = await window.FB.get(window.FB.ref(window.FB.db, `teacher_lookup/${key}`));
            const entry = snap.val();
            if (!entry || !entry.email) {
              err.textContent = 'Учитель с таким ИО не найден';
              return;
            }
            email = entry.email;
          } catch (lookupErr) {
            err.textContent = 'Ошибка поиска: ' + (lookupErr.message || '');
            return;
          }
        }
      }

      try {
        const cred = await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
        let profile = getCachedProfile(cred.user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${cred.user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(cred.user.uid, profile);
        }
        if (!profile) { err.textContent = 'Профиль не найден'; await window.FB.signOut(window.FB.auth); return; }
        if (isDev && profile.role !== 'developer') { err.textContent = 'Это не аккаунт разработчика'; await window.FB.signOut(window.FB.auth); return; }
        if (!isDev && profile.role !== 'teacher') { err.textContent = 'Это не аккаунт учителя'; await window.FB.signOut(window.FB.auth); return; }
        currentUser = { uid: cred.user.uid, email: profile.email || email, role: profile.role, name: profile.name || '' };
        if (profile.role === 'developer') renderDeveloperHome();
        else renderTeacherHome();
      } catch (e) {
        const c = e && e.code;
        if (c === 'auth/invalid-email') err.textContent = 'Некорректный email';
        else if (c === 'auth/user-not-found') err.textContent = 'Пользователь не найден';
        else if (c === 'auth/wrong-password') err.textContent = 'Неверный пароль';
        else if (c === 'auth/invalid-credential') err.textContent = 'Неверное ИО или пароль';
        else if (c === 'auth/too-many-requests') err.textContent = 'Слишком много попыток';
        else err.textContent = 'Ошибка: ' + (e.message || 'неизвестная');
      }
    }
  });
}

          <div style="background:#fff;border-radius:10px;padding:10px;margin-bottom:6px;border-left:3px solid var(--green);">

    list.querySelectorAll('[data-reply-btn]').forEach(b => b.onclick = async () => {

      ta.value = '';

}

async function rebuildTeacherLookup() {
  try {
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users'));
    const users = snap.val() || {};
    const updates = {};
    for (const [uid, u] of Object.entries(users)) {
      if (u && u.role === 'teacher' && u.name && u.email) {
        updates[`teacher_lookup/${nameLookupKey(u.name)}`] = {
          email: u.email, uid, name: u.name
        };
      }
    }
    if (Object.keys(updates).length > 0) {
      await window.FB.update(window.FB.ref(window.FB.db), updates);
    }
  } catch (e) { console.warn('rebuildTeacherLookup:', e); }
}

function renderDeveloperTestsList() {
  const el = document.getElementById('testsManageArea');
  if (!el) return;
  const tests = Object.entries(testsCache);
  if (tests.length === 0) { el.innerHTML = `<p class="hint">Тестов пока нет.</p>`; return; }
  const rows = tests.map(([id, t]) => {
    const statusBadge = t.status === 'draft' ? '<span class="badge draft">ЧЕРНОВИК</span>' : '<span class="badge published">ОПУБЛИКОВАН</span>';
    const shortInfo = t.shortName ? `<div style="font-size:11px;color:#94a3b8;font-weight:700;margin-top:3px;">🏷 ${escapeHtml(t.shortName)}</div>` : '';
    const baseP = getBasePoints(t), maxBonus = getMaxBonus(t), tiers = getSpeedTiers(t);
    const tiersInfo = tiers.length ? `⚡ ${baseP} б + до +${formatScore(maxBonus)} (${tiers.length} ступ.)` : `⚡ ${baseP} б/вопрос`;
    return `<tr>
      <td style="font-family:monospace;font-size:12px;color:#94a3b8;">${escapeHtml(id)}</td>
      <td>${escapeHtml(t.title)}${shortInfo}<div style="font-size:11px;color:#b45309;font-weight:700;margin-top:3px;">${tiersInfo}</div></td>
      <td style="text-align:center;">${statusBadge}</td>
      <td style="text-align:center;">${(t.questions || []).length}</td>
      <td style="text-align:center;font-weight:800;color:var(--violet);">${formatScore(getMaxScore(t))}</td>
      <td class="action-cell">
        <button class="small" data-edit="${id}">✏</button>
        <button class="small danger" data-del="${id}">✕</button>
      </td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th style="width:160px;">ID</th><th>Название</th><th style="width:120px;">Статус</th><th style="width:80px;">Вопросов</th><th style="width:90px;">Макс</th><th style="width:120px;">Действия</th></tr></thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openTestEditor(b.dataset.edit, testsCache[b.dataset.edit]));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    if (!confirm(`Удалить тест «${testsCache[id].title}»?`)) return;
    await window.FB.remove(window.FB.ref(window.FB.db, `tests/${id}`));
    delete testsCache[id];
    // Чистим id теста из классов
    try {
      const clsSnap = await window.FB.get(window.FB.ref(window.FB.db, 'classes'));
      const cls = clsSnap.val() || {};
      for (const [cid, c] of Object.entries(cls)) {
        if (Array.isArray(c.tests) && c.tests.includes(id)) {
          const newT = c.tests.filter(x => x !== id);
          await window.FB.update(window.FB.ref(window.FB.db, `classes/${cid}`), { tests: newT });
          if (classesCache[cid]) classesCache[cid].tests = newT;
        }
      }
    } catch (e) { console.warn('cleanup test from classes:', e); }
    renderDeveloperTestsList();
  });
}

async function loadTeachersData() {
  try {
    const [u, s, r] = await Promise.all([
      window.FB.get(window.FB.ref(window.FB.db, 'users')),
      window.FB.get(window.FB.ref(window.FB.db, 'sessions')),
      window.FB.get(window.FB.ref(window.FB.db, 'results'))
    ]);
    teachersUsersCache = u.val() || {};
    teachersStatsCache.sessions = s.val() || {};
    teachersStatsCache.results = r.val() || {};
  } catch (e) { teachersUsersCache = {}; teachersStatsCache = { sessions: {}, results: {} }; }
}
async function renderTeachersList() {
  const el = document.getElementById('teachersArea');
  if (!el) return;
  el.innerHTML = `<p class="hint"><span class="loading-spinner"></span>Загрузка…</p>`;
  await loadTeachersData();
  const teachers = Object.entries(teachersUsersCache).filter(([_, u]) => u && u.role === 'teacher').map(([uid, u]) => ({ uid, ...u }));
  if (teachers.length === 0) { el.innerHTML = `<p class="hint">Учителей нет.</p>`; return; }
  const stats = {};
  teachers.forEach(t => stats[t.uid] = { sessionsTotal: 0, studentsTotal: 0, resultsTotal: 0, avgScore: 0, lastActivityAt: 0 });
  Object.values(teachersStatsCache.sessions).forEach(s => {
    if (!s || !s.teacherId || !stats[s.teacherId]) return;
    stats[s.teacherId].sessionsTotal++;
    stats[s.teacherId].studentsTotal += Object.keys(s.students || {}).length;
    if (s.createdAt > stats[s.teacherId].lastActivityAt) stats[s.teacherId].lastActivityAt = s.createdAt;
  });
  Object.values(teachersStatsCache.results).forEach(r => {
    if (!r || !r.teacherId || !stats[r.teacherId]) return;
    stats[r.teacherId].resultsTotal++;
    stats[r.teacherId]._s = (stats[r.teacherId]._s || 0) + (r.score || 0);
    if (r.timestamp > stats[r.teacherId].lastActivityAt) stats[r.teacherId].lastActivityAt = r.timestamp;
  });
  Object.keys(stats).forEach(uid => {
    stats[uid].avgScore = stats[uid].resultsTotal > 0 ? round1((stats[uid]._s || 0) / stats[uid].resultsTotal) : 0;
    delete stats[uid]._s;
  });
  el.innerHTML = `<div class="students-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">
    ${teachers.map(t => {
      const st = stats[t.uid];
      const initials = (String(t.name || t.email || '?')[0] || '?').toUpperCase();
      return `<div class="student-card" style="padding:16px;">
        <div style="display:flex;gap:10px;margin-bottom:10px;">
          <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;">${initials}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(t.name || t.email || '')}">${escapeHtml(t.name || '—')}</div>
            <div style="font-size:11px;color:#64748b;font-weight:700;">${escapeHtml(t.email || '')} · 👨‍🏫</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;">
          <div style="background:#f8fafc;border-radius:8px;padding:6px;text-align:center;">
            <div style="font-size:18px;font-weight:900;color:var(--violet);">${st.sessionsTotal}</div>
            <div style="font-size:9px;color:#64748b;font-weight:800;">СЕССИЙ</div>
          </div>
          <div style="background:#f8fafc;border-radius:8px;padding:6px;text-align:center;">
            <div style="font-size:18px;font-weight:900;color:var(--green);">${st.resultsTotal}</div>
            <div style="font-size:9px;color:#64748b;font-weight:800;">ПРОХОЖД.</div>
          </div>
          <div style="background:#f8fafc;border-radius:8px;padding:6px;text-align:center;">
            <div style="font-size:18px;font-weight:900;color:var(--blue);">${formatScore(st.avgScore)}</div>
            <div style="font-size:9px;color:#64748b;font-weight:800;">СР. БАЛЛ</div>
          </div>
        </div>
        <button class="small danger" data-teacher-del="${t.uid}" style="width:100%;">🗑 Удалить профиль</button>
      </div>`;
    }).join('')}
  </div>`;
  el.querySelectorAll('[data-teacher-del]').forEach(b => b.onclick = async () => {
    const uid = b.dataset.teacherDel;
    const t = teachers.find(x => x.uid === uid);
    if (!confirm(`Удалить профиль учителя «${t.name || t.email}»?`)) return;
    if (t && t.name) {
      await window.FB
        .remove(window.FB.ref(window.FB.db, `teacher_lookup/${nameLookupKey(t.name)}`))
        .catch(() => {});
    }
    // Чистим uid из классов
    try {
      const clsSnap = await window.FB.get(window.FB.ref(window.FB.db, 'classes'));
      const cls = clsSnap.val() || {};
      for (const [cid, c] of Object.entries(cls)) {
        if (Array.isArray(c.teachers) && c.teachers.includes(uid)) {
          const newT = c.teachers.filter(x => x !== uid);
          await window.FB.update(window.FB.ref(window.FB.db, `classes/${cid}`), { teachers: newT });
          if (classesCache[cid]) classesCache[cid].teachers = newT;
        }
      }
    } catch (e) { console.warn('cleanup teacher from classes:', e); }
    await window.FB.remove(window.FB.ref(window.FB.db, `users/${uid}`));
    renderTeachersList();
  });
}

    <div class="anti-cheat-note" style="margin-top:14px;">

      Учитель входит по адресу <code>?mode=teacher</code> — по <b>ИО</b> и паролю.
    </div>
  </div>`, 560);

  m.$('#closeTeacher').onclick = () => m.close();
  m.$('#saveTeacher').onclick = async () => {
    const email = m.$('#newTeacherEmail').value.trim();
    const pass = m.$('#newTeacherPass').value;
    const name = m.$('#newTeacherName').value.trim();
    const err = m.$('#newTeacherError');
    err.textContent = '';

    if (!email) { err.textContent = 'Укажите email'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Некорректный email'; return; }
    if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
    if (!name) { err.textContent = 'Укажите имя и отчество'; return; }

    const btn = m.$('#saveTeacher');
    btn.disabled = true;
    btn.textContent = 'Создаём…';

    try {
      // Создаём учителя через secondaryAuth — основная сессия разработчика не сбивается
      const cred = await window.FB.createUserWithEmailAndPassword(window.FB.secondaryAuth, email, pass);
      const uid = cred.user.uid;

      await window.FB.set(window.FB.ref(window.FB.db, `users/${uid}`), {
        email,
        name,
        role: 'teacher',
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.uid : null
      });

      // Индекс для входа по ИО
      try {
        await window.FB.set(
          window.FB.ref(window.FB.db, `teacher_lookup/${nameLookupKey(name)}`),
          { email, uid, name, createdAt: Date.now() }
        );
      } catch (lookupErr) { console.warn('teacher_lookup:', lookupErr); }

      // Чистим вторичную сессию
      try { await window.FB.signOut(window.FB.secondaryAuth); } catch (signOutErr) {}

      // Письмо сброса пароля — через основную auth
      let emailSent = false;
      try {
        await window.FB.sendPasswordResetEmail(window.FB.auth, email);
        emailSent = true;
      } catch (mailErr) {
        console.warn('Не удалось отправить письмо:', mailErr);
      }

      m.close();
      alert(
        `✅ Учитель создан!\n\n` +
        `Имя: ${name}\n` +
        `Email: ${email}\n` +
        `Пароль: ${pass}\n\n` +
        `Вход: ?mode=teacher\n` +
        `Логин: ввести ИО «${name}»\n\n` +
        (emailSent
          ? `📧 На почту отправлено письмо для установки своего пароля.\n\n`
          : `⚠️ Письмо отправить не удалось. Передайте пароль лично.\n\n`)
      );

      renderTeachersList();
      renderDeveloperMetrics();
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/email-already-in-use') err.textContent = 'Этот email уже используется';
      else if (c === 'auth/invalid-email') err.textContent = 'Некорректный email';
      else if (c === 'auth/weak-password') err.textContent = 'Слишком слабый пароль';
      else err.textContent = 'Ошибка: ' + (e.message || 'неизвестная');
      btn.disabled = false;
      btn.textContent = '💾 Создать аккаунт';
    }
  };
}

      <div class="editor-settings-section">

        <input type="file" id="setIntroFile" accept="image/*">
        <div class="cover-preview" id="coverPreview">${settings.introImage ? `<img src="${escapeAttr(settings.introImage)}">` : '🖼 Превью'}</div>
      </div>
      <div class="editor-settings-section">
        <h4><span class="step-num">3</span> ⏱ Время на вопрос</h4>
        <label class="field-label">По умолчанию (сек)</label>
        <input type="number" id="setTime" min="5" max="300" value="${settings.timePerQuestion}">
      </div>
      <div class="editor-settings-section">
        <h4><span class="step-num">4</span> 🎯 Система баллов (только для Лобби)</h4>
        <label class="field-label">Баллов за правильный ответ</label>
        <input type="number" id="setBasePoints" min="0.1" max="1000" step="0.1" value="${settings.basePoints}">
        <div style="border-top:2px dashed #e2e8f0;padding-top:14px;margin-top:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <div>
              <div style="font-weight:800;font-size:14px;">⚡ Бонусы за скорость</div>
              <div style="font-size:12px;color:var(--muted);">Срабатывает, если на таймере <b>осталось ≥ N сек</b></div>
            </div>
            <button type="button" id="addTierBtn" class="tier-add-btn">➕ Добавить ступень</button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
            <button type="button" class="tier-preset-btn" data-preset="standard" style="background:#f0fdf4;color:#16a34a;border:2px solid #86efac;">🎯 Стандарт</button>
            <button type="button" class="tier-preset-btn" data-preset="soft" style="background:#eff6ff;color:#1d4ed8;border:2px solid #bfdbfe;">🌸 Мягкий</button>
            <button type="button" class="tier-preset-btn" data-preset="hardcore" style="background:#fef2f2;color:#b91c1c;border:2px solid #fecaca;">🔥 Хардкор</button>
            <button type="button" class="tier-preset-btn" data-preset="none" style="background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;">🚫 Выкл</button>

          <div id="tiersBox">${renderTierRows()}</div>

      </div>
      <div class="editor-settings-section">
        <h4><span class="step-num">5</span> 🛡 Античит</h4>

          <option value="soft" ${settings.antiCheatMode === 'soft' ? 'selected' : ''}>⚠️ Мягкий — 1 предупреждение, потом прерывание</option>

      </div>
      <div class="editor-settings-section" style="background:#f5f3ff;border-color:#c4b5fd;">
        <div style="font-weight:800;color:var(--violet);margin-bottom:10px;">📊 Итог</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
          <div style="background:#fff;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--violet);">${questions.length}</div><div style="font-size:11px;color:#64748b;font-weight:800;">ВОПРОСОВ</div></div>
          <div style="background:#fff;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--green);">${formatScore(baseP)}</div><div style="font-size:11px;color:#64748b;font-weight:800;">БАЗА</div></div>

          <div style="background:#fff;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--blue);">${formatScore(totalMax)}</div><div style="font-size:11px;color:#64748b;font-weight:800;">МАКСИМУМ</div></div>

    m.$('#setShortName').oninput = (e) => { settings.shortName = e.target.value; };
    m.$('#setIntro').oninput = (e) => { settings.intro = e.target.value; };
    m.$('#setAntiCheat').onchange = (e) => { settings.antiCheatMode = e.target.value; };

      settings.basePoints = isNaN(v) ? 0 : Math.max(0, round1(v));
      renderSettings();
    };
    m.$('#setIntroImage').oninput = (e) => {
      settings.introImage = e.target.value.trim();
      m.$('#coverPreview').innerHTML = settings.introImage ? `<img src="${escapeAttr(settings.introImage)}">` : '🖼 Превью';

      const f = e.target.files[0]; if (!f) return;
      try {
        const d = await readFileAsDataURL(f);

        m.$('#setIntroImage').value = '';
        m.$('#coverPreview').innerHTML = `<img src="${d}">`;
      } catch (err) { alert(err.message); }
    };
    m.$('#setTime').oninput = (e) => { settings.timePerQuestion = parseInt(e.target.value, 10) || 20; };

    editorBody.querySelectorAll('.tier-time').forEach(inp => inp.oninput = (e) => {
      const i = +e.target.dataset.idx;
      const v = parseInt(e.target.value, 10);
      if (!isNaN(v)) settings.speedTiers[i].timeSec = Math.max(1, v);
      renderSettings();
    });
    editorBody.querySelectorAll('.tier-bonus').forEach(inp => inp.oninput = (e) => {
      const i = +e.target.dataset.idx;
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) settings.speedTiers[i].bonus = Math.max(0, round1(v));
      renderSettings();
    });
    editorBody.querySelectorAll('[data-del-tier]').forEach(b => b.onclick = () => {
      settings.speedTiers.splice(+b.dataset.delTier, 1);
      renderSettings();
    });
    m.$('#addTierBtn').onclick = () => {
      const minT = settings.speedTiers.length ? Math.min(...settings.speedTiers.map(t => t.timeSec)) : 15;
      settings.speedTiers.push({ timeSec: Math.max(1, minT - 5), bonus: 1 });
      settings.speedTiers.sort((a, b) => b.timeSec - a.timeSec);
      renderSettings();
    };
    editorBody.querySelectorAll('.tier-preset-btn').forEach(btn => btn.onclick = () => {
      const preset = btn.dataset.preset;
      const total = Number(settings.timePerQuestion) || 20;
      const base = Number(settings.basePoints) || 5;
      if (preset === 'standard') {
        settings.speedTiers = [
          { timeSec: Math.round(total * 0.75), bonus: round1(base * 0.6) },
          { timeSec: Math.round(total * 0.50), bonus: round1(base * 0.4) },
          { timeSec: Math.round(total * 0.25), bonus: round1(base * 0.2) }
        ].filter(t => t.timeSec < total);
      } else if (preset === 'soft') {
        settings.speedTiers = [
          { timeSec: Math.round(total * 0.50), bonus: round1(base * 0.2) },
          { timeSec: Math.round(total * 0.25), bonus: round1(base * 0.1) }
        ].filter(t => t.timeSec < total);
      } else if (preset === 'hardcore') {
        settings.speedTiers = [
          { timeSec: Math.round(total * 0.85), bonus: round1(base * 1.0) },
          { timeSec: Math.round(total * 0.60), bonus: round1(base * 0.6) },
          { timeSec: Math.round(total * 0.35), bonus: round1(base * 0.3) }
        ].filter(t => t.timeSec < total);
      } else settings.speedTiers = [];
      settings.speedTiers.sort((a, b) => b.timeSec - a.timeSec);
      renderSettings();
    });
  }

  function renderQuestionEditor() {

    editorHead.innerHTML = `
      <h3><span class="q-badge">${activeQ + 1}</span> ${escapeHtml((q.q || 'Новый вопрос').slice(0, 40))}</h3>

        <button class="danger" data-remove-q="${activeQ}">🗑</button>
      </div>`;
    editorBody.innerHTML = `
      <div class="field-row">
        <div>
          <label class="field-label">Текст вопроса <span class="req">*</span></label>

          <label class="field-label">⏱ Своё время (сек)</label>

        <div>
          <label class="field-label">Медиа</label>

      <label class="field-label">Ответы <span class="req">*</span></label>
      <div>${q.options.map((opt, oi) => `
        <div class="answer-row ${q.correct === oi ? 'correct' : ''}" data-oi="${oi}">
          <input type="radio" name="correct" ${q.correct === oi ? 'checked' : ''} data-set-correct="${oi}">
          <input type="text" class="ans-text" data-oi="${oi}" value="${escapeHtml(opt)}">
        </div>`).join('')}</div>`;

    m.$('#qText').oninput = (e) => { questions[activeQ].q = e.target.value; renderSidebar(); };
    m.$('#qTime').oninput = (e) => {
      const v = e.target.value.trim();
      questions[activeQ].time = v ? Math.max(5, Math.min(300, parseInt(v, 10) || 20)) : null;
    };
    m.$('#qImage').oninput = (e) => {
      const v = e.target.value.trim();
      if (v) questions[activeQ].image = v;
      m.$('#qImagePreview').innerHTML = questions[activeQ].image ? `<img src="${escapeAttr(questions[activeQ].image)}">` : '🖼 Превью';
    };
    m.$('#qImageFile').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const d = await readFileAsDataURL(f);
        questions[activeQ].image = d;
        m.$('#qImage').value = '';
        m.$('#qImagePreview').innerHTML = `<img src="${d}">`;
      } catch (err) { alert(err.message); }
    };
    m.$$('.ans-text').forEach(inp => inp.oninput = () => { questions[activeQ].options[+inp.dataset.oi] = inp.value; });
    m.$$('[data-set-correct]').forEach(rb => rb.onchange = () => {
      questions[activeQ].correct = +rb.dataset.setCorrect;
      m.$$('.answer-row').forEach(r => r.classList.toggle('correct', +r.dataset.oi === questions[activeQ].correct));
    });
    editorHead.querySelector('[data-dupe]').onclick = () => {
      const copy = JSON.parse(JSON.stringify(questions[activeQ]));
      questions.splice(activeQ + 1, 0, copy);
      activeQ++;
      renderSidebar(); renderMain();
    };
    editorHead.querySelector('[data-remove-q]').onclick = () => {
      if (questions.length === 1) return;
      if (!confirm('Удалить вопрос?')) return;
      questions.splice(activeQ, 1);
      activeQ = Math.max(0, activeQ - 1);
      renderSidebar(); renderMain();
    };
  }

  m.$('#csvUpload').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const text = await readFileAsText(f);
      const parsed = parseCSVQuestions(text);
      if (parsed.length === 0) { alert('Не распознано'); return; }
      if (!confirm(`Добавить ${parsed.length} вопросов?`)) return;
      questions = questions.concat(parsed);
      activeQ = questions.length - parsed.length;
      activeTab = 'questions';
      m.$$('.editor-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'questions'));
      renderSidebar(); renderMain();
    } catch (err) { alert('Ошибка: ' + err.message); }
  };

  m.$$('.editor-tab').forEach(t => t.onclick = () => {
    m.$$('.editor-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    renderSidebar(); renderMain();
  });
  addBtn.onclick = () => {
    questions.push({ q: '', options: ['','','',''], correct: 0, image: '', time: null });
    activeQ = questions.length - 1;
    renderSidebar(); renderMain();
  };
  m.$('#closeEditor').onclick = () => { if (confirm('Закрыть?')) m.close(); };

  async function saveTest(publish) {
    if (!settings.title.trim()) { alert('Укажите название'); return false; }
    if (questions.length === 0) { alert('Добавьте вопросы'); return false; }
    for (let i = 0; i < questions.length; i++) {
      if (!questions[i].q.trim()) { alert(`Вопрос ${i+1}: пустая формулировка`); return false; }
      if (questions[i].options.some(o => !o.trim())) { alert(`Вопрос ${i+1}: заполните варианты`); return false; }
    }
    const now = Date.now();
    const id = testId || genId('t');
    const payload = {
      title: settings.title.trim(),
      shortName: (settings.shortName || '').trim().slice(0, 30),
      intro: settings.intro.trim(),
      introImage: settings.introImage.trim(),
      timePerQuestion: settings.timePerQuestion,
      basePoints: round1(settings.basePoints),
      speedBonusTiers: settings.speedTiers
        .map(t => ({ timeSec: Math.max(1, parseInt(t.timeSec, 10) || 5), bonus: round1(t.bonus) }))
        .sort((a, b) => a.timeSec - b.timeSec),
      status: publish ? 'published' : 'draft',
      antiCheatMode: settings.antiCheatMode,
      questions: questions.map(q => ({ q: q.q, options: q.options, correct: q.correct, image: q.image || '', time: q.time || null })),
      createdBy: currentUser.uid, updatedAt: now
    };
    if (isNew) payload.createdAt = now;
    try {
      if (isNew) await window.FB.set(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      else await window.FB.update(window.FB.ref(window.FB.db, `tests/${id}`), payload);
      testsCache[id] = payload;
      renderDeveloperTestsList();
      return true;
    } catch (e) { alert('Ошибка: ' + e.message); return false; }
  }
  m.$('#saveTestBtn').onclick = async () => {
    const ok = await saveTest(true);
    if (ok) { m.close(); alert('✅ Опубликован'); }
  };
  m.$('#saveDraftBtn').onclick = async () => {
    const ok = await saveTest(false);
    if (ok) { m.close(); alert('📝 Черновик сохранён'); }
  };
  if (!isNew) {
    m.$('#deleteTestBtn').onclick = async () => {
      if (!confirm(`Удалить тест «${initial.title}»?`)) return;
      await window.FB.remove(window.FB.ref(window.FB.db, `tests/${testId}`));
      delete testsCache[testId];
      renderDeveloperTestsList();
      m.close();
    };
  }
  renderSidebar(); renderMain();
}

function parseCSVQuestions(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const result = [];
  for (const line of lines) {
    let parts = line.split(';');
    if (parts.length < 5) parts = line.split(',');
    if (parts.length < 5) parts = line.split('\t');
    if (parts.length < 5) continue;
    const q = parts[0].trim().replace(/^"|"$/g, '');
    if (!q) continue;
    const options = [parts[1], parts[2], parts[3], parts[4]].map(x => (x || '').trim().replace(/^"|"$/g, ''));
    if (options.some(o => !o)) continue;
    let correct = parseInt((parts[5] || '1').trim(), 10);
    if (isNaN(correct) || correct < 1 || correct > 4) correct = 1;
    correct = correct - 1;
    const image = (parts[6] || '').trim().replace(/^"|"$/g, '');
    const timeRaw = (parts[7] || '').trim();
    const time = timeRaw ? Math.max(5, Math.min(300, parseInt(timeRaw, 10) || 20)) : null;
    result.push({ q, options, correct, image, time });
  }
  return result;
}

function buildSessionResults(session, test) {
  const students = session.students || {};
  const totalQ = (test && test.questions && test.questions.length) || session.testQuestionCount || 0;
  const maxScore = test ? getMaxScore(test) : 0;
  const results = [];
  Object.values(students).forEach(st => {
    const answersMap = st.answers || {};
    const arr = [];
    for (let i = 0; i < totalQ; i++) {
      const a = answersMap[i] || answersMap[String(i)];
      const tq = test && test.questions[i];
      if (a) {
        arr.push({
          questionText: a.questionText || (tq ? tq.q : 'Вопрос ' + (i+1)),
          correctText: a.correctText || (tq ? tq.options[tq.correct] : ''),
          selectedText: a.selectedText || null,
          correct: !!a.correct,
          image: a.image || (tq ? (tq.image || '') : ''),
          points: a.points || 0,
          speedBonus: a.speedBonus || 0,
          timeSpentSec: a.timeSpentSec || 0
        });
      } else {
        arr.push({
          questionText: tq ? tq.q : ('Вопрос ' + (i+1)),
          correctText: tq ? tq.options[tq.correct] : '',
          selectedText: null,
          correct: false,
          image: tq ? (tq.image || '') : '',
          points: 0, speedBonus: 0, timeSpentSec: 0
        });
      }
    }
    const correct = st.correctCount != null ? st.correctCount : arr.filter(a => a.correct).length;
    const total = arr.length || totalQ;
    results.push({
      studentName: st.studentName || '—',
      testId: session.testId,
      testTitle: session.testTitle,
      date: formatDate(st.finishedAt || st.startedAt || st.joinedAt || Date.now()),
      timestamp: st.finishedAt || st.startedAt || st.joinedAt || Date.now(),
      score: round1(st.score || 0),
      maxScore,
      correct,
      wrong: Math.max(0, total - correct),
      total,
      teacherId: session.teacherId,
      teacherEmail: session.teacherEmail,
      teacherName: session.teacherName || session.teacherEmail,
      sessionCode: sessionCode || '',
      tabSwitches: st.tabSwitches || 0,
      copyAttempts: st.copyAttempts || 0,
      terminated: st.status === 'terminated',
      terminateReason: st.terminateReason || '',
      answers: arr
    });
  });
  return results;
}

/* ---------- Экспорт одного ученика ---------- */
function exportOneStudentTable(code, studentId, session, test) {
  if (!test) return;
  const st = (session.students || {})[studentId];
  if (!st) { alert('Ученик не найден'); return; }

  const totalQ = (test.questions || []).length;
  const maxScore = getMaxScore(test);
  const answersMap = st.answers || {};
  const arr = [];
  for (let i = 0; i < totalQ; i++) {
    const a = answersMap[i] || answersMap[String(i)];
    const tq = test.questions[i];
    if (a) {
      arr.push({
        questionText: a.questionText || (tq ? tq.q : 'Вопрос ' + (i + 1)),
        correctText: a.correctText || (tq ? tq.options[tq.correct] : ''),
        selectedText: a.selectedText || null,
        correct: !!a.correct,
        image: a.image || (tq ? (tq.image || '') : ''),
        points: a.points || 0,
        speedBonus: a.speedBonus || 0,
        timeSpentSec: a.timeSpentSec || 0
      });
    } else {
      arr.push({
        questionText: tq ? tq.q : ('Вопрос ' + (i + 1)),
        correctText: tq ? tq.options[tq.correct] : '',
        selectedText: null,
        correct: false,
        image: tq ? (tq.image || '') : '',
        points: 0, speedBonus: 0, timeSpentSec: 0
      });
    }
  }
  const correct = st.correctCount != null ? st.correctCount : arr.filter(a => a.correct).length;

  const rec = {
    studentName: st.studentName || '—',
    testId: session.testId,
    testTitle: session.testTitle,
    date: formatDate(st.finishedAt || st.startedAt || st.joinedAt || Date.now()),
    timestamp: st.finishedAt || st.startedAt || st.joinedAt || Date.now(),
    score: round1(st.score || 0),
    maxScore,
    correct,
    wrong: Math.max(0, totalQ - correct),
    total: totalQ,
    teacherId: session.teacherId,
    teacherEmail: session.teacherEmail,
    teacherName: session.teacherName || session.teacherEmail,
    sessionCode: code,
    tabSwitches: st.tabSwitches || 0,
    copyAttempts: st.copyAttempts || 0,
    terminated: st.status === 'terminated',
    terminateReason: st.terminateReason || '',
    answers: arr
  };

  const tableHTML = studentSheetHTML(rec);
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><style>${excelStyles()}</style></head><body>${tableHTML}</body></html>`;

  const shortTest = sanitizeFilename(test.shortName || session.testTitle || 'тест', 30);
  const shortStudent = sanitizeFilename(st.studentName || 'Ученик', 30);
  const filename = `${shortTest}_${shortStudent}_${shortDateStamp()}.xls`;
  downloadBlob(html, filename, 'application/vnd.ms-excel;charset=utf-8;');
}

async function exportSessionSummary(code, test) {
  try {
    const sSnap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
    const session = sSnap.val();
    if (!session) return;
    const students = Object.values(session.students || {});
    if (students.length === 0) { alert('Нет данных'); return; }
    students.sort((a, b) => (b.score || 0) - (a.score || 0));
    const totalQ = (test && test.questions && test.questions.length) || session.testQuestionCount || 0;
    const maxScore = test ? getMaxScore(test) : 0;
    const rows = students.map((st, i) => {
      const correct = st.correctCount || 0;
      const wrong = Math.max(0, totalQ - correct);
      const score = round1(st.score || 0);
      const pct = maxScore > 0 ? Math.round(score / maxScore * 100) : 0;
      const color = pct >= 75 ? '#16a34a' : pct >= 50 ? '#b45309' : '#dc2626';
      const term = st.status === 'terminated' ? ' <span class="bad">🚫</span>' : '';
      return `<tr>
        <td class="c">${i + 1}</td>
        <td>${escapeHtml(st.studentName || '—')}${term}</td>
        <td class="c ok">${correct}</td>
        <td class="c bad">${wrong}</td>
        <td class="c" style="font-weight:bold;color:${color};font-size:14pt;">${formatScore(score)}</td>
        <td style="font-size:9pt;color:#666;">${escapeHtml(interpretScore(score, maxScore))}</td>
      </tr>`;
    }).join('');
    const avg = students.length ? round1(students.reduce((s, st) => s + (st.score || 0), 0) / students.length) : 0;
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
<head><meta charset="UTF-8"><style>${excelStyles()}</style></head><body><table>
  <tr><td colspan="6" class="title">${escapeHtml(session.testTitle || 'Тест')} — сводная</td></tr>
  <tr><td colspan="3" class="header-meta"><b>Учитель:</b> ${escapeHtml(session.teacherName || session.teacherEmail || '—')}</td>
      <td colspan="3" class="header-meta"><b>Дата:</b> ${escapeHtml(formatDate(Date.now()))}</td></tr>
  <tr><td colspan="3" class="header-meta"><b>Учеников:</b> ${students.length}</td>
      <td colspan="3" class="header-meta"><b>Максимум:</b> ${formatScore(maxScore)}</td></tr>
  <tr><td colspan="3" class="header-meta"><b>Средний:</b> ${formatScore(avg)}</td>
      <td colspan="3" class="header-meta"><b>Режим:</b> ${session.mode === 'individual' ? 'Индивидуальный' : 'Лобби'}</td></tr>
  <tr><th class="c">Место</th><th>ФИО</th><th class="c">Верно</th><th class="c">Неверно</th><th class="c">Балл</th><th>Оценка</th></tr>
  ${rows}
</table></body></html>`;
    downloadBlob(html, buildExcelFilename(session.testTitle, test.shortName || 'сводная', 'Сводная'), 'application/vnd.ms-excel;charset=utf-8;');
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function subscribeTeacherSessionLive(code, test) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snapshot) => {
    const s = snapshot.val();
    if (!s) return;
    renderTeacherPanel(s, test, code);
    renderTeacherStudentsList(s, test);
  }));
  if (test) startAutoAdvance(code, test);
}

function startAutoAdvance(code, test) {
  if (autoAdvanceInterval) { clearInterval(autoAdvanceInterval); autoAdvanceInterval = null; }
  autoAdvanceInterval = setInterval(async () => {
    try {
      const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
      const s = snap.val();
      if (!s) return;
      if (s.mode === 'individual') return;
      if (!s.autoAdvance || s.status !== 'active') return;
      if (s.phase === 'finished' || s.phase === 'lobby') return;
      const idx = s.currentQuestion;

      if (s.phase === 'question' && idx >= 0) {
        const q = test.questions[idx];
        if (!q) return;
        const tTotal = (q.time || test.timePerQuestion || TIME_PER_QUESTION) * 1000;
        const elapsed = Date.now() - (s.questionStartedAt || 0);
        const arr = Object.values(s.students || {});
        const allAns = arr.length > 0 && arr.every(st => st.answers && st.answers[idx]);
        if (allAns && elapsed >= 1500) {
          await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'results', revealedAt: Date.now() });
        }
        else if (elapsed >= tTotal) {
          await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'results', revealedAt: Date.now() });
        }
      }
      if (s.phase === 'results') {
        const d = s.autoAdvanceDelaySec || 5;
        if (Date.now() - (s.revealedAt || 0) >= d * 1000) {
          const nx = idx + 1;
          if (nx < test.questions.length) {
            await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'question', currentQuestion: nx, questionStartedAt: Date.now() });
          } else {
            await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'leaderboard', leaderboardAt: Date.now() });
          }
        }
      }
      if (s.phase === 'leaderboard') {
        const d = s.autoAdvanceDelaySec || 5;
        if (Date.now() - (s.leaderboardAt || 0) >= d * 1000) {
          const nx = idx + 1;
          if (nx < test.questions.length) {
            await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'question', currentQuestion: nx, questionStartedAt: Date.now() });
          } else {
            await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { phase: 'finished', finishedAt: Date.now(), status: 'closed' });
          }
        }
      }
    } catch (e) { console.warn('autoAdvance:', e); }
  }, 500);
}

  if (isIndividual) {
    const started = studentsArr.filter(st => st.status === 'in_progress').length;
    const finished = studentsArr.filter(st => st.status === 'finished').length;

      leaderboard: '🏆 Лидерборд',

        <div style="font-size:64px;">🎯</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:0 auto;">

function renderTeacherStudentsList(s, test) {
  const arr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  const elT = document.getElementById('cntTotal');
  if (elT) elT.textContent = arr.length;
  const area = document.getElementById('studentsArea');
  if (!area) return;
  if (arr.length === 0) { area.innerHTML = `<p class="hint">Ожидание учеников… Код <b>${sessionCode}</b></p>`; return; }
  const isIndividual = s.mode === 'individual';
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  area.innerHTML = arr.map(st => {
    let cls = '', status = '';
    if (st.status === 'intro') { cls = 'active'; status = '📖 Читает вводный текст'; }
    else if (st.status === 'waiting') { cls = 'active'; status = '⏳ Ждёт старта'; }
    else if (st.status === 'in_progress') {
      cls = 'active';
      const cur = isIndividual ? (st.currentQuestion || 0) : idx;
      status = `Вопрос ${(cur || 0) + 1} из ${test.questions.length}`;
    }
    else if (st.status === 'finished') { cls = 'done'; status = `✅ Завершил — ${formatScore(st.score || 0)} б.`; }
    else if (st.status === 'terminated') { cls = 'terminated'; status = `🚫 Прерван античитом`; }
    else { status = 'Ожидание'; }
    const warns = [];
    if (st.tabSwitches > 0) warns.push(`<span style="background:#fef3c7;color:#b45309;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:4px;">⚠ ${st.tabSwitches}</span>`);
    if (st.copyAttempts > 0) warns.push(`<span style="background:#fee2e2;color:#b91c1c;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">📋 ${st.copyAttempts}</span>`);
    const canDownload = st.status === 'finished' || st.status === 'terminated';
    return `<div class="student-card ${cls}">
      <div class="name">${escapeHtml(st.studentName || '—')}</div>
      <div class="status">${escapeHtml(status)}</div>
      <div class="progress">Верно: ${st.correctCount || 0} · ${formatScore(st.score || 0)} б. ${warns.join(' ')}</div>
      ${canDownload ? `<button class="small download" data-export-student="${st.id}" style="width:100%;margin-top:10px;font-size:11px;padding:7px 10px;">📥 Скачать таблицу</button>` : ''}
    </div>`;
  }).join('');

  area.querySelectorAll('[data-export-student]').forEach(b => b.onclick = () => {
    exportOneStudentTable(sessionCode, b.dataset.exportStudent, s, test);
  });
}

        <input type="text" id="sessionInput" class="join-input" placeholder="КВИЗ КОД" inputmode="numeric" maxlength="6" autocomplete="off">
