/* ============ УТИЛИТЫ ============ */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const NAME_REGEX = /^[А-Яа-яЁёA-Za-z\-\s]+$/;
function isValidName(s) {
  const t = String(s).trim();
  if (t.length === 0 || t.length > MAX_NAME_LEN) return false;
  return NAME_REGEX.test(t);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeXml(s) {
  return String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }
function interpret(s) {
  if (s >= 90) return '🏆 Отличное знание материала';
  if (s >= 75) return '👍 Хорошее знание';
  if (s >= 50) return '📘 Средний уровень, есть пробелы';
  return '⚠️ Материал усвоен плохо';
}
function genSessionCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
function genId(prefix) { return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
function sanitizeSheetName(name, idx) {
  let s = String(name).replace(/[:\\\/\?\*\[\]]/g, '_').trim();
  if (!s) s = 'Ученик_' + (idx + 1);
  return s.length > 31 ? s.slice(0, 28) + '...' : s;
}
function uniqueSheetNames(names) {
  const used = new Set();
  return names.map((raw, i) => {
    const base = sanitizeSheetName(raw, i);
    let name = base, k = 2;
    while (used.has(name)) { name = (base.length > 28 ? base.slice(0, 28) : base) + '_' + k; k++; }
    used.add(name); return name;
  });
}
function formatDate(ts) { return new Date(ts).toLocaleString('ru-RU'); }
function formatDateShort(ts) {
  const d = new Date(ts);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function formatTimeShort(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDuration(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + ' сек';
  const m = Math.floor(s / 60); const rs = s % 60;
  return m + ' мин ' + rs + ' сек';
}
function getStudentLocalId() {
  let id = localStorage.getItem('quiz_student_id');
  if (!id) { id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('quiz_student_id', id); }
  return id;
}
function fbReady(cb) {
  if (window.FB && window.FB.ready) { cb(); return; }
  window.addEventListener('fb-ready', cb, { once: true });
}
function getCachedProfile(uid) {
  try {
    const raw = localStorage.getItem('quiz_profile_' + uid);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return (p && p.uid === uid) ? p : null;
  } catch (e) { return null; }
}
function setCachedProfile(uid, profile) {
  try { localStorage.setItem('quiz_profile_' + uid, JSON.stringify({ ...profile, uid })); } catch (e) {}
}
function clearCachedProfile(uid) {
  try { if (uid) localStorage.removeItem('quiz_profile_' + uid); } catch (e) {}
}
function getInitial(email) { return (String(email || '?')[0] || '?').toUpperCase(); }
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    if (file.size / 1024 > MAX_IMG_SIZE_KB) { reject(new Error(`Файл больше ${MAX_IMG_SIZE_KB} КБ`)); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Ошибка чтения файла'));
    reader.readAsDataURL(file);
  });
}
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Ошибка чтения файла'));
    reader.readAsText(file, 'UTF-8');
  });
}

/* ============ АНТИЧИТ ============ */
function enableAntiCheat(studentRef, antiCheatMode) {
  antiCheatActive = true;
  antiCheatTabSwitches = 0;
  antiCheatCopyAttempts = 0;
  antiCheatRef = studentRef;
  syncState.antiCheatMode = antiCheatMode || 'soft';
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.addEventListener('copy', onCopyAttempt);
  document.addEventListener('cut', onCopyAttempt);
}
function disableAntiCheat() {
  antiCheatActive = false; antiCheatRef = null;
  document.removeEventListener('visibilitychange', onVisibilityChange);
  document.removeEventListener('copy', onCopyAttempt);
  document.removeEventListener('cut', onCopyAttempt);
}
function onVisibilityChange() {
  if (!antiCheatActive || !antiCheatRef) return;
  if (document.hidden) {
    antiCheatTabSwitches++;
    window.FB.update(antiCheatRef, { tabSwitches: antiCheatTabSwitches, lastTabSwitchAt: Date.now() }).catch(() => {});
    if (syncState.antiCheatMode === 'soft' && antiCheatTabSwitches >= 3) {
      // just warn visually via UI (we don't terminate in sync mode to avoid breaking the class)
    }
  }
}
function onCopyAttempt(e) {
  if (!antiCheatActive) return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim().length > 0) {
    e.preventDefault();
    antiCheatCopyAttempts++;
    if (antiCheatRef) window.FB.update(antiCheatRef, { copyAttempts: antiCheatCopyAttempts }).catch(() => {});
  }
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportStudentsWorkbook(results, testTitle, testId) {
  if (!results || results.length === 0) { alert('Нет результатов'); return; }
  const names = uniqueSheetNames(results.map(r => r.studentName));
  const sheetsXML = names.map(n => `<x:ExcelWorksheet><x:Name>${escapeXml(n)}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>`).join('');
  const tables = results.map(r => studentSheetHTML(r)).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheetsXML}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>${excelStyles()}</style></head><body>${tables}</body></html>`.trim();
  downloadBlob(html, `Тест_${testTitle.slice(0, 30).replace(/[^\wа-яА-ЯёЁ]/g, '_')}_${Date.now()}.xls`, 'application/vnd.ms-excel;charset=utf-8;');
}
function exportFlatSummary(results, title, filename) {

  const rows = results.sort((a,b) => b.timestamp - a.timestamp).map((r, i) => `<tr>
    <td class="c">${results.length - i}</td>
    <td>${escapeHtml(r.date)}</td><td>${escapeHtml(r.teacherEmail || '')}</td>
    <td>${escapeHtml(r.testTitle || '')}</td><td>${escapeHtml(r.studentName || '')}</td>

    <td class="c"><b>${r.score}</b></td>

<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Сводка</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->

function renderAuth(expectedRole) {
  clearAllUnsubs();
  fbReady(() => {
    const isDev = expectedRole === 'developer';
    document.body.className = isDev ? 'theme-developer' : 'theme-teacher';
    app.innerHTML = `<div class="auth-form" style="max-width:440px;margin:40px auto;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:0 20px 60px rgba(124,58,237,0.12);">
      <h1 style="text-align:center;">${isDev ? '🛠 Вход разработчика' : '👨‍🏫 Вход учителя'}</h1>
      <p class="hint" style="text-align:center;margin-bottom:24px;">${isDev ? 'Панель управления системой' : 'Кабинет для проведения тестов'}</p>
      <label class="label">Email</label>
      <input type="email" id="loginEmail" placeholder="you@school.ru" autocomplete="email">
      <label class="label">Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
      <p id="loginError" style="color:#ef4444;font-size:13px;font-weight:600;min-height:20px;margin:6px 0 10px;text-align:center;"></p>
      <button id="doLogin" class="green" style="width:100%;padding:14px;">Войти →</button>
      <p class="hint" style="text-align:center;margin-top:14px;"><a href="?mode=student" style="color:var(--violet);text-decoration:none;font-weight:600;">← Ко входу ученика</a></p>
    </div>`;
    document.getElementById('doLogin').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const err = document.getElementById('loginError');
      err.textContent = '';
      if (!email || !pass) { err.textContent = 'Заполните email и пароль'; return; }
      try {
        const cred = await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pass);
        let profile = getCachedProfile(cred.user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${cred.user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(cred.user.uid, profile);
        }
        if (!profile) { err.textContent = 'Профиль не найден'; await window.FB.signOut(window.FB.auth); return; }
        if (isDev && profile.role !== 'developer') { err.textContent = 'Это не аккаунт разработчика'; await window.FB.signOut(window.FB.auth); return; }
        if (!isDev && profile.role !== 'teacher') { err.textContent = 'Это не аккаунт учителя'; await window.FB.signOut(window.FB.auth); return; }
        currentUser = { uid: cred.user.uid, email: profile.email || email, role: profile.role };
        if (profile.role === 'developer') renderDeveloperHome();
        else renderTeacherHome();
      } catch (e) { err.textContent = interpretAuthError(e); }
    }
    function interpretAuthError(e) {
      const c = e && e.code;
      if (c === 'auth/invalid-email') return 'Некорректный email';
      if (c === 'auth/user-not-found') return 'Пользователь не найден';
      if (c === 'auth/wrong-password') return 'Неверный пароль';
      if (c === 'auth/invalid-credential') return 'Неверный email или пароль';
      if (c === 'auth/too-many-requests') return 'Слишком много попыток';
      if (c === 'auth/network-request-failed') return 'Нет соединения';
      return 'Ошибка: ' + (e.message || 'неизвестная');
    }
  });
}

async function loadHelpMessages(m, isDev) {
  const list = m.$('#helpList');
  if (!list) return;
  const ref = window.FB.ref(window.FB.db, 'help_messages');
  trackUnsub(window.FB.onValue(ref, (snap) => {
    const data = snap.val() || {};
    let list0 = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    if (!isDev) list0 = list0.filter(x => x.fromEmail === currentUser.email);
    list0.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    if (list0.length === 0) { list.innerHTML = `<p class="hint">${isDev ? 'Обращений пока нет.' : 'Вы ещё не писали разработчику.'}</p>`; return; }
    list.innerHTML = list0.map(msg => {
      const replies = msg.replies ? Object.values(msg.replies) : [];
      return `<div class="help-msg">
        <div class="hm-head"><span>${escapeHtml(msg.fromEmail || '?')} · ${formatDate(msg.timestamp || 0)}</span>
        ${isDev ? `<button class="small danger" data-del-help="${msg.id}" style="padding:2px 8px;font-size:11px;">🗑</button>` : ''}</div>
        <div class="hm-text">${escapeHtml(msg.text || '')}</div>
        ${replies.length ? `<div class="hm-replies">${replies.map(r => `<div class="help-reply ${r.from === 'developer' ? 'dev' : ''}">
          <div class="hr-head">${r.from === 'developer' ? '🛠 Разработчик' : '👨‍🏫 Учитель'} · ${formatDate(r.timestamp || 0)}</div>
          <div class="hr-text">${escapeHtml(r.text || '')}</div>
        </div>`).join('')}</div>` : ''}
        ${isDev ? `<textarea data-reply-input="${msg.id}" placeholder="Ответить..." style="min-height:50px;margin-top:8px;"></textarea>
          <button class="small green" data-reply-btn="${msg.id}">Ответить</button>` : ''}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-del-help]').forEach(b => b.onclick = async () => {
      if (!confirm('Удалить обращение?')) return;
      await window.FB.remove(window.FB.ref(window.FB.db, `help_messages/${b.dataset.delHelp}`));
    });
    list.querySelectorAll('[data-reply-btn]').forEach(b => b.onclick = async () => {
      const id = b.dataset.replyBtn;
      const ta = list.querySelector(`[data-reply-input="${id}"]`);
      const text = ta.value.trim();
      if (!text) { alert('Введите текст'); return; }
      const rid = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      await window.FB.update(window.FB.ref(window.FB.db, `help_messages/${id}/replies/${rid}`), { from: 'developer', text, timestamp: Date.now() });
      ta.value = '';
    });
  }));
}
async function sendHelpMsg(m) {
  const ta = m.$('#helpNewText');
  const text = ta.value.trim();
  if (!text) { alert('Введите текст'); return; }
  const id = genId('h');
  try {
    await window.FB.set(window.FB.ref(window.FB.db, `help_messages/${id}`), { from: 'teacher', fromEmail: currentUser.email, text, timestamp: Date.now() });
    ta.value = '';
    alert('✅ Сообщение отправлено');
  } catch (e) { alert('Ошибка: ' + e.message); }
}

// Кэш для учителей и результатов (для статистики)
let teachersUsersCache = {};
let teachersStatsCache = { sessions: {}, results: {} };

async function loadTeachersData() {
  try {
    const [usersSnap, sessionsSnap, resultsSnap] = await Promise.all([
      window.FB.get(window.FB.ref(window.FB.db, 'users')),
      window.FB.get(window.FB.ref(window.FB.db, 'sessions')),
      window.FB.get(window.FB.ref(window.FB.db, 'results'))
    ]);

    teachersStatsCache.sessions = sessionsSnap.val() || {};
    teachersStatsCache.results = resultsSnap.val() || {};
  } catch (e) {
    console.error('loadTeachersData:', e);
    teachersUsersCache = {};
    teachersStatsCache = { sessions: {}, results: {} };
  }
}

async function renderTeachersList() {
  const el = document.getElementById('teachersArea');
  if (!el) return;
  el.innerHTML = `<p class="hint"><span class="loading-spinner"></span>Загрузка статистики…</p>`;

  await loadTeachersData();

  const users = teachersUsersCache;
  const teachers = Object.entries(users)
    .filter(([_, u]) => u && u.role === 'teacher')
    .map(([uid, u]) => ({ uid, ...u }));

  if (teachers.length === 0) {
    el.innerHTML = `<p class="hint">Учителей пока нет. Нажмите «Создать учителя».</p>`;
    return;
  }

  // Считаем статистику по каждому учителю
  const sessions = teachersStatsCache.sessions || {};
  const results = teachersStatsCache.results || {};

  const stats = {};
  teachers.forEach(t => {
    stats[t.uid] = {
      sessionsTotal: 0,
      sessionsActive: 0,
      studentsTotal: 0,
      resultsTotal: 0,
      avgScore: 0,
      lastActivityAt: 0
    };
  });

  // Сессии
  Object.values(sessions).forEach(s => {
    if (!s || !s.teacherId) return;
    if (!stats[s.teacherId]) return;
    stats[s.teacherId].sessionsTotal++;
    if (s.status === 'active') stats[s.teacherId].sessionsActive++;
    const studentCount = Object.keys(s.students || {}).length;
    stats[s.teacherId].studentsTotal += studentCount;
    if (s.createdAt && s.createdAt > stats[s.teacherId].lastActivityAt) {
      stats[s.teacherId].lastActivityAt = s.createdAt;
    }
  });

  // Результаты
  Object.values(results).forEach(r => {
    if (!r || !r.teacherId) return;
    if (!stats[r.teacherId]) return;
    stats[r.teacherId].resultsTotal++;
    stats[r.teacherId]._sumScore = (stats[r.teacherId]._sumScore || 0) + (r.score || 0);
    if (r.timestamp && r.timestamp > stats[r.teacherId].lastActivityAt) {
      stats[r.teacherId].lastActivityAt = r.timestamp;
    }
  });

  // Средний балл
  Object.keys(stats).forEach(uid => {
    const st = stats[uid];
    st.avgScore = st.resultsTotal > 0 ? Math.round((st._sumScore || 0) / st.resultsTotal) : 0;
    delete st._sumScore;
  });

  // Сортируем: сначала активные, потом по email
  teachers.sort((a, b) => {
    const aAct = stats[a.uid].lastActivityAt || 0;
    const bAct = stats[b.uid].lastActivityAt || 0;
    return bAct - aAct;
  });

  el.innerHTML = `
    <div class="students-grid" style="grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));">
      ${teachers.map(t => {
        const st = stats[t.uid];
        const initials = (String(t.email || '?')[0] || '?').toUpperCase();
        const lastAct = st.lastActivityAt ? formatDate(st.lastActivityAt) : '—';
        return `
          <div class="student-card" style="padding:16px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
              <div style="width:44px;height:44px;border-radius:50%;
                background:linear-gradient(135deg,#7c3aed,#a855f7);
                display:flex;align-items:center;justify-content:center;
                color:#fff;font-weight:900;font-size:18px;flex-shrink:0;">${initials}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:800;color:var(--ink);font-size:14px;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                  title="${escapeHtml(t.email || '')}">${escapeHtml(t.email || '—')}</div>
                <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;">
                  ${t.role === 'teacher' ? '👨‍🏫 Учитель' : escapeHtml(t.role || '')}
                  ${t.createdAt ? ' · с ' + formatDateShort(t.createdAt) : ''}
                </div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--violet);line-height:1;">${st.sessionsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;">Сессий</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--green);line-height:1;">${st.resultsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;">Прохождений</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--blue);line-height:1;">${st.studentsTotal}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;">Учеников</div>
              </div>
              <div style="background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;">
                <div style="font-size:20px;font-weight:900;color:var(--yellow);line-height:1;">${st.avgScore}</div>
                <div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;">Ср. балл</div>
              </div>
            </div>

            ${st.sessionsActive > 0
              ? `<div style="font-size:11px;font-weight:800;color:#10b981;margin-bottom:6px;">● ${st.sessionsActive} активных сессий</div>`
              : ''}

            <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:10px;">
              Последняя активность: ${lastAct}
            </div>

            <div style="display:flex;gap:6px;">
              <button class="small back" data-teacher-view="${t.uid}" style="flex:1;">📊 Детали</button>
              <button class="small danger" data-teacher-del="${t.uid}" title="Удалить из базы">🗑</button>
            </div>
          </div>`;
      }).join('')}
    </div>`;

  el.querySelectorAll('[data-teacher-view]').forEach(b => {
    b.onclick = () => showTeacherDetails(b.dataset.teacherView);
  });
  el.querySelectorAll('[data-teacher-del]').forEach(b => {
    b.onclick = async () => {
      const uid = b.dataset.teacherDel;
      const t = teachers.find(x => x.uid === uid);
      if (!confirm(`Удалить профиль учителя «${t.email}»?\n\n⚠️ Аккаунт в Firebase Auth останется, но перестанет пускать в кабинет.`)) return;
      await window.FB.remove(window.FB.ref(window.FB.db, `users/${uid}`));
      renderTeachersList();
      renderDeveloperMetrics();
    };
  });
}

function showTeacherDetails(uid) {
  const t = teachersUsersCache[uid];
  if (!t) { alert('Учитель не найден'); return; }

  const sessions = Object.values(teachersStatsCache.sessions || {}).filter(s => s && s.teacherId === uid);
  const results = Object.values(teachersStatsCache.results || {}).filter(r => r && r.teacherId === uid);

  const sessionsRows = sessions
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
    .slice(0, 20)
    .map(s => `<tr>
      <td>${escapeHtml(formatDate(s.createdAt || 0))}</td>
      <td style="font-family:monospace;font-size:12px;">${escapeHtml(Object.entries(teachersStatsCache.sessions).find(([k, v]) => v === s)?.[0] || '—')}</td>
      <td>${escapeHtml((s.testTitle || '').slice(0, 40))}</td>

function openCreateTeacherModal() {
  const m = openModal(`<div class="modal-body">
    <h2 style="margin:0 0 8px;">➕ Новый учитель</h2>
    <p class="hint" style="margin-bottom:18px;">Аккаунт создастся в Firebase Auth. Пароль можно передать учителю лично — он потом сменит.</p>

    <label class="label">Email</label>
    <input type="email" id="newTeacherEmail" placeholder="teacher@school.ru" autocomplete="off">

    <label class="label">Пароль (минимум 6 символов)</label>
    <input type="text" id="newTeacherPass" placeholder="Временный пароль" autocomplete="off">

    <label class="label">Имя (необязательно)</label>
    <input type="text" id="newTeacherName" placeholder="Иван Петрович" autocomplete="off">

    <p id="newTeacherError" style="color:#ef4444;font-size:13px;font-weight:700;min-height:18px;margin:6px 0;"></p>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="saveTeacher" class="green" style="flex:1;">💾 Создать аккаунт</button>
      <button class="back" id="closeTeacher">Отмена</button>
    </div>

    <div class="anti-cheat-note" style="margin-top:14px;">
      ⚠️ После создания учитель сможет войти на странице <code>?mode=teacher</code> со своим email и паролем.
    </div>
  </div>`, 560);

  m.$('#closeTeacher').onclick = () => m.close();

  m.$('#saveTeacher').onclick = async () => {
    const email = m.$('#newTeacherEmail').value.trim();
    const pass = m.$('#newTeacherPass').value;
    const name = m.$('#newTeacherName').value.trim();
    const err = m.$('#newTeacherError');
    err.textContent = '';

    if (!email) { err.textContent = 'Укажите email'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Некорректный email'; return; }
    if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }

    const btn = m.$('#saveTeacher');
    btn.disabled = true;
    btn.textContent = 'Создаём…';

    try {
      // Создаём пользователя в Firebase Auth
      const cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pass);
      const uid = cred.user.uid;

      // Создаём профиль в БД
      await window.FB.set(window.FB.ref(window.FB.db, `users/${uid}`), {
        email,
        role: 'teacher',
        name: name || '',
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.uid : null
      });

      // Не разлогиниваем текущего разработчика!
      // Firebase при createUserWithEmailAndPassword подменяет currentUser —
      // поэтому сразу возвращаемся на dev-аккаунт нельзя, но при следующем
      // открытии страницы разработчик войдёт заново. В рамках сессии ок.

      m.close();
      alert(`✅ Учитель создан!\n\nEmail: ${email}\nПароль: ${pass}\n\nПередайте их учителю.`);

      // Обновляем список
      renderTeachersList();
      renderDeveloperMetrics();
    } catch (e) {
      const c = e && e.code;
      if (c === 'auth/email-already-in-use') err.textContent = 'Этот email уже используется';
      else if (c === 'auth/invalid-email') err.textContent = 'Некорректный email';
      else if (c === 'auth/weak-password') err.textContent = 'Слишком слабый пароль';
      else err.textContent = 'Ошибка: ' + (e.message || 'неизвестная');

      btn.disabled = false;
      btn.textContent = '💾 Создать аккаунт';
    }
  };
}

function parseCSVQuestions(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const result = [];
  for (const line of lines) {
    let parts = line.split(';');
    if (parts.length < 5) parts = line.split(',');
    if (parts.length < 5) parts = line.split('\t');
    if (parts.length < 5) continue;
    const q = parts[0].trim().replace(/^"|"$/g, '');
    if (!q) continue;
    const options = [parts[1], parts[2], parts[3], parts[4]].map(x => (x || '').trim().replace(/^"|"$/g, ''));
    if (options.some(o => !o)) continue;
    let correct = parseInt((parts[5] || '1').trim(), 10);
    if (isNaN(correct) || correct < 1 || correct > 4) correct = 1;
    correct = correct - 1;
    const image = (parts[6] || '').trim().replace(/^"|"$/g, '');
    const timeRaw = (parts[7] || '').trim();
    const time = timeRaw ? Math.max(5, Math.min(300, parseInt(timeRaw, 10) || 20)) : null;
    result.push({ q, options, correct, image, time });
  }
  return result;
}

function subscribeAllSessions() {
  const el = document.getElementById('allSessionsArea');
  if (!el) return;
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, 'sessions'), (snapshot) => {
    const data = snapshot.val() || {};
    const list = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    if (list.length === 0) { el.innerHTML = `<p class="hint">Пока нет сессий.</p>`; return; }
    el.innerHTML = list.map(([code, s]) => sessionRowHTML(code, s, s.teacherEmail || '')).join('');
    bindSessionActions(el);
  }));
}
function sessionRowHTML(code, s, teacherLabel) {
  const students = Object.keys(s.students || {}).length;
  const done = Object.values(s.students || {}).filter(x => x.status === 'finished').length;
  const isActive = s.status === 'active';
  const phaseBadge = s.phase ? `<span class="badge" style="background:#dbeafe;color:#1d4ed8;">${s.phase}</span>` : '';
  return `<div class="session-row">
    <div class="dot ${isActive ? '' : 'closed'}"></div>
    <div class="date">${formatDateShort(s.createdAt || Date.now())}</div>
    <div class="time">${formatTimeShort(s.createdAt || Date.now())}</div>
    <div class="code">${code}</div>
    <div class="title">${escapeHtml((s.testTitle || '').slice(0, 50))}${teacherLabel ? ` · ${escapeHtml(teacherLabel)}` : ''} ${phaseBadge}</div>
    <div class="stats">👥 ${students}/${MAX_STUDENTS} · ✅ ${done}</div>
    <div class="actions">
      <button class="btn-start-session" data-open-session="${code}">▶ Открыть</button>
      <button class="icon-btn link" data-copy-session="${code}" title="Скопировать ссылку">🔗</button>
      ${isActive
        ? `<button class="icon-btn lock" data-close-session="${code}" title="Закрыть">🔒</button>`
        : `<button class="icon-btn unlock" data-open-toggle="${code}" title="Открыть">🔓</button>`}
      <button class="icon-btn del" data-del-session="${code}" title="Удалить">🗑</button>
    </div>
  </div>`;
}
function bindSessionActions(el) {
  el.querySelectorAll('[data-open-session]').forEach(b => b.onclick = () => {
    const code = b.dataset.openSession;
    if (currentUser.role === 'developer') location.href = `?mode=developer&session=${code}`;
    else location.href = `?mode=teacher&session=${code}`;
  });
  el.querySelectorAll('[data-copy-session]').forEach(b => b.onclick = () => {
    const code = b.dataset.copySession;
    navigator.clipboard.writeText(`${location.origin}${location.pathname}?mode=student&session=${code}`).then(() => {
      b.textContent = '✓';
      setTimeout(() => b.textContent = '🔗', 1200);
    });
  });
  el.querySelectorAll('[data-close-session]').forEach(b => b.onclick = async () => {
    const code = b.dataset.closeSession;
    if (!confirm(`Закрыть сессию ${code}?`)) return;
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { status: 'closed', closedAt: Date.now() });
  });
  el.querySelectorAll('[data-open-toggle]').forEach(b => b.onclick = async () => {
    const code = b.dataset.openToggle;
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}`), { status: 'active', reopenedAt: Date.now() });
  });
  el.querySelectorAll('[data-del-session]').forEach(b => b.onclick = async () => {
    const code = b.dataset.delSession;
    if (!confirm(`Удалить сессию ${code}?`)) return;
    await window.FB.remove(window.FB.ref(window.FB.db, `sessions/${code}`));
  });
}

async function clearAllResults() {
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'results'));
  const count = Object.keys(snap.val() || {}).length;
  if (count === 0) { alert('Результатов нет.'); return; }
  if (!confirm(`Удалить ВСЕ результаты (${count} шт.)?`)) return;
  await window.FB.remove(window.FB.ref(window.FB.db, 'results'));
  alert(`✅ Удалено ${count}.`);
}
async function clearOldResults() {
  if (!confirm('Удалить результаты старше 30 дней?')) return;
  const snap = await window.FB.get(window.FB.ref(window.FB.db, 'results'));
  const data = snap.val() || {};
  const now = Date.now();
  const toDelete = Object.entries(data).filter(([_, r]) => now - (r.timestamp || 0) > OLD_RESULTS_TTL_MS);
  if (toDelete.length === 0) { alert('Нет старых результатов.'); return; }
  for (const [id] of toDelete) await window.FB.remove(window.FB.ref(window.FB.db, `results/${id}`));
  alert(`Удалено ${toDelete.length}.`);
}
async function cleanupOldSessions() {
  if (!currentUser) return;
  try {
    const snap = await window.FB.get(window.FB.ref(window.FB.db, 'sessions'));
    const all = snap.val() || {};
    const now = Date.now();
    const del = [];
    for (const [code, s] of Object.entries(all)) {
      if (!s || !s.createdAt) continue;
      if (s.teacherId !== currentUser.uid && currentUser.role !== 'developer') continue;
      if (now - s.createdAt > SESSION_TTL_MS) del.push(code);
    }
    for (const code of del) await window.FB.remove(window.FB.ref(window.FB.db, `sessions/${code}`));
  } catch (e) {}
}

async function createSession() {
  const testId = document.getElementById('newSessionTest').value;
  if (!testId) { alert('Нет доступных тестов.'); return; }
  const test = testsCache[testId];
  const classId = document.getElementById('newSessionClass').value || null;
  const cls = classId ? classesCache[classId] : null;
  const autoAdvance = document.getElementById('newSessionAuto').value === 'auto';
  const code = genSessionCode();
  try {
    const payload = {
      testId, testTitle: test.title, teacherId: currentUser.uid, teacherEmail: currentUser.email,
      createdAt: Date.now(), status: 'active', mode: 'sync',
      phase: 'lobby',              // lobby | question | results | leaderboard | finished
      currentQuestion: -1,
      questionStartedAt: 0,
      autoAdvance,
      autoAdvanceDelaySec: 5,
      testQuestionCount: (test.questions || []).length
    };
    if (classId) { payload.classId = classId; payload.className = cls?.name || ''; }
    await window.FB.set(window.FB.ref(window.FB.db, `sessions/${code}`), payload);
    location.href = `?mode=teacher&session=${code}`;
  } catch (e) { alert('Не удалось создать: ' + e.message); }
}

function subscribeTeacherSessions() {
  const el = document.getElementById('sessionsList');
  if (!el) return;
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, 'sessions'), (snapshot) => {
    const data = snapshot.val() || {};
    const mine = Object.entries(data).filter(([_, s]) => s && s.teacherId === currentUser.uid).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    if (mine.length === 0) { el.innerHTML = `<p class="hint">Пока нет сессий.</p>`; return; }
    el.innerHTML = mine.map(([code, s]) => sessionRowHTML(code, s, '')).join('');
    bindSessionActions(el);
  }));
}

function subscribeTeacherSessionLive(code, test) {

    if (!s) return;

    renderTeacherStudentsList(s, test);
  }));
}

function renderTeacherSyncPanel(s, test, code) {
  const phase = s.phase || 'lobby';
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  const phaseText = document.getElementById('phaseText');
  if (phaseText) {
    phaseText.className = 'stp-phase ' + phase;
    phaseText.textContent = {
      lobby: '🏠 Лобби',
      question: `❓ Вопрос ${idx + 1} / ${test.questions.length}`,
      results: '📊 Результаты',
      leaderboard: '🏆 Лидерборд',
      finished: '🏁 Завершено'
    }[phase] || phase;
  }

  const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v }));
  const totalStudents = studentsArr.length;
  const answeredThisQ = studentsArr.filter(st => st.answers && st.answers[idx]).length;

  const content = document.getElementById('phaseContent');
  if (!content) return;

  let html = '';

  if (phase === 'lobby') {
    html = `
      <div style="text-align:center;padding:24px 0;">
        <div style="font-size:64px;margin-bottom:12px;">🎯</div>
        <h2 style="margin:0 0 8px;font-size:22px;">Ученики подключаются</h2>
        <p style="color:#64748b;font-weight:600;margin:0 0 20px;">Когда все будут готовы — нажмите «Начать тест»</p>
        <button class="huge green" id="startBtn" ${totalStudents === 0 ? 'disabled' : ''}>🚀 Начать тест</button>
        ${totalStudents === 0 ? '<p style="color:#94a3b8;font-size:13px;margin-top:12px;font-weight:600;">Ждём хотя бы одного ученика…</p>' : ''}
      </div>`;
    content.innerHTML = html;
    const btn = document.getElementById('startBtn');
    if (btn) btn.onclick = () => startQuestion(code, 0, test);
    return;
  }

  if (phase === 'question') {
    const q = test.questions[idx];
    const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;
    const elapsed = s.questionStartedAt ? Math.floor((Date.now() - s.questionStartedAt) / 1000) : 0;
    const remaining = Math.max(0, timeTotal - elapsed);
    html = `
      <div class="sync-progress">
        <div class="sp-item"><div class="sp-n">${totalStudents}</div><div class="sp-l">Учеников</div></div>
        <div class="sp-item"><div class="sp-n" style="color:#10b981;">${answeredThisQ}</div><div class="sp-l">Ответили</div></div>
        <div class="sp-item"><div class="sp-n" style="color:#f59e0b;">${remaining}</div><div class="sp-l">Секунд</div></div>
      </div>
      <div class="sync-question-big">
        ${q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}" alt=""></div>` : ''}
        <div class="sq-text">${escapeHtml(q.q)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:0 auto;text-align:left;">
          ${q.options.map((opt, oi) => `<div style="padding:10px 14px;background:${['#fef2f2','#eff6ff','#fef3c7','#f0fdf4'][oi]};border-radius:10px;font-weight:700;font-size:14px;">
            <span style="display:inline-block;width:24px;height:24px;text-align:center;line-height:24px;border-radius:50%;background:rgba(0,0,0,0.08);margin-right:8px;font-size:12px;">${FIGURES[oi]}</span>
            ${escapeHtml(opt)}
          </div>`).join('')}
        </div>
      </div>
      <div class="sync-controls">
        <button class="primary" id="revealBtn">📊 Показать ответы (${answeredThisQ}/${totalStudents})</button>
      </div>`;
    content.innerHTML = html;
    const btn = document.getElementById('revealBtn');
    if (btn) btn.onclick = () => revealQuestion(code, idx, test);
    return;
  }

  if (phase === 'results') {
    const q = test.questions[idx];
    const stats = [0, 1, 2, 3].map(i => studentsArr.filter(st => st.answers && st.answers[idx] && st.answers[idx].selected === i).length);
    const total = stats.reduce((a, b) => a + b, 0);
    html = `
      <div style="text-align:center;">
        <div style="font-size:13px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;">Результаты вопроса ${idx + 1}</div>
        <div style="font-size:22px;font-weight:900;margin:8px 0 16px;">${escapeHtml(q.q)}</div>
        <div class="sync-answer-dist">
          ${q.options.map((opt, oi) => {
            const isCorrect = oi === q.correct;
            const pct = total > 0 ? Math.round(stats[oi] / total * 100) : 0;
            return `<div class="sad-item ${isCorrect ? 'correct' : ''}">
              <div class="sad-fig">${FIGURES[oi]}</div>
              <div class="sad-count">${stats[oi]}</div>
              <div class="sad-opt">${escapeHtml(opt.slice(0, 30))}</div>
              <div class="sad-bar" style="width:${pct}%;margin-left:auto;margin-right:auto;"></div>
            </div>`;
          }).join('')}
        </div>
        <div class="sync-controls">
          ${idx + 1 < test.questions.length
            ? `<button class="primary" id="nextBtn">➡ Следующий вопрос (${idx + 2}/${test.questions.length})</button>`
            : `<button class="primary" id="finishBtn">🏁 Показать финальный лидерборд</button>`}
          <button class="secondary" id="leaderboardBtn">🏆 Показать лидерборд</button>
        </div>
      </div>`;
    content.innerHTML = html;
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.onclick = () => startQuestion(code, idx + 1, test);
    const finishBtn = document.getElementById('finishBtn');
    if (finishBtn) finishBtn.onclick = () => showLeaderboard(code);
    const lbBtn = document.getElementById('leaderboardBtn');
    if (lbBtn) lbBtn.onclick = () => showLeaderboard(code);
    return;
  }

  if (phase === 'leaderboard') {
    const ranked = studentsArr.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    html = `
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:900;margin-bottom:16px;">🏆 Лидерборд</div>
        <div class="lb-list" style="background:#f8fafc;color:var(--ink);">
          ${ranked.slice(0, 10).map((st, i) => {
            const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
            return `<div class="lb-item" style="background:#fff;color:var(--ink);">
              <div class="lb-rank ${medal}">${i + 1}</div>
              <div class="lb-name">${escapeHtml(st.studentName || '—')}</div>
              <div class="lb-score">${st.score || 0}</div>
            </div>`;
          }).join('') || '<p class="hint">Нет данных</p>'}
        </div>
        <div class="sync-controls">
          ${idx + 1 < test.questions.length
            ? `<button class="primary" id="nextBtn">➡ К вопросу ${idx + 2}</button>`
            : `<button class="primary" id="finishBtn">🏁 Завершить тест</button>`}
        </div>
      </div>`;
    content.innerHTML = html;
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.onclick = () => startQuestion(code, idx + 1, test);
    const finishBtn = document.getElementById('finishBtn');
    if (finishBtn) finishBtn.onclick = () => finishSession(code);
    return;
  }

  if (phase === 'finished') {
    html = `
      <div style="text-align:center;padding:24px 0;">
        <div style="font-size:64px;">🏁</div>
        <h2 style="margin:8px 0;">Тест завершён!</h2>
        <p style="color:#64748b;font-weight:600;">Все результаты сохранены в базе</p>
        <button class="download" id="expBtn" style="margin-top:14px;">📥 Скачать Excel</button>
      </div>`;
    content.innerHTML = html;
    const exp = document.getElementById('expBtn');
    if (exp) exp.onclick = () => document.getElementById('exportSessionBtn').click();
    return;
  }
}

function renderTeacherStudentsList(s, test) {
  const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  const elTotal = document.getElementById('cntTotal');
  if (elTotal) elTotal.textContent = studentsArr.length;
  const area = document.getElementById('studentsArea');
  if (!area) return;
  if (studentsArr.length === 0) {
    area.innerHTML = `<p class="hint">Ожидание учеников… Код <b>${sessionCode}</b>.</p>`;
    return;
  }
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  area.innerHTML = studentsArr.map(st => {
    const hasAnswered = st.answers && st.answers[idx];
    const cls = hasAnswered ? 'answered' : '';
    let status = 'В игре';
    if (hasAnswered) status = '✅ Ответил';
    if (st.status === 'finished') status = `Завершил — ${st.score || 0} б.`;
    return `<div class="student-card ${cls}">
      <div class="name">${escapeHtml(st.studentName || '—')}</div>
      <div class="status">${escapeHtml(status)}</div>
      <div class="progress">Всего: ${st.correctCount || 0} верно · ${st.score || 0} б.</div>
    </div>`;
  }).join('');
}

}

  } catch (e) { alert('Ошибка: ' + e.message); }
}

/* ==================================================================
   УЧЕНИК: ВВОД КОДА
   ================================================================== */
function renderStudentEnterCode() {
  clearAllUnsubs();
  document.body.className = 'theme-student-entry';
  document.body.style.padding = '0';
  app.innerHTML = `
    <div class="join-screen">
      <div class="yellow-shape"></div>
      <div class="join-card">
        <h1 class="join-title">Добро пожаловать!</h1>
        <p class="join-sub">Введите код для участия в тесте</p>
        <div id="joinErrorBox"></div>
        <input type="text" id="sessionInput" class="join-input" placeholder="КВИЗ КОД" inputmode="numeric" maxlength="6" autocomplete="off">
        <button id="go" class="join-btn">Подключиться</button>
        <div class="join-links">
          <a href="?mode=teacher">Учитель</a>
          <a href="?mode=developer">Разработчик</a>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('sessionInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('go').click(); } });
  document.getElementById('go').onclick = async () => {
    const code = input.value.trim();
    const errBox = document.getElementById('joinErrorBox');
    errBox.innerHTML = '';
    if (!/^\d{6}$/.test(code)) { errBox.innerHTML = `<div class="join-error">Код должен состоять из 6 цифр</div>`; return; }
    try {
      const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
      const s = snap.val();
      if (!s) { errBox.innerHTML = `<div class="join-error">Сессия «${code}» не найдена</div>`; return; }
      if (s.status === 'closed') { errBox.innerHTML = `<div class="join-error">Эта сессия уже закрыта</div>`; return; }
      if (Object.keys(s.students || {}).length >= MAX_STUDENTS) { errBox.innerHTML = `<div class="join-error">В сессии уже ${MAX_STUDENTS} учеников</div>`; return; }
      location.search = `?mode=student&session=${code}`;
    } catch (e) { errBox.innerHTML = `<div class="join-error">Ошибка: ${escapeHtml(e.message)}</div>`; }
  };
}

/* ==================================================================
   УЧЕНИК: СИНХРОННАЯ СЕССИЯ
   ================================================================== */
async function renderStudentSession() {
  clearAllUnsubs();
  document.body.className = 'theme-student';
  document.body.style.padding = '';
  fbReady(async () => {
    const code = sessionCode;
    const snap = await window.FB.get(window.FB.ref(window.FB.db, `sessions/${code}`));
    const s = snap.val();
    if (!s) { app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero"><h1 class="student-title">⚠️ Сессия не найдена</h1><a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a></div></div>`; return; }
    if (s.status === 'closed') { app.innerHTML = `<div class="student-wrap" style="margin-top:30px;"><div class="student-card-hero"><h1 class="student-title">⚠️ Сессия закрыта</h1><a href="?mode=student"><button class="btn-start">← Ввести другой код</button></a></div></div>`; return; }
    const myId = getStudentLocalId();
    const myRecord = (s.students || {})[myId];
    if (myRecord) {
      // Уже подключался — продолжаем
      syncState = {
        code, studentId: myId, studentName: myRecord.studentName,
        test: null, // подгрузим ниже
        answersByQ: myRecord.answers || {},
        score: myRecord.score || 0,
        correctCount: myRecord.correctCount || 0,
        maxStreak: myRecord.maxStreak || 0
      };
    }
    const testSnap = await window.FB.get(window.FB.ref(window.FB.db, `tests/${s.testId}`));
    const test = testSnap.val();
    if (!test) { app.innerHTML = `<h1>⚠️ Тест не найден</h1>`; return; }
    syncState.test = test;
    syncState.testId = s.testId;
    syncState.teacherEmail = s.teacherEmail;
    syncState.answersByQ = syncState.answersByQ || {};

    if (myRecord) {
      // Восстанавливаем сессию
      enableAntiCheat(window.FB.ref(window.FB.db, `sessions/${code}/students/${myId}`), 'soft');
      subscribeStudentSession(code);
      return;
    }

    // Экран регистрации
    const classInfo = s.classId ? `<p class="student-sub" style="color:#7c3aed;">Класс: <b>${escapeHtml(s.className || '')}</b></p>` : '';
    app.innerHTML = `
      <div class="student-wrap" style="margin-top:20px;">
        <div class="student-card-hero">
          <h1 class="student-title">${escapeHtml(test.title)}</h1>
          <p class="student-sub">Код сессии: <b style="color:#10b981;">${code}</b></p>
          ${classInfo}
          <div style="text-align:center;margin-bottom:14px;">
            <span class="game-badge live">🎮 Синхронный режим</span>
          </div>
          <label>Имя</label>
          <input type="text" id="firstName" placeholder="Иван" autocomplete="off" maxlength="${MAX_NAME_LEN}">
          <label>Фамилия</label>
          <input type="text" id="lastName" placeholder="Иванов" autocomplete="off" maxlength="${MAX_NAME_LEN}">
          <p id="nameError" style="color:#ef4444;font-weight:700;display:none;margin:6px 0;"></p>
          <button id="start" class="btn-start">Войти в игру 🎮</button>
          <div class="student-facts">
            <div class="student-fact">📚 ${test.questions.length} вопросов</div>
            <div class="student-fact">⏱ ${test.timePerQuestion || TIME_PER_QUESTION} сек</div>
            <div class="student-fact">👥 Все отвечают одновременно</div>
          </div>
        </div>
      </div>`;
    ['firstName', 'lastName'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        const cleaned = el.value.replace(/[^А-Яа-яЁёA-Za-z\-\s]/g, '').slice(0, MAX_NAME_LEN);
        if (cleaned !== el.value) el.value = cleaned;
        el.classList.remove('invalid');
        validateNames(false);
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('start').click(); } });
    });
    document.getElementById('start').onclick = () => joinSyncSession(code, test, s);
  });
}

function validateNames(showError) {
  const firstEl = document.getElementById('firstName');
  const lastEl = document.getElementById('lastName');
  const err = document.getElementById('nameError');
  const first = firstEl.value.trim(), last = lastEl.value.trim();
  let message = '';
  if (!first || !last) message = 'Заполните имя и фамилию';
  else if (first.length > MAX_NAME_LEN || last.length > MAX_NAME_LEN) message = `Не более ${MAX_NAME_LEN} символов`;
  else if (!isValidName(first) || !isValidName(last)) message = 'Только буквы, дефис и пробел';
  if (message) {
    if (showError) {
      err.textContent = message; err.style.display = 'block';
    }
    return null;
  }
  err.style.display = 'none';
  return { first, last };
}

async function joinSyncSession(code, test, sessionData) {
  const names = validateNames(true);
  if (!names) return;
  const studentName = `${names.last} ${names.first}`;
  if (sessionData.classId) {
    const clsSnap = await window.FB.get(window.FB.ref(window.FB.db, `classes/${sessionData.classId}`));
    const cls = clsSnap.val();
    if (cls && Array.isArray(cls.students) && cls.students.length > 0) {
      const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
      const inClass = cls.students.some(s => norm(s) === norm(studentName));
      if (!inClass) { alert(`«${studentName}» не найден в классе «${cls.name}».`); return; }
    }
  }
  const studentId = getStudentLocalId();
  const existing = Object.values(sessionData.students || {});
  if (existing.some(x => x.studentName === studentName)) { alert(`«${studentName}» уже участвует.`); return; }
  if (existing.length >= MAX_STUDENTS) { alert(`Уже ${MAX_STUDENTS} учеников.`); return; }

  const studentRef = window.FB.ref(window.FB.db, `sessions/${code}/students/${studentId}`);
  try {
    await window.FB.set(studentRef, {
      studentName, joinedAt: Date.now(), online: true,
      score: 0, correctCount: 0, maxStreak: 0,
      tabSwitches: 0, copyAttempts: 0,
      answers: {}
    });
    syncState = {
      code, studentId, studentName, test, testId: sessionData.testId,
      teacherEmail: sessionData.teacherEmail,
      answersByQ: {}, score: 0, correctCount: 0, maxStreak: 0, currentStreak: 0
    };
    enableAntiCheat(studentRef, 'soft');
    subscribeStudentSession(code);
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function subscribeStudentSession(code) {
  trackUnsub(window.FB.onValue(window.FB.ref(window.FB.db, `sessions/${code}`), (snap) => {
    const s = snap.val();
    if (!s) return;
    // Обновляем локальное состояние
    const myRec = (s.students || {})[syncState.studentId];
    if (!myRec) { location.href = '?mode=student'; return; }
    syncState.answersByQ = myRec.answers || {};
    syncState.score = myRec.score || 0;
    syncState.correctCount = myRec.correctCount || 0;
    renderStudentSyncView(s);
  }));
}

function renderStudentSyncView(s) {
  const test = syncState.test;
  if (!test) return;
  const phase = s.phase || 'lobby';
  const idx = typeof s.currentQuestion === 'number' ? s.currentQuestion : -1;
  const myAnswer = syncState.answersByQ[idx];

  const root = document.getElementById('app');
  // Если ещё нет student-wrap — создаём структуру
  if (!document.querySelector('.sync-student-screen')) {
    root.innerHTML = `<div class="sync-student-screen" id="sss"></div>`;
  }
  const sss = document.getElementById('sss');

  // Топбар с именем и баллом
  const topbar = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;
      background:rgba(255,255,255,0.15);padding:12px 18px;border-radius:14px;margin-bottom:14px;color:#fff;font-weight:700;">
      <span>👤 ${escapeHtml(syncState.studentName)}</span>
      <span>⭐ ${syncState.score} баллов</span>
    </div>`;

  if (phase === 'lobby') {
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:64px;margin-bottom:12px;animation:pulse 2s infinite;">⏳</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Ожидаем учителя</h2>
        <p style="color:var(--muted);font-weight:600;">Тест начнётся, как только учитель запустит первый вопрос</p>
        <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'question') {
    const q = test.questions[idx];
    if (!q) { sss.innerHTML = topbar + `<div class="sss-hero"><p>Загрузка вопроса…</p></div>`; return; }
    const timeTotal = q.time || test.timePerQuestion || TIME_PER_QUESTION;
    const elapsed = s.questionStartedAt ? (Date.now() - s.questionStartedAt) / 1000 : 0;
    const remaining = Math.max(0, Math.floor(timeTotal - elapsed));
    const circumference = 2 * Math.PI * 32;
    const offset = circumference * (1 - remaining / timeTotal);
    const warning = remaining <= 5;

    if (myAnswer) {
      // Уже ответил — показываем экран ожидания
      sss.innerHTML = topbar + `
        <div class="sss-hero">
          <div style="font-size:64px;margin-bottom:8px;">✅</div>
          <h2 style="color:var(--violet);margin:0 0 8px;">Ответ принят!</h2>
          <p style="color:var(--muted);font-weight:600;">${myAnswer.correct ? '🎉 Верно! +' + myAnswer.points + ' баллов' : '😔 Увы, неверно'}</p>
          <div class="waiting-dots" style="margin-top:18px;"><span></span><span></span><span></span></div>
          <p style="color:#94a3b8;font-size:13px;font-weight:600;margin-top:16px;">Ожидайте остальных…</p>
        </div>`;
      return;
    }

    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div class="timer-circle ${warning ? 'warning' : ''}">
          <svg viewBox="0 0 76 76">
            <circle class="t-bg" cx="38" cy="38" r="32"></circle>
            <circle class="t-fg" cx="38" cy="38" r="32"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="t-num" id="syncTimer">${remaining}</div>
        </div>
        <div style="font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;">
          Вопрос ${idx + 1} из ${test.questions.length}
        </div>
        ${q.image ? `<div class="question-image"><img src="${escapeAttr(q.image)}" alt=""></div>` : ''}
        <p class="question-text">${escapeHtml(q.q)}</p>
        <div id="syncOptions">
          ${q.options.map((opt, oi) => `
            <button class="opt" data-oi="${oi}">
              <span class="fig">${FIGURES[oi]}</span>
              <span>${escapeHtml(opt)}</span>
            </button>`).join('')}
        </div>
      </div>`;

    sss.querySelectorAll('[data-oi]').forEach(b => {
      b.onclick = () => submitSyncAnswer(code, idx, +b.dataset.oi, s.questionStartedAt, timeTotal);
    });

    // Тикающий таймер
    if (syncTimerInterval) clearInterval(syncTimerInterval);
    syncTimerInterval = setInterval(() => {
      const el = document.getElementById('syncTimer');
      if (!el) { clearInterval(syncTimerInterval); return; }
      const el2 = s.questionStartedAt ? (Date.now() - s.questionStartedAt) / 1000 : 0;
      const rem = Math.max(0, Math.floor(timeTotal - el2));
      el.textContent = rem;
      if (rem <= 5) el.parentElement.classList.add('warning');
      if (rem <= 0) { clearInterval(syncTimerInterval); }
    }, 500);
    return;
  }

  if (phase === 'results') {
    const q = test.questions[idx];
    const my = syncState.answersByQ[idx];
    const wasCorrect = my && my.correct;
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:72px;margin-bottom:8px;">${wasCorrect ? '🎉' : my ? '😔' : '⏱'}</div>
        <h2 style="color:${wasCorrect ? 'var(--green)' : 'var(--red)'};margin:0 0 8px;">
          ${wasCorrect ? 'Правильно!' : my ? 'Увы, неверно' : 'Время истекло'}
        </h2>
        ${my ? `<p style="color:var(--muted);font-weight:700;">+${my.points || 0} баллов</p>` : ''}
        <div style="margin-top:18px;padding:16px;background:#f8fafc;border-radius:14px;text-align:left;">
          <div style="font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase;margin-bottom:6px;">Правильный ответ</div>
          <div style="font-size:16px;font-weight:800;color:var(--green);">${escapeHtml(q.options[q.correct])}</div>
        </div>
        <div class="waiting-dots" style="margin-top:20px;"><span></span><span></span><span></span></div>
        <p style="color:#94a3b8;font-size:13px;font-weight:600;margin-top:14px;">Учитель покажет следующий вопрос</p>
      </div>`;
    return;
  }

  if (phase === 'leaderboard') {
    const studentsArr = Object.entries(s.students || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.score || 0) - (a.score || 0));
    const medal = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    sss.innerHTML = topbar + `
      <div class="leaderboard-screen">
        <h2>🏆 Лидерборд</h2>
        <p class="lb-sub">Топ-10 по баллам</p>
        <div class="lb-list">
          ${studentsArr.slice(0, 10).map((st, i) => `<div class="lb-item ${st.id === syncState.studentId ? 'me' : ''}">
            <div class="lb-rank ${medal(i)}">${i + 1}</div>
            <div class="lb-name">${escapeHtml(st.studentName || '—')}</div>
            <div class="lb-score">${st.score || 0}</div>
          </div>`).join('')}
        </div>
        <div class="waiting-dots"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (phase === 'finished') {
    const myRec = (s.students || {})[syncState.studentId] || {};
    sss.innerHTML = topbar + `
      <div class="sss-hero">
        <div style="font-size:72px;margin-bottom:8px;">🏁</div>
        <h2 style="color:var(--violet);margin:0 0 8px;">Тест завершён!</h2>
        <div class="score">${myRec.score || 0} / 100</div>
        <p style="color:#475569;font-weight:700;">${interpret(myRec.score || 0)}</p>
        <div style="display:flex;justify-content:center;gap:24px;margin-top:18px;padding-top:18px;border-top:2px solid #f1f5f9;">
          <div style="text-align:center;">
            <div class="ok" style="font-size:26px;font-weight:900;">${myRec.correctCount || 0}</div>
            <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Верных</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:26px;font-weight:900;color:var(--red);">${test.questions.length - (myRec.correctCount || 0)}</div>
            <div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;">Неверных</div>
          </div>
        </div>
      </div>`;
    return;
  }
}

async function submitSyncAnswer(code, idx, oi, questionStartedAt, timeTotal) {
  if (syncState.answersByQ[idx]) return; // уже отвечено
  const test = syncState.test;
  const q = test.questions[idx];
  const isCorrect = oi === q.correct;
  const timeSpentMs = questionStartedAt ? (Date.now() - questionStartedAt) : 0;
  const timeLeftSec = Math.max(0, timeTotal - timeSpentMs / 1000);

  // Баллы за вопрос: базовые + бонус за скорость (при желании можно отключить)
  const base = TOTAL_POINTS / test.questions.length;
  const speedBonus = isCorrect ? base * 0.3 * (timeLeftSec / timeTotal) : 0;
  const points = isCorrect ? Math.round(base + speedBonus) : 0;

  // Стрик
  if (isCorrect) syncState.currentStreak = (syncState.currentStreak || 0) + 1;
  else syncState.currentStreak = 0;
  const newMaxStreak = Math.max(syncState.maxStreak || 0, syncState.currentStreak || 0);

  const newCorrectCount = (syncState.correctCount || 0) + (isCorrect ? 1 : 0);
  const newScore = Math.min(100, (syncState.score || 0) + points);

  const answerRecord = {
    selected: oi,
    selectedText: q.options[oi],
    correct: isCorrect,
    questionText: q.q,
    correctText: q.options[q.correct],
    image: q.image || '',
    points,
    timeSpentMs,
    answeredAt: Date.now()
  };

  try {
    await window.FB.update(window.FB.ref(window.FB.db, `sessions/${code}/students/${syncState.studentId}`), {
      [`answers/${idx}`]: answerRecord,
      correctCount: newCorrectCount,
      score: newScore,
      maxStreak: newMaxStreak,
      lastAnswerAt: Date.now()
    });
    syncState.answersByQ[idx] = answerRecord;
    syncState.correctCount = newCorrectCount;
    syncState.score = newScore;
    syncState.maxStreak = newMaxStreak;
  } catch (e) { console.error('submitSyncAnswer:', e); }
}

/* ==================================================================
   MODAL HELPER
   ================================================================== */
function openModal(innerHTML, maxWidth, wide) {
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  const cls = wide ? 'modal wide' : 'modal';
  el.innerHTML = `<div class="${cls}" ${maxWidth ? `style="max-width:${maxWidth}px"` : ''}>${innerHTML}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
  return { el, close: () => el.remove(), $: s => el.querySelector(s), $$: s => el.querySelectorAll(s) };
}

/* ==================================================================
   ЗАПУСК
   ================================================================== */
function boot() {
  loadTests();
  if (mode === 'developer') {
    document.body.className = 'theme-developer';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'developer') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'developer' };
          renderDeveloperHome();
          return;
        }
      }
      renderAuth('developer');
    });
  } else if (mode === 'teacher') {
    document.body.className = 'theme-teacher';
    window.FB.auth.onAuthStateChanged(async (user) => {
      if (user) {
        let profile = getCachedProfile(user.uid);
        if (!profile) {
          const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${user.uid}`));
          profile = snap.val();
          if (profile) setCachedProfile(user.uid, profile);
        }
        if (profile && profile.role === 'teacher') {
          currentUser = { uid: user.uid, email: profile.email || user.email, role: 'teacher' };
          if (sessionCode) renderTeacherSession(); else renderTeacherHome();
          return;
        }
      }
      if (sessionCode) renderTeacherSession(); else renderAuth('teacher');
    });
  } else if (mode === 'student') {
    if (sessionCode) { document.body.className = 'theme-student'; renderStudentSession(); }
    else renderStudentEnterCode();
  } else {
    renderStudentEnterCode();
  }
}
fbReady(boot);
</script>
